<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 430" width="1220" height="430">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker>
  <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A7A"/></marker>
  <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D1495B"/></marker>
  <marker id="ahL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B3FA0"/></marker>
  <marker id="ahA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D98E2B"/></marker>
  <marker id="ahW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/></marker>
  <radialGradient id="liGlow"><stop offset="0" stop-color="#7B3FA0" stop-opacity="0.45"/><stop offset="1" stop-color="#7B3FA0" stop-opacity="0"/></radialGradient>
  <radialGradient id="anGlow"><stop offset="0" stop-color="#D98E2B" stop-opacity="0.35"/><stop offset="1" stop-color="#D98E2B" stop-opacity="0"/></radialGradient>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#7B3FA0" stroke-width="2" stroke-opacity="0.35"/></pattern>
</defs><rect x="10" y="20" width="170" height="100" rx="14" fill="#F7DADF"/><text x="95" y="62" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#D1495B" text-anchor="middle" font-weight="bold">AFTER USE</text><text x="95" y="90" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#5B6472" text-anchor="middle">right after peeling</text><circle cx="300" cy="70" r="50" fill="#F7DADF"/><path d="M270,92 L310,52" fill="none" stroke="#3D5A80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="304" y="40" width="26" height="16" rx="3" transform="rotate(-45 317 48)" fill="#3D5A80"/><rect x="266" y="94" width="60" height="8" rx="3" fill="#1F7A7A" opacity="0.6"/><circle cx="260" cy="30" r="16" fill="#D1495B"/><text x="260" y="36" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">1</text><line x1="362" y1="70" x2="496" y2="70" stroke="#C4CCD4" stroke-width="4" marker-end="url(#ah)"/><text x="300" y="152" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#14213D" text-anchor="middle" font-weight="bold">Scrape gently</text><text x="300" y="178" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6472" text-anchor="middle">PTFE or plastic spatula;</text><text x="300" y="200" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6472" text-anchor="middle">no metal, no scouring</text><circle cx="560" cy="70" r="50" fill="#F7DADF"/><path d="M534,42 L538,98 L582,98 L586,42" fill="#fff" stroke="#3D5A80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="539" y="64" width="42" height="32" fill="#9CCFE0"/><path d="M548,58 c4,-8 -4,-12 0,-20 M562,58 c4,-8 -4,-12 0,-20 M576,58 c4,-8 -4,-12 0,-20" fill="none" stroke="#D1495B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="520" cy="30" r="16" fill="#D1495B"/><text x="520" y="36" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">2</text><line x1="622" y1="70" x2="756" y2="70" stroke="#C4CCD4" stroke-width="4" marker-end="url(#ah)"/><text x="560" y="152" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#14213D" text-anchor="middle" font-weight="bold">Soak in warm water</text><text x="560" y="178" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6472" text-anchor="middle">DI water, 40–60 °C, ~1 h:</text><text x="560" y="200" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6472" text-anchor="middle">PEO and LiTFSI dissolve</text><circle cx="820" cy="70" r="50" fill="#F7DADF"/><rect x="790" y="66" width="60" height="30" rx="8" fill="#D98E2B"/><rect x="790" y="66" width="60" height="10" rx="5" fill="#6B8F3A"/><circle cx="802" cy="50" r="7" fill="#fff" stroke="#9CCFE0" stroke-width="3"/><circle cx="822" cy="44" r="9" fill="#fff" stroke="#9CCFE0" stroke-width="3"/><circle cx="840" cy="54" r="6" fill="#fff" stroke="#9CCFE0" stroke-width="3"/><circle cx="780" cy="30" r="16" fill="#D1495B"/><text x="780" y="36" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">3</text><line x1="882" y1="70" x2="1016" y2="70" stroke="#C4CCD4" stroke-width="4" marker-end="url(#ah)"/><text x="820" y="152" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#14213D" text-anchor="middle" font-weight="bold">Wash &amp; rinse</text><text x="820" y="178" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6472" text-anchor="middle">mild lab detergent, soft</text><text x="820" y="200" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6472" text-anchor="middle">sponge; DI rinse ×3</text><circle cx="1080" cy="70" r="50" fill="#F7DADF"/><rect x="1062" y="56" width="36" height="44" rx="8" fill="#fff" stroke="#3D5A80" stroke-width="4"/><path d="M1080,56 L1080,44 L1102,36" fill="none" stroke="#3D5A80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1080" y="84" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#3D5A80" text-anchor="middle" font-weight="bold">IPA</text><circle cx="1040" cy="30" r="16" fill="#D1495B"/><text x="1040" y="36" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="1080" y="152" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#14213D" text-anchor="middle" font-weight="bold">Solvent rinse</text><text x="1080" y="178" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6472" text-anchor="middle">IPA or ethanol; air-dry,</text><text x="1080" y="200" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6472" text-anchor="middle">store covered</text><rect x="10" y="230" width="170" height="100" rx="14" fill="#D3EBE8"/><text x="95" y="272" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1F7A7A" text-anchor="middle" font-weight="bold">BEFORE NEXT USE</text><text x="95" y="300" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#5B6472" text-anchor="middle">on casting day</text><circle cx="300" cy="280" r="50" fill="#D3EBE8"/><circle cx="294" cy="274" r="20" fill="#fff" stroke="#3D5A80" stroke-width="5"/><line x1="309" y1="289" x2="328" y2="308" stroke="#3D5A80" stroke-width="7" stroke-linecap="round"/><line x1="284" y1="278" x2="302" y2="268" stroke="#D1495B" stroke-width="2.5"/><circle cx="260" cy="240" r="16" fill="#1F7A7A"/><text x="260" y="246" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">5</text><line x1="362" y1="280" x2="496" y2="280" stroke="#C4CCD4" stroke-width="4" marker-end="url(#ah)"/><text x="300" y="362" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#14213D" text-anchor="middle" font-weight="bold">Inspect</text><text x="300" y="388" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6472" text-anchor="middle">scratches, stains, haze →</text><text x="300" y="410" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6472" text-anchor="middle">replace if damaged</text><circle cx="560" cy="280" r="50" fill="#D3EBE8"/><path d="M532,262 L582,254 L588,298 L538,306 Z" fill="#fff" stroke="#C4CCD4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M544,276 C554,268 566,284 576,276" fill="none" stroke="#3D5A80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="520" cy="240" r="16" fill="#1F7A7A"/><text x="520" y="246" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">6</text><line x1="622" y1="280" x2="756" y2="280" stroke="#C4CCD4" stroke-width="4" marker-end="url(#ah)"/><text x="560" y="362" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#14213D" text-anchor="middle" font-weight="bold">Rinse &amp; wipe</text><text x="560" y="388" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6472" text-anchor="middle">acetone or IPA, lint-free</text><text x="560" y="410" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6472" text-anchor="middle">wipe; touch edges only</text><circle cx="820" cy="280" r="50" fill="#D3EBE8"/><rect x="788" y="252" width="64" height="56" rx="6" fill="#fff" stroke="#3D5A80" stroke-width="4"/><text x="820" y="287" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#D1495B" text-anchor="middle" font-weight="bold">120°</text><circle cx="780" cy="240" r="16" fill="#1F7A7A"/><text x="780" y="246" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">7</text><line x1="882" y1="280" x2="1016" y2="280" stroke="#C4CCD4" stroke-width="4" marker-end="url(#ah)"/><text x="820" y="362" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#14213D" text-anchor="middle" font-weight="bold">Dry / bake</text><text x="820" y="388" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6472" text-anchor="middle">100–120 °C, ≥ 2 h (vacuum</text><text x="820" y="410" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6472" text-anchor="middle">ideal); never &gt; 250 °C</text><circle cx="1080" cy="280" r="50" fill="#D3EBE8"/><rect x="1046" y="256" width="68" height="48" rx="6" fill="#fff" stroke="#3D5A80" stroke-width="4"/><circle cx="1066" cy="282" r="10" fill="#DCE5EF" stroke="#3D5A80" stroke-width="3"/><circle cx="1094" cy="282" r="10" fill="#DCE5EF" stroke="#3D5A80" stroke-width="3"/><text x="1080" y="250" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#1F7A7A" text-anchor="middle" font-weight="bold">Ar</text><circle cx="1040" cy="240" r="16" fill="#1F7A7A"/><text x="1040" y="246" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">8</text><text x="1080" y="362" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#14213D" text-anchor="middle" font-weight="bold">Transfer warm</text><text x="1080" y="388" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6472" text-anchor="middle">into antechamber, evacuate;</text><text x="1080" y="410" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6472" text-anchor="middle">cast inside the glovebox</text></svg>