</defs><rect x="20" y="20" width="270" height="90" rx="14" fill="#EEF2F4" stroke="#C4CCD4" stroke-width="2"/><text x="155" y="58" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#14213D" text-anchor="middle" font-weight="bold">LiTFSI (crystal) + PEO</text><text x="155" y="88" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="19" fill="#5B6472" text-anchor="middle">ordered lattice, free chains</text><rect x="470" y="20" width="270" height="90" rx="14" fill="#FBE9CF" stroke="#D98E2B" stroke-width="2"/><text x="605" y="58" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#14213D" text-anchor="middle" font-weight="bold">Li⁺(g) + TFSI⁻(g)</text><text x="605" y="88" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="19" fill="#5B6472" text-anchor="middle">isolated gas-phase ions</text><rect x="220" y="350" width="320" height="100" rx="14" fill="#D3EBE8" stroke="#1F7A7A" stroke-width="2"/><text x="380" y="388" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#14213D" text-anchor="middle" font-weight="bold">Li⁺(EO)ₓ + TFSI⁻ in PEO</text><text x="380" y="418" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="19" fill="#5B6472" text-anchor="middle">solvated ions in the melt</text><line x1="295" y1="65" x2="462" y2="65" stroke="#D1495B" stroke-width="4" marker-end="url(#ahO)"/><text x="378" y="52" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#D1495B" text-anchor="middle" font-weight="bold">+U(lattice)</text><text x="378" y="95" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#D1495B" text-anchor="middle">cost (endothermic)</text><path d="M610,115 C620,230 590,330 548,380" fill="none" stroke="#1F7A7A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahT)"/><text x="628" y="215" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#1F7A7A" text-anchor="start" font-weight="bold">ΔH(solv) &lt; 0</text><text x="628" y="242" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#1F7A7A" text-anchor="start">Li⁺···O gain</text><text x="628" y="265" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#1F7A7A" text-anchor="start">(dominant term)</text><path d="M175,115 C170,230 185,330 220,380" fill="none" stroke="#7B3FA0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahL)"/><text x="20" y="200" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#7B3FA0" text-anchor="start" font-weight="bold">ΔG(dis) =</text><text x="20" y="228" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#7B3FA0" text-anchor="start" font-weight="bold">ΔH − TΔS</text><text x="20" y="262" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#7B3FA0" text-anchor="start">must be &lt; 0</text><rect x="250" y="175" width="300" height="120" rx="12" fill="#FFFFFF" stroke="#C4CCD4" stroke-width="2" stroke-dasharray="6 5"/><text x="400" y="208" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="21" fill="#14213D" text-anchor="middle" font-weight="bold">Entropy penalty</text><text x="400" y="236" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6472" text-anchor="middle">chains lose freedom wrapping Li⁺</text><text x="400" y="262" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6472" text-anchor="middle">→ TΔS &lt; 0 grows with T;</text><text x="400" y="284" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6472" text-anchor="middle">some salts precipitate on heating</text></svg>