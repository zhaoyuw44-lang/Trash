</defs><rect x="10" y="10" width="278" height="220" rx="16" fill="#EEF2F4"/><text x="28" y="50" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#14213D" text-anchor="start" font-weight="bold">PEO</text><rect x="28" y="64" width="90" height="28" rx="14" fill="#1F7A7A"/><text x="40" y="84" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#fff" text-anchor="start" font-weight="bold">ether</text><text x="28" y="134" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="21" text-anchor="start"><tspan fill="#1F2937">–(CH₂–CH₂–</tspan><tspan fill="#D1495B" font-weight="bold">O</tspan><tspan fill="#1F2937">)ₙ–</tspan></text><text x="28" y="208" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#5B6472" text-anchor="start">reference; semicrystalline, Tm ≈ 65 °C</text><rect x="302" y="10" width="278" height="220" rx="16" fill="#EEF2F4"/><text x="320" y="50" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#14213D" text-anchor="start" font-weight="bold">Comb polysiloxane</text><rect x="320" y="64" width="194" height="28" rx="14" fill="#1F7A7A"/><text x="332" y="84" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#fff" text-anchor="start" font-weight="bold">ether side chains</text><text x="320" y="134" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="21" text-anchor="start"><tspan fill="#1F2937">–(Si(CH₃)–O)ₙ–</tspan></text><text x="320" y="164" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="19" text-anchor="start"><tspan fill="#1F2937">side: –(CH₂CH₂</tspan><tspan fill="#D1495B" font-weight="bold">O</tspan><tspan fill="#1F2937">)ₘCH₃</tspan></text><text x="320" y="208" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#5B6472" text-anchor="start">very flexible Si–O backbone</text><rect x="594" y="10" width="278" height="220" rx="16" fill="#EEF2F4"/><text x="612" y="50" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#14213D" text-anchor="start" font-weight="bold">MEEP polyphosphazene</text><rect x="612" y="64" width="194" height="28" rx="14" fill="#7B3FA0"/><text x="624" y="84" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#fff" text-anchor="start" font-weight="bold">ether side chains</text><text x="612" y="134" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="21" text-anchor="start"><tspan fill="#1F2937">–(N=P(OR)₂)ₙ–</tspan></text><text x="612" y="164" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="19" text-anchor="start"><tspan fill="#1F2937">R = (CH₂CH₂</tspan><tspan fill="#D1495B" font-weight="bold">O</tspan><tspan fill="#1F2937">)₂CH₃</tspan></text><text x="612" y="208" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#5B6472" text-anchor="start">Tg ≈ −84 °C; flows, needs x-linking</text><rect x="886" y="10" width="278" height="220" rx="16" fill="#EEF2F4"/><text x="904" y="50" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#14213D" text-anchor="start" font-weight="bold">PDOL (in situ)</text><rect x="904" y="64" width="164" height="28" rx="14" fill="#1F7A7A"/><text x="916" y="84" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#fff" text-anchor="start" font-weight="bold">ether / acetal</text><text x="904" y="134" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="21" text-anchor="start"><tspan fill="#1F2937">–(CH₂–</tspan><tspan fill="#D1495B" font-weight="bold">O</tspan><tspan fill="#1F2937">–CH₂CH₂–</tspan><tspan fill="#D1495B" font-weight="bold">O</tspan><tspan fill="#1F2937">)ₙ–</tspan></text><text x="904" y="208" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#5B6472" text-anchor=