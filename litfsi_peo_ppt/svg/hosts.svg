22" fill="#14213D" text-anchor="start" font-weight="bold">PCL</text><rect x="612" y="299" width="90" height="28" rx="14" fill="#D98E2B"/><text x="624" y="319" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#fff" text-anchor="start" font-weight="bold">ester</text><text x="612" y="369" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="21" text-anchor="start"><tspan fill="#1F2937">–((CH₂)₅–</tspan><tspan fill="#D98E2B" font-weight="bold">C(=O)–O</tspan><tspan fill="#1F2937">)ₙ–</tspan></text><text x="612" y="443" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#5B6472" text-anchor="start">semicrystalline; used in P(TMC-co-CL)</text><rect x="886" y="245" width="278" height="220" rx="16" fill="#EEF2F4"/><text x="904" y="285" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#14213D" text-anchor="start" font-weight="bold">PAN</text><rect x="904" y="299" width="94" height="28" rx="14" fill="#3D5A80"/><text x="916" y="319" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#fff" text-anchor="start" font-weight="bold">nitrile</text><text x="904" y="369" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="21" text-anchor="start"><tspan fill="#1F2937">–(CH₂–CH(</tspan><tspan fill="#3D5A80" font-weight="bold">C≡N</tspan><tspan fill="#1F2937">))ₙ–</tspan></text><text x="904" y="443" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#5B6472" text-anchor="start">polar, oxidation-resistant; mostly gels</text></svg>