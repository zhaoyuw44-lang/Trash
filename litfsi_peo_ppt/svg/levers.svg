ial, sans-serif" font-size="18" fill="#1F7A7A" text-anchor="middle">vertical channels: PEO–LiTFSI</text><text x="170" y="349" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#3D5A80" text-anchor="middle">scaffold: polyimide / ceramic</text><text x="470" y="32" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6472" text-anchor="start" font-weight="bold">lever</text><text x="830" y="32" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5B6472" text-anchor="start" font-weight="bold">indicative gain (log scale)</text><text x="470" y="82" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#14213D" text-anchor="start" font-weight="bold">Suppress crystallinity</text><text x="470" y="106" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#5B6472" text-anchor="start">RT σ ~10⁻⁵ → ~10⁻⁴</text><rect x="830" y="68" width="260" height="32" rx="6" fill="#1F7A7A"/><text x="1098" y="92" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1F7A7A" text-anchor="start" font-weight="bold">×10</text><text x="470" y="146" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#14213D" text-anchor="start" font-weight="bold">Thinner film</text><text x="470" y="170" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#5B6472" text-anchor="start">50 → 10 µm</text><rect x="830" y="132" width="181.7322011273649" height="32" rx="6" fill="#3D5A80"/><text x="1019.7322011273649" y="156" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#3D5A80" text-anchor="start" font-weight="bold">×5</text><text x="470" y="210" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#14213D" text-anchor="start" font-weight="bold">Run warm</text><text x="470" y="234" font-family="Calibri, Carlito, 