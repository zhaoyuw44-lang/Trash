i&quot;, system-ui, sans-serif;font-size:12px;font-weight:700">例：σ<tspan dy="3.4" font-size="8.6" style="fill:rgb(19, 28, 38);fill-opacity:1;stroke:none;stroke-opacity:1;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Sans&quot;, &quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif;font-size:8.6px;font-weight:700">0</tspan><tspan dy="-3.4" style="fill:rgb(19, 28, 38);fill-opacity:1;stroke:none;stroke-opacity:1;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Sans&quot;, &quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif;font-size:12px;font-weight:700"> = 10 mS/cm → N</tspan><tspan dy="3.4" font-size="8.6" style="fill:rgb(19, 28, 38);fill-opacity:1;stroke:none;stroke-opacity:1;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Sans&quot;, &quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif;font-size:8.6px;font-weight:700">M</tspan><tspan dy="-3.4" style="fill:rgb(19, 28, 38);fill-opacity:1;stroke:none;stroke-opacity:1;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Sans&quot;, &quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif;font-size:12px;font-weight:700"> ≈ 11</tspan></text><text x="200" y="196" font-size="10" text-anchor="middle" style="fill:rgb(86, 97, 110);fill-opacity:1;stroke:none;stroke-opacity:1;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Sans&quot;, &quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif;font-size:10px;font-weight:400">隔膜让电阻变大的倍数（孔隙率、曲折度）</text><rect x=