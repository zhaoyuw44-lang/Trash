<svg viewBox="0 0 400 220" role="img" aria-label="Calculation: the effective conductivity σeff equals the single-layer thickness divided by the product of per-layer resistance and area. Example: 0.0025 cm divided by (1.41 ohms times 2.01 cm²), about 0.88 mS/cm. The MacMullin number NM equals the conductivity of the electrolyte itself divided by σeff, about 11 in the example." xmlns="http://www.w3.org/2000/svg" width="400" height="220"><rect width="100%" height="100%" fill="#FFFFFF"></rect><text x="200" y="34" font-size="16" text-anchor="middle" font-weight="700" style="fill:rgb(19, 28, 38);fill-opacity:1;stroke:none;stroke-opacity:1;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Sans&quot;, &quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif;font-size:16px;font-weight:700">σ<tspan dy="4.5" font-size="11.5" style="fill:rgb(19, 28, 38);fill-opacity:1;stroke:none;stroke-opacity:1;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Sans&quot;, &quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif;font-size:11.5px;font-weight:700">eff</tspan><tspan dy="-4.5" style="fill:rgb(19, 28, 38);fill-opacity:1;stroke:none;stroke-opacity:1;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Sans&quot;, &quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif;font-size:16px;font-weight:700"> = L</tspan><tspan dy="4.5" font-size="11.5" style="fill:rgb(19, 28, 38);fill-opacity:1;stroke:none;stroke-opacity:1;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Sans&quot;, &quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif;font-size:11.5px;font-weight:700">1</tspan><tspan dy="-4.5" style="fill:rgb(19, 28, 38);fill-opacity:1;stroke:none;stroke-opacity:1;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Sans&quot;, &quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif;font-size:16px;font-weight:700"> / (R</tspan><tspan dy="4.5" font-size="11.5" style="fill:rgb(19, 28, 38);fill-opacity:1;stroke:none;stroke-opacity:1;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Sans&quot;, &quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif;font-size:11.5px;font-weight:700">layer</tspan><tspan dy="-4.5" style="fill:rgb(19, 28, 38);fill-opacity:1;stroke:none;stroke-opacity:1;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Sans&quot;, &quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif;font-size:16px;font-weight:700"> · A)</tspan></text><text x="200" y="58" font-size="11" text-anchor="middle" style="fill:rgb(19, 28, 38);fill-opacity:1;stroke:none;stroke-opacity:1;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;JetBrains Mono&quot;, &quot;Noto Sans SC&quot;, ui-monospace, SFMono-Regular, Menlo, monospace;font-size:11px;font-weight:400">= 0.0025 cm ÷ (1.41 Ω × 2.01 cm²)</text><text x="200" y="82" font-size="13.5" text-anchor="middle" font-weight="700" style="fill:rgb(30, 91, 168);fill-opacity:1;stroke:none;stroke-opacity:1;stroke-width:1px;stroke-dasharray:none;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Sans&quot;, &quot;Noto Sans SC&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif;font-size:13.5px;font-weight:700">= 8.8 × 10⁻⁴ S/cm = 0.8