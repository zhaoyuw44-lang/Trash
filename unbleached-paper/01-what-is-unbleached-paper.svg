<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#2B2620">
  <title>What is unbleached paper?</title>
  <desc>From wood to paper: pulping frees the cellulose fibers and leaves a little brown lignin behind. Unbleached paper skips the bleaching step and the optical brighteners and fillers that white paper usually gets.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A7F73"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#5A4630" flood-opacity="0.10"/>
    </filter>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="barClip"><rect x="82" y="420" width="256" height="24" rx="6"/></clipPath>
    <clipPath id="vessel"><rect x="450" y="215" width="80" height="125" rx="22"/></clipPath>
    <clipPath id="lensU"><circle cx="1212" cy="290" r="36"/></clipPath>
    <clipPath id="lensB"><circle cx="1212" cy="510" r="36"/></clipPath>
    <clipPath id="tbl"><rect x="60" y="590" width="1480" height="252" rx="14"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="#FBF8F2"/>

  <!-- Title -->
  <text x="60" y="76" font-size="42" font-weight="700">What is unbleached paper?</text>
  <text x="60" y="110" font-size="20" fill="#6B6259">Same cellulose fibers as white paper — minus the bleaching step and the additives that usually come with it.</text>

  <!-- 1 · Wood -->
  <rect x="60" y="140" width="300" height="420" rx="16" fill="#FFFFFF" stroke="#E6DED1" filter="url(#sh)"/>
  <circle cx="92" cy="176" r="15" fill="#2B2620"/>
  <text x="92" y="181.5" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="118" y="183" font-size="22" font-weight="700">Wood</text>

  <circle cx="210" cy="290" r="80" fill="#6E4A2E"/>
  <circle cx="210" cy="290" r="75" fill="none" stroke="#563820" stroke-width="3" stroke-dasharray="4 7"/>
  <circle cx="210" cy="290" r="70" fill="#E6CB9E"/>
  <g fill="none" stroke="#C9A36E" stroke-width="2">
    <circle cx="211" cy="291" r="58"/>
    <circle cx="211" cy="290" r="46"/>
    <circle cx="210" cy="291" r="34"/>
    <circle cx="210" cy="290" r="22"/>
    <circle cx="210" cy="290" r="11"/>
  </g>
  <circle cx="210" cy="290" r="4" fill="#A8784A"/>

  <text x="82" y="408" font-size="15" fill="#6B6259">Typical dry composition</text>
  <g clip-path="url(#barClip)">
    <rect x="82" y="420" width="115.2" height="24" fill="#EADBB8"/>
    <rect x="197.2" y="420" width="76.8" height="24" fill="#CFAE7A"/>
    <rect x="274" y="420" width="64" height="24" fill="#7A5233"/>
  </g>
  <g font-size="15">
    <rect x="82" y="459" width="14" height="14" rx="3" fill="#EADBB8" stroke="#CDBB92"/>
    <text x="104" y="471"><tspan font-weight="700">Cellulose</tspan> 40–50% · the fibers</text>
    <rect x="82" y="485" width="14" height="14" rx="3" fill="#CFAE7A"/>
    <text x="104" y="497"><tspan font-weight="700">Hemicellulose</tspan> 25–35%</text>
    <rect x="82" y="511" width="14" height="14" rx="3" fill="#7A5233"/>
    <text x="104" y="523"><tspan font-weight="700">Lignin</tspan> 20–30% · brown “glue”</text>
  </g>

  <line x1="364" y1="350" x2="404" y2="350" stroke="#8A7F73" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 2 · Pulping -->
  <rect x="410" y="140" width="300" height="420" rx="16" fill="#FFFFFF" stroke="#E6DED1" filter="url(#sh)"/>
  <circle cx="442" cy="176" r="15" fill="#2B2620"/>
  <text x="442" y="181.5" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="468" y="183" font-size="22" font-weight="700">Pulping <tspan font-size="15" font-weight="400" fill="#6B6259">(kraft process)</tspan></text>

  <g fill="none" stroke="#A9B0B8" stroke-width="2" stroke-linecap="round">
    <path d="M472,210 q5,-5 0,-10 q-5,-5 0,-10"/>
    <path d="M490,210 q5,-5 0,-10 q-5,-5 0,-10"/>
    <path d="M508,210 q5,-5 0,-10 q-5,-5 0,-10"/>
  </g>
  <rect x="450" y="215" width="80" height="125" rx="22" fill="#EEF2F6"/>
  <g clip-path="url(#vessel)">
    <path d="M450,264 q10,-5 20,0 t20,0 t20,0 t20,0 V345 H450 Z" fill="#C79B63"/>
    <g fill="#EAD2A8" stroke="#9C6E42" stroke-width="0.8">
      <rect x="460" y="282" width="12" height="6" transform="rotate(-20 466 285)"/>
      <rect x="490" y="297" width="12" height="6" transform="rotate(25 496 300)"/>
      <rect x="506" y="278" width="12" height="6" transform="rotate(10 512 281)"/>
      <rect x="474" y="315" width="12" height="6" transform="rotate(-35 480 318)"/>
      <rect x="500" y="322" width="12" height="6" transform="rotate(15 506 325)"/>
    </g>
    <g fill="#FFFFFF" opacity="0.6">
      <circle cx="470" cy="302" r="2.5"/>
      <circle cx="500" cy="288" r="2"/>
      <circle cx="488" cy="276" r="2.5"/>
      <circle cx="516" cy="310" r="2"/>
    </g>
  </g>
  <rect x="450" y="215" width="80" height="125" rx="22" fill="none" stroke="#8D99A6" stroke-width="2"/>
  <g>
    <path d="M472,364 c-8,-6 -6,-14 0,-20 c6,6 8,14 0,20 z" fill="#E9844A"/>
    <path d="M490,364 c-8,-6 -6,-14 0,-20 c6,6 8,14 0,20 z" fill="#E9844A"/>
    <path d="M508,364 c-8,-6 -6,-14 0,-20 c6,6 8,14 0,20 z" fill="#E9844A"/>
    <path d="M472,364 c-4,-3 -3,-7 0,-10 c3,3 4,7 0,10 z" fill="#F5C05A"/>
    <path d="M490,364 c-4,-3 -3,-7 0,-10 c3,3 4,7 0,10 z" fill="#F5C05A"/>
    <path d="M508,364 c-4,-3 -3,-7 0,-10 c3,3 4,7 0,10 z" fill="#F5C05A"/>
  </g>
  <text x="548" y="262" font-size="17" font-weight="700">NaOH + Na₂S</text>
  <text x="548" y="286" font-size="15" fill="#6B6259">≈ 170 °C</text>
  <text x="548" y="306" font-size="15" fill="#6B6259">a few hours</text>

  <text x="432" y="400" font-size="16">Cooking dissolves most of the</text>
  <text x="432" y="422" font-size="16">lignin and frees the fibers.</text>
  <line x1="432" y1="444" x2="688" y2="444" stroke="#E6DED1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <g fill="#B88A5A">
    <circle cx="452" cy="492" r="14"/>
    <circle cx="470" cy="482" r="15"/>
    <circle cx="474" cy="502" r="13"/>
    <circle cx="458" cy="508" r="11"/>
  </g>
  <g fill="none" stroke="#8F6438" stroke-width="1.6" stroke-linecap="round">
    <path d="M444,486 c8,-6 18,4 28,-4"/>
    <path d="M450,502 c10,2 14,-8 26,-2"/>
    <path d="M462,474 c-2,10 6,18 2,30"/>
  </g>
  <text x="500" y="482" font-size="17" font-weight="700">Brown kraft pulp</text>
  <text x="500" y="504" font-size="15" fill="#4A423A">fibers + a few % of</text>
  <text x="500" y="524" font-size="15" fill="#4A423A">residual lignin</text>

  <!-- fork -->
  <path d="M714,350 C752,350 748,240 786,240" fill="none" stroke="#8A7F73" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M714,350 C752,350 748,460 786,460" fill="none" stroke="#8A7F73" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 3a · No bleaching -->
  <rect x="790" y="180" width="250" height="120" rx="14" fill="#FBF3E8" stroke="#C9A06B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="812" y="218" font-size="18" font-weight="700" fill="#7A5233">3a · No bleaching</text>
  <text x="812" y="246" font-size="15" fill="#4A423A">Fibers go straight to</text>
  <text x="812" y="268" font-size="15" fill="#4A423A">the paper machine.</text>
  <line x1="1044" y1="240" x2="1084" y2="240" stroke="#8A7F73" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- 3b · Bleaching -->
  <rect x="790" y="390" width="250" height="140" rx="14" fill="#EEF2F7" stroke="#B8C2CE" stroke-width="1.5"/>
  <text x="812" y="426" font-size="18" font-weight="700" fill="#3D5266">3b · Bleaching</text>
  <text x="812" y="454" font-size="15" font-weight="700" fill="#3D5266">ClO₂ · O₂ · H₂O₂ · O₃</text>
  <text x="812" y="480" font-size="15" fill="#4A423A">removes leftover lignin,</text>
  <text x="812" y="502" font-size="15" fill="#4A423A">then additives go in.</text>
  <line x1="1044" y1="460" x2="1084" y2="460" stroke="#8A7F73" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Unbleached product -->
  <rect x="1090" y="140" width="450" height="200" rx="16" fill="#F6EBDC" stroke="#D9BC97" filter="url(#sh)"/>
  <path d="M1115,165 h88 l22,22 v128 h-110 z" fill="#C89B6D" stroke="#9C6E42" stroke-width="1.2"/>
  <path d="M1203,165 v22 h22 z" fill="#B5875A" stroke="#9C6E42" stroke-width="1.2" stroke-linejoin="round"/>
  <g fill="none" stroke="#B48557" stroke-width="1.2" opacity="0.8">
    <path d="M1124,190 c20,-4 40,6 64,0"/>
    <path d="M1122,212 c24,6 46,-6 72,2"/>
    <path d="M1126,236 c18,-6 34,4 58,-2"/>
    <path d="M1121,258 c20,4 30,-4 44,2"/>
  </g>
  <g clip-path="url(#lensU)">
    <rect x="1170" y="250" width="84" height="84" fill="#EBD5B3"/>
    <g fill="none" stroke-linecap="round">
      <path d="M1172,268 C1195,262 1220,280 1252,272" stroke="#C99E68" stroke-width="6"/>
      <path d="M1174,300 C1198,288 1226,310 1252,296" stroke="#D2AB78" stroke-width="5"/>
      <path d="M1190,252 C1196,280 1186,305 1200,330" stroke="#BF925C" stroke-width="5"/>
      <path d="M1230,254 C1222,282 1238,300 1228,330" stroke="#CDA472" stroke-width="6"/>
      <path d="M1176,318 C1200,312 1225,326 1250,316" stroke="#C99E68" stroke-width="4"/>
    </g>
    <g fill="#6E4A2E">
      <circle cx="1196" cy="276" r="2.4"/>
      <circle cx="1219" cy="292" r="2.4"/>
      <circle cx="1205" cy="309" r="2.4"/>
      <circle cx="1232" cy="281" r="2.4"/>
      <circle cx="1240" cy="306" r="2.4"/>
      <circle cx="1188" cy="296" r="2.4"/>
      <circle cx="1224" cy="318" r="2.4"/>
    </g>
  </g>
  <circle cx="1212" cy="290" r="36" fill="none" stroke="#3F362E" stroke-width="3.5"/>
  <line x1="1238" y1="316" x2="1252" y2="330" stroke="#3F362E" stroke-width="6" stroke-linecap="round"/>
  <text x="1272" y="182" font-size="21" font-weight="700" fill="#7A5233">Unbleached paper</text>
  <g font-size="16" fill="#3A322B">
    <text x="1272" y="216">• Tan/brown = residual lignin</text>
    <text x="1272" y="242">• No bleaching chemistry</text>
    <text x="1272" y="268">• Usually no optical</text>
    <text x="1285" y="290">brighteners (OBAs)</text>
  </g>
  <text x="1272" y="322" font-size="13" fill="#6B6259">magnified: fibers + lignin specks</text>

  <!-- Bleached product -->
  <rect x="1090" y="360" width="450" height="200" rx="16" fill="#FFFFFF" stroke="#CBD3DC" filter="url(#sh)"/>
  <path d="M1115,385 h88 l22,22 v128 h-110 z" fill="#FFFFFF" stroke="#AEB7C2" stroke-width="1.2"/>
  <path d="M1203,385 v22 h22 z" fill="#E9EDF2" stroke="#AEB7C2" stroke-width="1.2" stroke-linejoin="round"/>
  <g fill="none" stroke="#E3E8EE" stroke-width="1.2">
    <path d="M1124,410 c20,-4 40,6 64,0"/>
    <path d="M1122,432 c24,6 46,-6 72,2"/>
    <path d="M1126,456 c18,-6 34,4 58,-2"/>
    <path d="M1121,478 c20,4 30,-4 44,2"/>
  </g>
  <g clip-path="url(#lensB)">
    <rect x="1170" y="470" width="84" height="84" fill="#F7F9FB"/>
    <g fill="none" stroke-linecap="round" stroke="#D8DEE6">
      <path d="M1172,488 C1195,482 1220,500 1252,492" stroke-width="6"/>
      <path d="M1174,520 C1198,508 1226,530 1252,516" stroke-width="5"/>
      <path d="M1190,472 C1196,500 1186,525 1200,550" stroke-width="5"/>
      <path d="M1230,474 C1222,502 1238,520 1228,550" stroke-width="6"/>
      <path d="M1176,538 C1200,532 1225,546 1250,536" stroke-width="4"/>
    </g>
    <g fill="#A9B0B8">
      <rect x="1200" y="494" width="5" height="5" transform="rotate(20 1202 496)"/>
      <rect x="1226" y="526" width="5" height="5" transform="rotate(-15 1228 528)"/>
      <rect x="1184" y="514" width="5" height="5"/>
      <circle cx="1240" cy="500" r="2.4"/>
      <circle cx="1212" cy="540" r="2.4"/>
    </g>
    <g fill="#3D8EF0" filter="url(#glow)">
      <circle cx="1196" cy="502" r="2.4"/>
      <circle cx="1219" cy="512" r="2.4"/>
      <circle cx="1205" cy="529" r="2.4"/>
      <circle cx="1232" cy="490" r="2.4"/>
      <circle cx="1242" cy="522" r="2.4"/>
      <circle cx="1186" cy="532" r="2.4"/>
    </g>
  </g>
  <circle cx="1212" cy="510" r="36" fill="none" stroke="#3F362E" stroke-width="3.5"/>
  <line x1="1238" y1="536" x2="1252" y2="550" stroke="#3F362E" stroke-width="6" stroke-linecap="round"/>
  <text x="1272" y="402" font-size="21" font-weight="700" fill="#3D5266">Bleached paper</text>
  <g font-size="16" fill="#3A322B">
    <text x="1272" y="436">• Lignin removed → white</text>
    <text x="1272" y="462">• Often + optical</text>
    <text x="1285" y="484">brighteners (OBAs)</text>
    <text x="1272" y="510">• Fillers (CaCO₃, clay, TiO₂)</text>
  </g>
  <text x="1272" y="542" font-size="13" fill="#6B6259">magnified: fibers + <tspan fill="#2F7FDF">brightener</tspan> + filler</text>

  <!-- Comparison table -->
  <rect x="60" y="590" width="1480" height="252" rx="14" fill="#FFFFFF" stroke="#E6DED1" filter="url(#sh)"/>
  <g clip-path="url(#tbl)">
    <rect x="60" y="590" width="380" height="42" fill="#F3EDE3"/>
    <rect x="440" y="590" width="550" height="42" fill="#F1E2CC"/>
    <rect x="990" y="590" width="550" height="42" fill="#E9EEF4"/>
  </g>
  <g stroke="#EEE7DC" stroke-width="1.2">
    <line x1="440" y1="590" x2="440" y2="842"/>
    <line x1="990" y1="590" x2="990" y2="842"/>
    <line x1="60" y1="674" x2="1540" y2="674"/>
    <line x1="60" y1="716" x2="1540" y2="716"/>
    <line x1="60" y1="758" x2="1540" y2="758"/>
    <line x1="60" y1="800" x2="1540" y2="800"/>
  </g>
  <rect x="60" y="590" width="1480" height="252" rx="14" fill="none" stroke="#E6DED1"/>

  <text x="82" y="617" font-size="15" font-weight="700" fill="#6B6259">At a glance</text>
  <text x="462" y="618" font-size="17" font-weight="700" fill="#7A5233">Unbleached</text>
  <text x="1012" y="618" font-size="17" font-weight="700" fill="#3D5266">Bleached (white)</text>

  <g font-size="15.5" font-weight="700" fill="#3A322B">
    <text x="82" y="659">Color</text>
    <text x="82" y="701">Residual lignin</text>
    <text x="82" y="743">Optical brighteners (OBAs)</text>
    <text x="82" y="785">Under a 365 nm UV lamp</text>
    <text x="82" y="827">Typical lab forms</text>
  </g>

  <g font-size="16" fill="#3A322B">
    <rect x="462" y="645" width="18" height="18" rx="4" fill="#C89B6D" stroke="#9C6E42"/>
    <text x="490" y="659">Tan to brown</text>
    <text x="462" y="701">A few % — it is what gives the color</text>
    <text x="462" y="743">Usually none*</text>
    <rect x="462" y="771" width="18" height="18" rx="4" fill="#4A3A2C"/>
    <text x="490" y="785">Stays dull / dark</text>
    <text x="462" y="827">Brown paper towels, kraft paper rolls</text>

    <rect x="1012" y="645" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#AEB7C2"/>
    <text x="1040" y="659">Bright white</text>
    <text x="1012" y="701">Essentially none</text>
    <text x="1012" y="743">Common in office and consumer paper</text>
    <rect x="1012" y="771" width="18" height="18" rx="4" fill="#BFE0FF" filter="url(#glow)"/>
    <rect x="1012" y="771" width="18" height="18" rx="4" fill="#8FC6FF"/>
    <text x="1040" y="785">Glows blue — the brighteners fluoresce</text>
    <text x="1012" y="827">White paper towels, tissues, copy paper</text>
  </g>

  <text x="60" y="870" font-size="14" fill="#6B6259">* “Unbleached” ≠ additive-free: brown towels can contain recycled fiber (which may carry some brightener) and wet-strength resin.</text>
  <text x="60" y="890" font-size="14" fill="#6B6259">Quick check: look at a sheet under a 365 nm TLC lamp.</text>
</svg>
