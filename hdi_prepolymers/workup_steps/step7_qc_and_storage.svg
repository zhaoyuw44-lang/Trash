<svg xmlns="http://www.w3.org/2000/svg" width="380" height="540" viewBox="0 0 380 540" font-family="Arial, Helvetica, sans-serif" role="img"><title>Prepolymer work-up: step7_qc_and_storage.svg</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="379" height="539" rx="14" fill="#ffffff" stroke="#dcdbd5"/>
<circle cx="34" cy="36" r="16" fill="#2a78d6"/>
<text x="34.0" y="41.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">7</text>
<text x="60.0" y="42.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-style="normal">QC and storage</text>
<text x="60.0" y="61.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" font-style="normal">before the prepolymer is used</text>
<rect x="70" y="120" width="70" height="150" rx="8" fill="#fbfcfd" stroke="#3d3d3a" stroke-width="2"/><rect x="72" y="196" width="66" height="72" rx="6" fill="#f2c46d"/><rect x="64" y="104" width="82" height="20" rx="4" fill="#5c5b57"/><rect x="76" y="210" width="58" height="26" rx="3" fill="#ffffff" stroke="#c99a3c"/><text x="105.0" y="227.0" font-size="10.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal">NCO-PP</text><text x="105.0" y="160.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="bold" font-style="normal">N<tspan baseline-shift="sub" font-size="75%">2</tspan></text><text x="105.0" y="176.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">headspace</text><text x="105.0" y="296.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal">4 &#176;C, dark, sealed</text><path d="M178.0,134.0 l4,4 l8,-9" fill="none" stroke="#0ca30c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="198.0" y="140.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-style="normal">NCO titration (ASTM D2572)</text><text x="198.0" y="157.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" font-style="normal">theory 11.4 (PE) / 8.4 (GE) wt%</text><path d="M178.0,186.0 l4,4 l8,-9" fill="none" stroke="#0ca30c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="198.0" y="192.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-style="normal"><tspan baseline-shift="super" font-size="75%">1</tspan>H NMR: &#8747;b : &#8747;f = 1 : 1</text><text x="198.0" y="209.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" font-style="normal">free HDI &#8804; 0.5 wt%</text><path d="M178.0,238.0 l4,4 l8,-9" fill="none" stroke="#0ca30c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="198.0" y="244.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-style="normal">yield vs. theory</text><text x="198.0" y="261.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal" font-style="normal">low? product partly in hexane</text>
<line x1="20.0" y1="338.0" x2="360.0" y2="338.0" stroke="#dcdbd5" stroke-width="1" />
<text x="26.0" y="362.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">&#8226;&#160;&#160;Store under N<tspan baseline-shift="sub" font-size="75%">2</tspan>/Ar, tightly sealed, 4 &#176;C</text>
<text x="26.0" y="385.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">&#8226;&#160;&#160;Warm to room temperature before opening</text>
<text x="38.0" y="403.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">(no condensation on the product)</text>
<text x="26.0" y="426.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">&#8226;&#160;&#160;Low yield next time: wash with cold (0 &#176;C)</text>
<text x="38.0" y="444.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">hexane, or switch to thin-film distillation</text>
</svg>
