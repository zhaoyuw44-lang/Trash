<text x="26.0" y="362.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">&#8226;&#160;&#160;HDI is miscible with hexane; the PEG-</text>
<text x="38.0" y="380.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">urethane prepolymer is not</text>
<text x="26.0" y="403.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">&#8226;&#160;&#160;Emulsion or hazy top layer: wait longer,</text>
<text x="38.0" y="421.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">cool to 0 &#176;C, or centrifuge in sealed tubes</text>
