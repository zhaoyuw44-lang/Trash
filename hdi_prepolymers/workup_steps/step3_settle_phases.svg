<text x="226.0" y="172.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-style="normal">upper: n-hexane + HDI</text>
<text x="226.0" y="187.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" font-style="normal">&#961; &#8776; 0.7 g/mL</text><line x1="195.0" y1="266.0" x2="222.0" y2="232.0" stroke="#8a8985" stroke-width="1" />
<text x="226.0" y="236.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-style="normal">lower: prepolymer oil</text>
<text x="226.0" y="251.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" font-style="normal">&#961; &#8776; 1.1 g/mL</text>
