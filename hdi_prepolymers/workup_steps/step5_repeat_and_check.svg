<svg xmlns="http://www.w3.org/2000/svg" width="380" height="540" viewBox="0 0 380 540" font-family="Arial, Helvetica, sans-serif" role="img"><title>Prepolymer work-up: step5_repeat_and_check.svg</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="379" height="539" rx="14" fill="#ffffff" stroke="#dcdbd5"/>
<circle cx="34" cy="36" r="16" fill="#2a78d6"/>
<text x="34.0" y="41.5" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">5</text>
<text x="60.0" y="42.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-style="normal">Repeat 5-10&#215;, then check</text>
<text x="60.0" y="61.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" font-style="normal">wash until the NMR says stop</text>
<path d="M43.1,152.2 A52.0,52.0 0 1 1 43.1,187.8" fill="none" stroke="#2a78d6" stroke-width="3" marker-end="url(#ahb)"/><text x="92.0" y="166.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal">steps 2-4</text><text x="92.0" y="186.0" font-size="18" fill="#2a78d6" text-anchor="middle" font-weight="bold" font-style="normal">&#215; 5-10</text><line x1="178.0" y1="222.0" x2="360.0" y2="222.0" stroke="#52514e" stroke-width="1" /><line x1="231.0" y1="222.0" x2="231.0" y2="200.0" stroke="#2a78d6" stroke-width="2" /><line x1="238.0" y1="222.0" x2="238.0" y2="178.0" stroke="#2a78d6" stroke-width="2" /><line x1="245.0" y1="222.0" x2="245.0" y2="200.0" stroke="#2a78d6" stroke-width="2" /><circle cx="238.0" cy="138.0" r="8.5" fill="#ffffff" stroke="#52514e"/><text x="238.0" y="142.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal">e</text><line x1="293.5" y1="222.0" x2="293.5" y2="200.0" stroke="#2a78d6" stroke-width="2" /><line x1="300.5" y1="222.0" x2="300.5" y2="156.0" stroke="#2a78d6" stroke-width="2" /><line x1="307.5" y1="222.0" x2="307.5" y2="156.0" stroke="#2a78d6" stroke-width="2" /><line x1="314.5" y1="222.0" x2="314.5" y2="200.0" stroke="#2a78d6" stroke-width="2" /><circle cx="304.0" cy="138.0" r="8.5" fill="#ffffff" stroke="#52514e"/><text x="304.0" y="142.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal">f</text><text x="238.0" y="238.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">3.29</text><text x="304.0" y="238.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">3.16 ppm</text><text x="269.0" y="112.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal"><tspan baseline-shift="super" font-size="75%">1</tspan>H NMR of an aliquot</text><rect x="24" y="262" width="332" height="58" rx="8" fill="#f6f5f2"/><text x="190.0" y="285.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal">free HDI per molecule = (&#8747;e &#8722; &#8747;f) / 4</text><text x="190.0" y="307.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" font-style="normal">free HDI adds to e (CH<tspan baseline-shift="sub" font-size="75%">2</tspan>NCO), never to f (NHCH<tspan baseline-shift="sub" font-size="75%">2</tspan>)</text>
<line x1="20.0" y1="338.0" x2="360.0" y2="338.0" stroke="#dcdbd5" stroke-width="1" />
<text x="26.0" y="362.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">&#8226;&#160;&#160;Stop at &#8747;e &#8722; &#8747;f &#8804; 0.18 (b set to 8.00 for PE,</text>
<text x="38.0" y="380.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">6.00 for GE) = free HDI &#8804; 0.5 wt%</text>
<text x="26.0" y="403.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">&#8226;&#160;&#160;&lt; 0.1 wt% (low-monomer grade) is below</text>
<text x="38.0" y="421.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">NMR sensitivity: use HPLC after derivatisation</text>
</svg>
