<text x="26.0" y="362.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">&#8226;&#160;&#160;Stir to renew the surface; dry to</text>
<text x="38.0" y="380.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">constant weight (typically several h)</text>
<text x="26.0" y="403.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">&#8226;&#160;&#160;Stay &#8804; 50 &#176;C: avoids allophanate and colour</text>
<text x="26.0" y="426.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">&#8226;&#160;&#160;Residual hexane by NMR: 0.88 / 1.26 ppm</text>
<text x="38.0" y="444.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">(1.26 sits next to signal i)</text>
<text x="26.0" y="467.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">&#8226;&#160;&#160;Release vacuum with dry N<tspan baseline-shift="sub" font-size="75%">2</tspan>, never air</text>
