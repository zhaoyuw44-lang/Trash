<text x="60.0" y="42.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-style="normal">High-vacuum drying</text>
<text x="60.0" y="61.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" font-style="normal">40-50 &#176;C, &lt; 0.1 mbar</text>
