<svg xmlns="http://www.w3.org/2000/svg" width="380" height="540" viewBox="0 0 380 540" font-family="Arial, Helvetica, sans-serif" role="img"><title>Prepolymer work-up: step6_high_vacuum_dry.svg</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
