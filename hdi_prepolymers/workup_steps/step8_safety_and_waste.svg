<svg xmlns="http://www.w3.org/2000/svg" width="380" height="540" viewBox="0 0 380 540" font-family="Arial, Helvetica, sans-serif" role="img"><title>Prepolymer work-up: step8_safety_and_waste.svg</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="379" height="539" rx="14" fill="#ffffff" stroke="#dcdbd5"/>
<text x="24.0" y="42.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-style="normal">Safety and waste</text>
<text x="24.0" y="61.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal" font-style="normal">applies to every step</text>
<rect x="24" y="78" width="332" height="244" rx="10" fill="#fff4ef" stroke="#ec835a"/><path d="M52,96 L72,132 L32,132 Z" fill="#fab219" stroke="#9a6a00" stroke-width="1.5"/><text x="52.0" y="128.0" font-size="18" fill="#0b0b0b" text-anchor="middle" font-weight="bold" font-style="normal">!</text><text x="84.0" y="108.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-style="normal">HDI: respiratory sensitiser,</text><text x="84.0" y="125.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" font-style="normal">toxic by inhalation</text><text x="40.0" y="166.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-style="normal">Fume hood, goggles, double nitrile</text><text x="40.0" y="183.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" font-style="normal">gloves, lab coat</text><text x="40.0" y="220.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold" font-style="normal">Waste liquor: open container +</text><text x="40.0" y="237.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" font-style="normal">decontamination solution*; CO<tspan baseline-shift="sub" font-size="75%">2</tspan></text><text x="40.0" y="254.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" font-style="normal">evolves - do not seal for 48 h</text><text x="40.0" y="300.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" font-style="normal">*e.g. 90% water, 8% conc. NH<tspan baseline-shift="sub" font-size="75%">3</tspan>, 2% detergent</text><text x="40.0" y="315.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" font-style="normal">or 5-10% Na<tspan baseline-shift="sub" font-size="75%">2</tspan>CO<tspan baseline-shift="sub" font-size="75%">3</tspan> with a little detergent</text>
<line x1="20.0" y1="338.0" x2="360.0" y2="338.0" stroke="#dcdbd5" stroke-width="1" />
<text x="26.0" y="362.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">&#8226;&#160;&#160;All glassware oven-dried, all solvents dry,</text>
<text x="38.0" y="380.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">everything under N<tspan baseline-shift="sub" font-size="75%">2</tspan></text>
<text x="26.0" y="403.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">&#8226;&#160;&#160;Rinse glassware with decontamination</text>
<text x="38.0" y="421.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">solution before washing</text>
<text x="26.0" y="444.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">&#8226;&#160;&#160;Recovered HDI: re-check NCO content</text>
<text x="38.0" y="462.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal" font-style="normal">before re-use</text>
</svg>
