<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" width="1080" height="430" role="img" aria-label="职业移民三条路：雇主 PERM（EB-2/EB-3）、EB-1B（雇主、免 PERM）、EB-1A/NIW（自主申请），都汇入按出生地排队的排期"><title>职业移民三条路：雇主 PERM（EB-2/EB-3）、EB-1B（雇主、免 PERM）、EB-1A/NIW（自主申请），都汇入按出生地排队的排期</title><style>:root{--paper:#F3F5F4;--paper-2:#E8ECEB;--card:#FFFFFF;--ink:#16202A;--ink-2:#4E5A66;--line:#CDD5D6;--us:#2B4C9B;--us-tint:#E4EBF8;--us-wash:#EEF2FA;--cn:#B03A2E;--cn-tint:#F8E4E0;--cn-wash:#FBF0EE;--mute:#9AA4AE;--ch-cn:#B03A2E;--ch-row:#6B5FB5;--x:#0E6B63;--x-tint:#DDF0EC;--x-wash:#ECF6F4;--ch-x:#008A7A;--ch-w:#B87A12;--sans:'Noto Sans SC','PingFang SC','Microsoft YaHei','Source Han Sans SC',sans-serif;--serif:'Noto Serif SC','Songti SC','STSong',serif;--mono:'IBM Plex Mono',Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){:root{--paper:#11161C;--paper-2:#1A2129;--card:#171E26;--ink:#E4E9EE;--ink-2:#A2ADB8;--line:#2F3A46;--us:#8EADF2;--us-tint:#1C2A47;--us-wash:#16203A;--cn:#F08C7A;--cn-tint:#3B211E;--cn-wash:#2A1A19;--mute:#5D6873;--ch-cn:#D9644F;--ch-row:#8A80D0;--x:#6CCFC4;--x-tint:#123230;--x-wash:#0F2422;--ch-x:#1FA39C;--ch-w:#BD822A}} .f-bg{fill:var(--paper)} .k-box{fill:var(--card);stroke:var(--line);stroke-width:1} .k-us{fill:var(--us-tint);stroke:var(--us);stroke-width:1.2} .k-cn{fill:var(--cn-tint);stroke:var(--cn);stroke-width:1.2} .k-mute{fill:var(--paper-2);stroke:var(--line);stroke-width:1} .k-solid-us{fill:var(--us);stroke:var(--us)} .k-solid-cn{fill:var(--cn);stroke:var(--cn)} .k-ink{fill:var(--ink)} .k-pill{fill:var(--card);stroke:var(--line)} .k-dash{stroke-dasharray:4 3} .k-band-us{fill:var(--us-wash)} .k-band-cn{fill:var(--cn-wash)} .k-band-mute{fill:var(--paper-2)} .k-cn-wash{fill:var(--cn-wash);stroke:var(--cn);stroke-width:1;stroke-dasharray:5 4} .m-us{fill:var(--us)} .m-cn{fill:var(--cn)} .m-ink{fill:var(--ink)} .m-ink2{fill:var(--ink-2)} .m-mute{fill:var(--mute)} .m-ch-cn{fill:var(--ch-cn)} .m-ch-row{fill:var(--ch-row)} .m-bg-us{fill:var(--card);stroke:var(--us);stroke-width:2} .ring-dot{stroke:var(--card);stroke-width:2} .l{fill:none;stroke:var(--ink-2);stroke-width:1.5} .l-us{stroke:var(--us)} .l-cn{stroke:var(--cn)} .l-dash{stroke-dasharray:5 4} .l-strong{stroke:var(--ink);stroke-width:1.5} .l-grid{fill:none;stroke:var(--line);stroke-width:1} .l-axis{fill:none;stroke:var(--ink-2);stroke-width:1} .l-tick{fill:none;stroke:var(--ink);stroke-width:2.5} .l-now{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round} text{font-family:var(--sans)} .t{fill:var(--ink);font-size:13px;font-weight:500} .t-s{fill:var(--ink-2);font-size:11.5px;font-weight:400} .t-xs{fill:var(--ink-2);font-size:10.5px;font-weight:400} .t-h{fill:var(--ink);font-family:var(--serif);font-size:15px;font-weight:700} .t-b{font-weight:700} .t-m{font-family:var(--mono)} .t-us{fill:var(--us)} .t-cn{fill:var(--cn)} .t-inv{fill:var(--paper)} .k-x{fill:var(--x-tint);stroke:var(--x);stroke-width:1.2} .k-band-x{fill:var(--x-wash)} .k-x-soft{fill:var(--x-tint);stroke:var(--ch-x);stroke-width:1.2} .k-x-dash{fill:var(--x-tint);stroke:var(--ch-x);stroke-width:1.6;stroke-dasharray:4 3} .k-reform{fill:var(--card);stroke:var(--ch-w);stroke-width:2} .k-zebra{fill:var(--paper-2);opacity:.45} .m-ch-x{fill:var(--ch-x)} .l-x{fill:none;stroke:var(--ch-x);stroke-width:2} .l-w{fill:none;stroke:var(--ch-w);stroke-width:1.5} .t-x{fill:var(--x)} .t-w{fill:var(--ch-w)} </style><rect class="f-bg" x="0" y="0" width="1080" height="430"/><defs><marker id="g04-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="m-ink2"/></marker><marker id="g04-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="m-us"/></marker><marker id="g04-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="m-cn"/></marker></defs><rect x="16" y="45" width="176" height="50" rx="8" class="k-box"/><text x="28" y="67" class="t t-b">雇主担保 PERM</text><text x="28" y="83" class="t-s">EB-2 / EB-3</text><rect x="16" y="135" width="176" height="50" rx="8" class="k-box"/><text x="28" y="157" class="t t-b">EB-1B 杰出研究员</text><text x="28" y="173" class="t-s">雇主 + 永久职位</text><rect x="16" y="225" width="176" height="50" rx="8" class="k-box"/><text x="28" y="247" class="t t-b">EB-1A / NIW</text><text x="28" y="263" class="t-s">自主申请 self-petition</text><rect x="210" y="54" width="120" height="32" rx="8" class="k-box"/><text x="270" y="74.5" class="t" text-anchor="middle">PWD 工资认定</text><path d="M332,70 H348" class="l l-us" marker-end="url(#g04-u)"/><rect x="350" y="54" width="110" height="32" rx="8" class="k-box"/><text x="405" y="74.5" class="t" text-anchor="middle">招聘测试</text><path d="M462,70 H478" class="l l-us" marker-end="url(#g04-u)"/><rect x="480" y="54" width="120" height="32" rx="8" class="k-box"/><text x="540" y="74.5" class="t" text-anchor="middle">ETA-9089</text><path d="M602,70 H618" class="l l-us" marker-end="url(#g04-u)"/><text x="410" y="104" class="t-xs" text-anchor="middle">劳工部 DOL 阶段，常见 1.5–2 年以上</text><path d="M192,70 H208" class="l l-us"/><rect x="210" y="144" width="150" height="32" rx="8" class="k-box"/><text x="285" y="164.5" class="t" text-anchor="middle">永久职位 offer</text><path d="M192,160 H208" class="l l-us"/><path d="M362,160 H618" class="l l-us" marker-end="url(#g04-u)"/><text x="490" y="152" class="t-xs" text-anchor="middle">无需 PERM</text><rect x="210" y="234" width="170" height="32" rx="8" class="k-box"/><text x="295" y="254.5" class="t" text-anchor="middle">整理证据 · 推荐信</text><path d="M192,250 H208" class="l l-us"/><path d="M382,250 H618" class="l l-us" marker-end="url(#g04-u)"/><text x="500" y="242" class="t-xs" text-anchor="middle">无需雇主与 PERM</text><rect x="620" y="45" width="120" height="50" rx="8" class="k-us"/><text x="680" y="67" class="t t-b t-m" text-anchor="middle">I-140</text><text x="680" y="83" class="t-s" text-anchor="middle">雇主递交</text><rect x="620" y="135" width="120" height="50" rx="8" class="k-us"/><text x="680" y="157" class="t t-b t-m" text-anchor="middle">I-140</text><text x="680" y="173" class="t-s" text-anchor="middle">雇主递交 · 可加急</text><rect x="620" y="225" width="120" height="50" rx="8" class="k-us"/><text x="680" y="247" class="t t-b t-m" text-anchor="middle">I-140</text><text x="680" y="263" class="t-s" text-anchor="middle">本人递交 · 可加急</text><path d="M740,70 H760 V150 H778" class="l l-us" marker-end="url(#g04-u)"/><path d="M740,160 H778" class="l l-us" marker-end="url(#g04-u)"/><path d="M740,250 H760 V170 H778" class="l l-us" marker-end="url(#g04-u)"/><rect x="780" y="135" width="130" height="50" rx="8" class="k-solid-us"/><text x="845" y="157" class="t t-b t-inv" text-anchor="middle">排期 Visa Bulletin</text><text x="845" y="173" class="t-s t-inv" text-anchor="middle">按出生地排队</text><path d="M910,160 H928" class="l l-us" marker-end="url(#g04-u)"/><rect x="930" y="135" width="130" height="50" rx="8" class="k-us"/><text x="995" y="157" class="t t-b t-m" text-anchor="middle">I-485</text><text x="995" y="173" class="t-s" text-anchor="middle">境内调整身份/领馆</text><path d="M995,185 V303" class="l l-us" marker-end="url(#g04-u)"/><rect x="930" y="305" width="130" height="50" rx="8" class="k-us"/><text x="995" y="327" class="t t-b" text-anchor="middle">绿卡</text><text x="995" y="343" class="t-s" text-anchor="middle">永久居民 LPR</text><path d="M930,330 H906" class="l l-us" marker-end="url(#g04-u)"/><rect x="760" y="305" width="144" height="50" rx="8" class="k-box"/><text x="832" y="327" class="t t-b" text-anchor="middle">入籍（约满 5 年）</text><text x="832" y="343" class="t-s" text-anchor="middle">自动丧失中国国籍</text><text x="16" y="316" class="t-s">· I-140 获批后优先日（PD）可保留，换雇主也不丢。</text><text x="16" y="338" class="t-s">· 中国大陆出生（2026-11）：EB-1 排到 2023-08-01，EB-2 排到 2021-10-01。</text><text x="16" y="360" class="t-s">· I-485 待审期间可拿 EAD/AP；配偶 H-4 在 I-140 获批后可申请 EAD。</text><text x="16" y="382" class="t-s">· 排期按出生地而非国籍：配偶在其他国家出生，可交叉计算（cross-chargeability）。</text></svg>
