 class="hit stage" data-stage="cn-ug" tabindex="0" role="button" aria-label="本科 4 年"><rect x="611" y="72" width="142" height="40" rx="6" class="k-box"/><text x="682" y="96" class="t-s t-b" text-anchor="middle">本科 4 年</text></g><g class="hit stage" data-stage="cn-ms" tabindex="0" role="button" aria-label="硕士 2–3 年"><rect x="755" y="72" width="106" height="40" rx="6" class="k-box"/><text x="808" y="96" class="t-s t-b" text-anchor="middle">硕士 2–3 年</text></g><g class="hit stage" data-stage="cn-phd" tabindex="0" role="button" aria-label="博士 3–4 年"><rect x="863" y="72" width="142" height="40" rx="6" class="k-solid-cn"/><text x="934" y="96" class="t-s t-b t-inv" text-anchor="middle">博士 3–4 年</text></g><rect x="1007" y="72" width="34" height="40" rx="6" class="k-mute k-dash"/><text x="1024" y="128" class="t-xs" text-anchor="middle">常延期</text><path d="M178,118 V126 H502 V118" class="l l-cn"/><text x="340" y="142" class="t-s t-cn" text-anchor="middle">九年义务教育（约 6–15 岁）</text><g class="hit stage" data-stage="cn-voc" tabindex="0" role="button" aria-label="中职"><rect x="503" y="144" width="106" height="32" rx="6" class="k-box"/><text x="556" y="164" class="t-s t-b" text-anchor="middle">中职</text></g><g class="hit stage" data-stage="cn-voc" tabindex="0" role="button" aria-label="高职（专科）"><rect x="611" y="144" width="106" height="32" rx="6" class="k-box"/><text x="664" y="164" class="t-s t-b" text-anchor="middle">高职（专科）</text></g><g class="hit stage" data-stage="cn-voc" tabindex="0" role="button" aria-label="专升本"><rect x="719" y="144" width="70" height="32" rx="6" class="k-box"/><text x="754" y="164" class="t-s t-b" text-anchor="middle">专升本</text></g><path d="M610,210 H1042" class="l-grid"/><circle cx="754" cy="210" r="6" class="m-cn"/><text x="754" y="232" class="t-xs t-b" text-anchor="middle">学士</text><circle cx="862" cy="210" r="6" class="m-cn"/><text x="862" y="232" class="t-xs t-b" text-anchor="middle">硕士</text><circle cx="1006" cy="210" r="6" class="m-cn"/><text x="1006" y="232" class="t-xs t-b" text-anchor="middle">博士</text><text x="602" y="214" class="t-xs" text-anchor="end">《学位法》2025 施行：学术 / 专业学位</text><path d="M70,262 H1042" class="l-axis"/><path d="M70,262 V268" class="l-axis"/><text x="70" y="282" class="t-xs t-m" text-anchor="middle">3 岁</text><path d="M106,262 V265" class="l-axis"/><path d="M142,262 V265" class="l-axis"/><path d="M178,262 V268" class="l-axis"/><text x="178" y="282" class="t-xs t-m" text-anchor="middle">6</text><path d="M214,262 V265" class="l-axis"/><path d="M250,262 V265" class="l-axis"/><path d="M286,262 V268" class="l-axis"/><text x="286" y="282" class="t-xs t-m" text-anchor="middle">9</text><path d="M322,262 V265" class="l-axis"/><path d="M358,262 V265" class="l-axis"/><path d="M394,262 V268" class="l-axis"/><text x="394" y="282" class="t-xs t-m" text-anchor="middle">12</text><path d="M430,262 V265" class="l-axis"/><path d="M466,262 V265" class="l-axis"/><path d="M502,262 V268" class="l-axis"/><text x="502" y="282" class="t-xs t-m" text-anchor="middle">15</text><path d="M538,262 V265" class="l-axis"/><path d="M574,262 V265" class="l-axis"/><path d="M610,262 V268" class="l-axis"/><text x="610" y="282" class="t-xs t-m" text-anchor="middle">18</text><path d="M646,262 V265" class="l-axis"/><path d="M682,262 V265" class="l-axis"/><path d="M718,262 V268" class="l-axis"/><text x="718" y="282" class="t-xs t-m" text-anchor="middle">21</text><path d="M754,262 V265" class="l-axis"/><path d="M790,262 V265" class="l-axis"/><path d="M826,262 V268" class="l-axis"/><text x="826" y="282" class="t-xs t-m" text-anchor="middle">24</text><path d="M862,262 V265" class="l-axis"/><path d="M898,262 V265" class="l-axis"/><path d="M934,262 V268" class="l-axis"/><text x="934" y="282" class="t-xs t-m" text-anchor="middle">27</text><path d="M970,262 V265" class="l-axis"/><path d="M1006,262 V265" class="l-axis"/><path d="M1042,262 V268" class="l-axis"/><text x="1042" y="282" class="t-xs t-m" text-anchor="middle">30 岁</text><text x="12" y="3