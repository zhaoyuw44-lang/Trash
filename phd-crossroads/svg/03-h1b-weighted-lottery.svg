class="k-us"/><text x="470" y="166" class="t t-b" text-anchor="middle">加权抽签池</text><text x="470" y="184" class="t-s" text-anchor="middle">每人只计一次</text><rect x="600" y="86" width="210" height="56" rx="8" class="k-us"/><text x="705" y="111" class="t t-b" text-anchor="middle">第一轮：常规 65,000</text><text x="705" y="127" class="t-s" text-anchor="middle">所有注册者参加</text><rect x="600" y="216" width="210" height="56" rx="8" class="k-us"/><text x="705" y="241" class="t t-b" text-anchor="middle">第二轮：高学历 20,000</text><text x="705" y="257" class="t-s" text-anchor="middle">美国硕士及以上学位</text><path d="M528.3,139.0 L598,118" class="l l-us" marker-end="url(#g03-u)"/><path d="M705,142 V214" class="l l-us" marker-end="url(#g03-u)"/><rect x="651" y="168" width="108" height="20" rx="10" class="k-pill"/><text x="705" y="182" class="t-s" text-anchor="middle">未中签的美国硕博</text><rect x="860" y="132" width="200" height="84" rx="8" class="k-solid-us"/><text x="960" y="163.5" class="t t-b t-inv" text-anchor="middle">中签 Selected</text><text x="960" y="179.5" class="t-s t-inv" text-anchor="middle">4/1–6/30 递交 I-129</text><text x="960" y="194.5" class="t-s t-inv" text-anchor="middle">10/1 起生效</text><path d="M810,114 L858,154" class="l l-us" marker-end="url(#g03-u)"/><path d="M810,244 L858,198" class="l l-us" marker-end="url(#g03-u)"/><rect x="24" y="296" width="1036" height="60" rx="10" class="k-mute"/><text x="40" y="320" class="t-s t-b">Cap-exempt 雇主（高校、其附属非营利机构、非营利或政府研究机构）不参加抽签，全年可递交。</text><text x="40" y="342" class="t-s">FY2027（2026 年 3 月）起实施。截至检索时 USCIS 未公布分级别中签率；DOL 2026-03 提案拟上调各级工资分位，定稿前沿用现行标准。</text></svg>
