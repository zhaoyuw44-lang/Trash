<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 320" width="1080" height="320" role="img" aria-label="回国五步：毕业前准备材料 → 学历学位认证 → 求职与录用 → 落户与档案 → 安顿与待遇"><title>回国五步：毕业前准备材料 → 学历学位认证 → 求职与录用 → 落户与档案 → 安顿与待遇</title><style>:root{--paper:#F3F5F4;--paper-2:#E8ECEB;--card:#FFFFFF;--ink:#16202A;--ink-2:#4E5A66;--line:#CDD5D6;--us:#2B4C9B;--us-tint:#E4EBF8;--us-wash:#EEF2FA;--cn:#B03A2E;--cn-tint:#F8E4E0;--cn-wash:#FBF0EE;--mute:#9AA4AE;--ch-cn:#B03A2E;--ch-row:#6B5FB5;--sans:'Noto Sans SC','PingFang SC','Microsoft YaHei','Source Han Sans SC',sans-serif;--serif:'Noto Serif SC','Songti SC','STSong',serif;--mono:'IBM Plex Mono',Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){:root{--paper:#11161C;--paper-2:#1A2129;--card:#171E26;--ink:#E4E9EE;--ink-2:#A2ADB8;--line:#2F3A46;--us:#8EADF2;--us-tint:#1C2A47;--us-wash:#16203A;--cn:#F08C7A;--cn-tint:#3B211E;--cn-wash:#2A1A19;--mute:#5D6873;--ch-cn:#D9644F;--ch-row:#8A80D0}} .f-bg{fill:var(--paper)} .k-box{fill:var(--card);stroke:var(--line);stroke-width:1} .k-us{fill:var(--us-tint);stroke:var(--us);stroke-width:1.2} .k-cn{fill:var(--cn-tint);stroke:var(--cn);stroke-width:1.2} .k-mute{fill:var(--paper-2);stroke:var(--line);stroke-width:1} .k-solid-us{fill:var(--us);stroke:var(--us)} .k-solid-cn{fill:var(--cn);stroke:var(--cn)} .k-ink{fill:var(--ink)} .k-pill{fill:var(--card);stroke:var(--line)} .k-dash{stroke-dasharray:4 3} .k-band-us{fill:var(--us-wash)} .k-band-cn{fill:var(--cn-wash)} .k-band-mute{fill:var(--paper-2)} .k-cn-wash{fill:var(--cn-wash);stroke:var(--cn);stroke-width:1;stroke-dasharray:5 4} .m-us{fill:var(--us)} .m-cn{fill:var(--cn)} .m-ink{fill:var(--ink)} .m-ink2{fill:var(--ink-2)} .m-mute{fill:var(--mute)} .m-ch-cn{fill:var(--ch-cn)} .m-ch-row{fill:var(--ch-row)} .m-bg-us{fill:var(--card);stroke:var(--us);stroke-width:2} .ring-dot{stroke:var(--card);stroke-width:2} .l{fill:none;stroke:var(--ink-2);stroke-width:1.5} .l-us{stroke:var(--us)} .l-cn{stroke:var(--cn)} .l-dash{stroke-dasharray:5 4} .l-strong{stroke:var(--ink);stroke-width:1.5} .l-grid{fill:none;stroke:var(--line);stroke-width:1} .l-axis{fill:none;stroke:var(--ink-2);stroke-width:1} .l-tick{fill:none;stroke:var(--ink);stroke-width:2.5} .l-now{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round} text{font-family:var(--sans)} .t{fill:var(--ink);font-size:13px;font-weight:500} .t-s{fill:var(--ink-2);font-size:11.5px;font-weight:400} .t-xs{fill:var(--ink-2);font-size:10.5px;font-weight:400} .t-h{fill:var(--ink);font-family:var(--serif);font-size:15px;font-weight:700} .t-b{font-weight:700} .t-m{font-family:var(--mono)} .t-us{fill:var(--us)} .t-cn{fill:var(--cn)} .t-inv{fill:var(--paper)} </style><rect class="f-bg" x="0" y="0" width="1080" height="320"/><defs><marker id="g06-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="m-ink2"/></marker><marker id="g06-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="m-us"/></marker><marker id="g06-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="m-cn"/></marker></defs><rect x="11" y="24" width="194" height="230" rx="10" class="k-box"/><circle cx="35" cy="50" r="13" class="m-cn"/><text x="35" y="55" class="t t-b t-inv" text-anchor="middle">1</text><text x="55" y="55" class="t t-b t-cn">毕业前准备</text><path d="M23,76 H193" class="l-grid"/><text x="25" y="102" class="t-s">· 学位证 / 毕业证明信</text><text x="25" y="128" class="t-s">· 官方成绩单</text><text x="25" y="154" class="t-s">· 护照全部页 + 出入境记录</text><text x="25" y="180" class="t-s">· 美国 401(k) 与税务安排</text><rect x="21" y="214" width="174" height="26" rx="6" class="k-cn"/><text x="108" y="231" class="t-xs t-b" text-anchor="middle">毕业前 6–12 个月</text><path d="M207,139 H225" class="l l-cn" marker-end="url(#g06-c)"/><rect x="227" y="24" width="194" height="230" rx="10" class="k-box"/><circle cx="251" cy="50" r="13" class="m-cn"/><text x="251" y="55" class="t t-b t-inv" text-anchor="middle">2</text><text x="271" y="55" class="t t-b t-cn">学历学位认证</text><path d="M239,76 H409" class="l-grid"/><text x="241" y="102" class="t-s">· 中国留学服务中心在线申请</text><text x="241" y="128" class="t-s">· 授权学校核实学位</text><text x="241" y="154" class="t-s">· 提交留学期间出入境记录</text><text x="241" y="180" class="t-s">· 认证书为电子版</text><rect x="237" y="214" width="174" height="26" rx="6" class="k-cn"/><text x="324" y="231" class="t-xs t-b" text-anchor="middle">拿到学位后即可</text><path d="M423,139 H441" class="l l-cn" marker-end="url(#g06-c)"/><rect x="443" y="24" width="194" height="230" rx="10" class="k-box"/><circle cx="467" cy="50" r="13" class="m-cn"/><text x="467" y="55" class="t t-b t-inv" text-anchor="middle">3</text><text x="487" y="55" class="t t-b t-cn">求职与录用</text><path d="M455,76 H625" class="l-grid"/><text x="457" y="102" class="t-s">· 高校 / 院所：全年滚动</text><text x="457" y="128" class="t-s">· 企业：秋招 8–11 月</text><text x="457" y="154" class="t-s">· 国考：10 月报名</text><text x="457" y="180" class="t-s">· 择业期内可按应届生</text><rect x="453" y="214" width="174" height="26" rx="6" class="k-cn"/><text x="540" y="231" class="t-xs t-b" text-anchor="middle">毕业前 12 个月起</text><path d="M639,139 H657" class="l l-cn" marker-end="url(#g06-c)"/><rect x="659" y="24" width="194" height="230" rx="10" class="k-box"/><circle cx="683" cy="50" r="13" class="m-cn"/><text x="683" y="55" class="t t-b t-inv" text-anchor="middle">4</text><text x="703" y="55" class="t t-b t-cn">落户与档案</text><path d="M671,76 H841" class="l-grid"/><text x="673" y="102" class="t-s">· 单位或人才中心申报</text><text x="673" y="128" class="t-s">· 博士落户多数城市放宽</text><text x="673" y="154" class="t-s">· 档案存单位或人才中心</text><text x="673" y="180" class="t-s">· 配偶子女通常可随迁</text><rect x="669" y="214" width="174" height="26" rx="6" class="k-cn"/><text x="756" y="231" class="t-xs t-b" text-anchor="middle">入职后 1–3 个月</text><path d="M855,139 H873" class="l l-cn" marker-end="url(#g06-c)"/><rect x="875" y="24" width="194" height="230" rx="10" class="k-box"/><circle cx="899" cy="50" r="13" class="m-cn"/><text x="899" y="55" class="t t-b t-inv" text-anchor="middle">5</text><text x="919" y="55" class="t t-b t-cn">安顿与待遇</text><path d="M887,76 H1057" class="l-grid"/><text x="889" y="102" class="t-s">· 社保 · 公积金起缴</text><text x="889" y="128" class="t-s">· 人才补贴 / 安家费</text><text x="889" y="154" class="t-s">· 子女入学看户籍 / 居住证</text><text x="889" y="180" class="t-s">· 个税：中国税务居民</text><rect x="885" y="214" width="174" height="26" rx="6" class="k-cn"/><text x="972" y="231" class="t-xs t-b" text-anchor="middle">入职后</text><text x="11" y="284" class="t-s">顺序为常见流程：认证和求职可以并行；高校岗位的招聘与谈判往往在毕业前一年就开始。</text><text x="11" y="306" class="t-s">各城市落户与人才政策差异很大，且每年调整，以当地人社部门和用人单位的书面文件为准。</text></svg>
