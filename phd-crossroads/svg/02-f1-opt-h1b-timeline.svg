<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" width="1080" height="340" role="img" aria-label="时间轴示例：2027 年 5 月毕业，OPT 12 个月 + STEM OPT 24 个月，期间最多约 4 次 H-1B 抽签"><title>时间轴示例：2027 年 5 月毕业，OPT 12 个月 + STEM OPT 24 个月，期间最多约 4 次 H-1B 抽签</title><style>:root{--paper:#F3F5F4;--paper-2:#E8ECEB;--card:#FFFFFF;--ink:#16202A;--ink-2:#4E5A66;--line:#CDD5D6;--us:#2B4C9B;--us-tint:#E4EBF8;--us-wash:#EEF2FA;--cn:#B03A2E;--cn-tint:#F8E4E0;--cn-wash:#FBF0EE;--mute:#9AA4AE;--ch-cn:#B03A2E;--ch-row:#6B5FB5;--sans:'Noto Sans SC','PingFang SC','Microsoft YaHei','Source Han Sans SC',sans-serif;--serif:'Noto Serif SC','Songti SC','STSong',serif;--mono:'IBM Plex Mono',Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){:root{--paper:#11161C;--paper-2:#1A2129;--card:#171E26;--ink:#E4E9EE;--ink-2:#A2ADB8;--line:#2F3A46;--us:#8EADF2;--us-tint:#1C2A47;--us-wash:#16203A;--cn:#F08C7A;--cn-tint:#3B211E;--cn-wash:#2A1A19;--mute:#5D6873;--ch-cn:#D9644F;--ch-row:#8A80D0}} .f-bg{fill:var(--paper)} .k-box{fill:var(--card);stroke:var(--line);stroke-width:1} .k-us{fill:var(--us-tint);stroke:var(--us);stroke-width:1.2} .k-cn{fill:var(--cn-tint);stroke:var(--cn);stroke-width:1.2} .k-mute{fill:var(--paper-2);stroke:var(--line);stroke-width:1} .k-solid-us{fill:var(--us);stroke:var(--us)} .k-solid-cn{fill:var(--cn);stroke:var(--cn)} .k-ink{fill:var(--ink)} .k-pill{fill:var(--card);stroke:var(--line)} .k-dash{stroke-dasharray:4 3} .k-band-us{fill:var(--us-wash)} .k-band-cn{fill:var(--cn-wash)} .k-band-mute{fill:var(--paper-2)} .k-cn-wash{fill:var(--cn-wash);stroke:var(--cn);stroke-width:1;stroke-dasharray:5 4} .m-us{fill:var(--us)} .m-cn{fill:var(--cn)} .m-ink{fill:var(--ink)} .m-ink2{fill:var(--ink-2)} .m-mute{fill:var(--mute)} .m-ch-cn{fill:var(--ch-cn)} .m-ch-row{fill:var(--ch-row)} .m-bg-us{fill:var(--card);stroke:var(--us);stroke-width:2} .ring-dot{stroke:var(--card);stroke-width:2} .l{fill:none;stroke:var(--ink-2);stroke-width:1.5} .l-us{stroke:var(--us)} .l-cn{stroke:var(--cn)} .l-dash{stroke-dasharray:5 4} .l-strong{stroke:var(--ink);stroke-width:1.5} .l-grid{fill:none;stroke:var(--line);stroke-width:1} .l-axis{fill:none;stroke:var(--ink-2);stroke-width:1} .l-tick{fill:none;stroke:var(--ink);stroke-width:2.5} .l-now{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round} text{font-family:var(--sans)} .t{fill:var(--ink);font-size:13px;font-weight:500} .t-s{fill:var(--ink-2);font-size:11.5px;font-weight:400} .t-xs{fill:var(--ink-2);font-size:10.5px;font-weight:400} .t-h{fill:var(--ink);font-family:var(--serif);font-size:15px;font-weight:700} .t-b{font-weight:700} .t-m{font-family:var(--mono)} .t-us{fill:var(--us)} .t-cn{fill:var(--cn)} .t-inv{fill:var(--paper)} </style><rect class="f-bg" x="0" y="0" width="1080" height="340"/><defs><marker id="g02-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="m-ink2"/></marker><marker id="g02-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="m-us"/></marker><marker id="g02-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="m-cn"/></marker></defs><text x="12" y="60" class="t-s t-b">学业</text><text x="12" y="100" class="t-s t-b">OPT 递交</text><text x="12" y="140" class="t-s t-b">工作许可</text><text x="12" y="210" class="t-s t-b">H-1B</text><path d="M110.5,40 V250" class="l-grid"/><path d="M172,40 V250" class="l-grid"/><path d="M233.5,40 V250" class="l-grid"/><path d="M295,40 V250" class="l-grid"/><path d="M356.5,40 V250" class="l-grid"/><path d="M418,40 V250" class="l-grid"/><path d="M479.5,40 V250" class="l-grid"/><path d="M541,40 V250" class="l-grid"/><path d="M602.5,40 V250" class="l-grid"/><path d="M664,40 V250" class="l-grid"/><path d="M725.5,40 V250" class