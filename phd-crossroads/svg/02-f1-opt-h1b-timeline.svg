ass="m-bg-us"/><path d="M623,197 L632,206 L623,215 L614,206 Z" class="m-us"/><text x="623" y="188" class="t-s t-b t-us" text-anchor="middle">第 3 次</text><text x="623" y="232" class="t-xs t-m" text-anchor="middle">2029-03</text><path d="M869,206 H1012.5" class="l l-us"/><circle cx="1012.5" cy="206" r="5" class="m-bg-us"/><path d="M869,197 L878,206 L869,215 L860,206 Z" class="m-us"/><text x="869" y="188" class="t-s t-b t-us" text-anchor="middle">第 4 次</text><text x="869" y="232" class="t-xs t-m" text-anchor="middle">2030-03</text><text x="282.5" y="226" class="t-xs">○ = 10/1 生效</text><path d="M90,250 H1033" class="l-axis"/><path d="M172,250 V256" class="l-axis"/><text x="172" y="270" class="t-xs t-m" text-anchor="middle">2027-05</text><path d="M295,250 V256" class="l-axis"/><text x="295" y="270" class="t-xs t-m" text-anchor="middle">2027-11</text><path d="M418,250 V256" class="l-axis"/><text x="418" y="270" class="t-xs t-m" text-anchor="middle">2028-05</text><path d="M541,250 V256" class="l-axis"/><text x="541" y="270" class="t-xs t-m" text-anchor="middle">2028-11</text><path d="M664,250 V256" class="l-axis"/><text x="664" y="270" class="t-xs t-m" text-anchor="middle">2029-05</text><path d="M787,250 V256" class="l-axis"/><text x="787" y="270" class="t-xs t-m" text-anchor="middle">2029-11</text><path d="M910,250 V256" class="l-axis"/><text x="910" y="270" class="t-xs t-m" text-anchor="middle">2030-05</text><path d="M1033,250 V256" class="l-axis"/><text x="1033" y="270" class="t-xs t-m" text-anchor="middle">2030-11</text><text x="12" y="300" class="t-s">示例：2027 年 5 月完成学位，6 月开始 OPT。*毕业当年的 3 月也能注册，但需在递交 I-129（4/1–6/30）前拿到学位，且雇主愿意提前担保。</text><text x="12" y="320" class="t-s">cap-gap：H-1B 已递交且 OPT/STEM OPT 未过期时，F-1 身份与工作许可自动延续到 10/1 生效日（2025 年新规下最长至次年 4/1）。</text></svg>
