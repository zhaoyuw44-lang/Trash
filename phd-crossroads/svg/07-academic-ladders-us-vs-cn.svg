<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 456" width="1080" height="456" role="img" aria-label="学术职业阶梯对照：美国 Postdoc → Assistant → Associate（tenure）→ Full；中国 博士后 → 讲师/预聘 → 副高 → 正高"><title>学术职业阶梯对照：美国 Postdoc → Assistant → Associate（tenure）→ Full；中国 博士后 → 讲师/预聘 → 副高 → 正高</title><style>:root{--paper:#F3F5F4;--paper-2:#E8ECEB;--card:#FFFFFF;--ink:#16202A;--ink-2:#4E5A66;--line:#CDD5D6;--us:#2B4C9B;--us-tint:#E4EBF8;--us-wash:#EEF2FA;--cn:#B03A2E;--cn-tint:#F8E4E0;--cn-wash:#FBF0EE;--mute:#9AA4AE;--ch-cn:#B03A2E;--ch-row:#6B5FB5;--x:#0E6B63;--x-tint:#DDF0EC;--x-wash:#ECF6F4;--ch-x:#008A7A;--ch-w:#B87A12;--sans:'Noto Sans SC','PingFang SC','Microsoft YaHei','Source Han Sans SC',sans-serif;--serif:'Noto Serif SC','Songti SC','STSong',serif;--mono:'IBM Plex Mono',Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){:root{--paper:#11161C;--paper-2:#1A2129;--card:#171E26;--ink:#E4E9EE;--ink-2:#A2ADB8;--line:#2F3A46;--us:#8EADF2;--us-tint:#1C2A47;--us-wash:#16203A;--cn:#F08C7A;--cn-tint:#3B211E;--cn-wash:#2A1A19;--mute:#5D6873;--ch-cn:#D9644F;--ch-row:#8A80D0;--x:#6CCFC4;--x-tint:#123230;--x-wash:#0F2422;--ch-x:#1FA39C;--ch-w:#BD822A}} .f-bg{fill:var(--paper)} .k-box{fill:var(--card);stroke:var(--line);stroke-width:1} .k-us{fill:var(--us-tint);stroke:var(--us);stroke-width:1.2} .k-cn{fill:var(--cn-tint);stroke:var(--cn);stroke-width:1.2} .k-mute{fill:var(--paper-2);stroke:var(--line);stroke-width:1} .k-solid-us{fill:var(--us);stroke:var(--us)} .k-solid-cn{fill:var(--cn);stroke:var(--cn)} .k-ink{fill:var(--ink)} .k-pill{fill:var(--card);stroke:var(--line)} .k-dash{stroke-dasharray:4 3} .k-band-us{fill:var(--us-wash)} .k-band-cn{fill:var(--cn-wash)} .k-band-mute{fill:var(--paper-2)} .k-cn-wash{fill:var(--cn-wash);stroke:var(--cn);stroke-width:1;stroke-dasharray:5 4} .m-us{fill:var(--us)} .m-cn{fill:var(--cn)} .m-ink{fill:var(--ink)} .m-ink2{fill:var(--ink-2)} .m-mute{fill:var(--mute)} .m-ch-cn{fill:var(--ch-cn)} .m-ch-row{fill:var(--ch-row)} .m-bg-us{fill:var(--card);stroke:var(--us);stroke-width:2} .ring-dot{stroke:var(--card);stroke-width:2} .l{fill:none;stroke:var(--ink-2);stroke-width:1.5} .l-us{stroke:var(--us)} .l-cn{stroke:var(--cn)} .l-dash{stroke-dasharray:5 4} .l-strong{stroke:var(--ink);stroke-width:1.5} .l-grid{fill:none;stroke:var(--line);stroke-width:1} .l-axis{fill:none;stroke:var(--ink-2);stroke-width:1} .l-tick{fill:none;stroke:var(--ink);stroke-width:2.5} .l-now{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round} text{font-family:var(--sans)} .t{fill:var(--ink);font-size:13px;font-weight:500} .t-s{fill:var(--ink-2);font-size:11.5px;font-weight:400} .t-xs{fill:var(--ink-2);font-size:10.5px;font-weight:400} .t-h{fill:var(--ink);font-family:var(--serif);font-size:15px;font-weight:700} .t-b{font-weight:700} .t-m{font-family:var(--mono)} .t-us{fill:var(--us)} .t-cn{fill:var(--cn)} .t-inv{fill:var(--paper)} .k-x{fill:var(--x-tint);stroke:var(--x);stroke-width:1.2} .k-band-x{fill:var(--x-wash)} .k-x-soft{fill:var(--x-tint);stroke:var(--ch-x);stroke-width:1.2} .k-x-dash{fill:var(--x-tint);stroke:var(--ch-x);stroke-width:1.6;stroke-dasharray:4 3} .k-reform{fill:var(--card);stroke:var(--ch-w);stroke-width:2} .k-zebra{fill:var(--paper-2);opacity:.45} .m-ch-x{fill:var(--ch-x)} .l-x{fill:none;stroke:var(--ch-x);stroke-width:2} .l-w{fill:none;stroke:var(--ch-w);stroke-width:1.5} .t-x{fill:var(--x)} .t-w{fill:var(--ch-w)} </style><rect class="f-bg" x="0" y="0" width="1080" height="456"/><defs><marker id="g07-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="m-ink2"/></marker><marker id="g07-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="m-us"/></marker><marker id="g07-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="m-cn"/></marker></defs><text x="240" y="34" class="t-h t-us" text-anchor="middle">美国 · Academic Track</text><text x="840" y="34" class="t-h t-cn" text-anchor="middle">中国 · 高校与科研院所</text><rect x="40" y="360" width="400" height="52" rx="8" class="k-us"/><text x="240" y="383" class="t t-b" text-anchor="middle">PhD 博士</text><text x="240" y="399" class="t-s" text-anchor="middle">STEM 中位数约 5–6 年</text><rect x="640" y="360" width="400" height="52" rx="8" class="k-cn"/><text x="840" y="383" class="t t-b" text-anchor="middle">博士</text><text x="840" y="399" class="t-s" text-anchor="middle">学制 3–4 年，延期常见</text><path d="M440,386 H640" class="l l-dash"/><rect x="474.5" y="376" width="131" height="20" rx="10" class="k-pill"/><text x="540" y="390" class="t-s" text-anchor="middle">学位等价，回国需认证</text><rect x="40" y="288" width="400" height="52" rx="8" class="k-us"/><text x="240" y="311" class="t t-b" text-anchor="middle">Postdoc 博士后</text><text x="240" y="327" class="t-s" text-anchor="middle">1–3 年起，合同制，可多段</text><rect x="640" y="288" width="400" height="52" rx="8" class="k-cn"/><text x="840" y="311" class="t t-b" text-anchor="middle">博士后 / 师资博士后</text><text x="840" y="327" class="t-s" text-anchor="middle">2–3 年；出站可留校或转预聘</text><path d="M440,314 H640" class="l l-dash"/><rect x="497.5" y="304" width="85" height="20" rx="10" class="k-pill"/><text x="540" y="318" class="t-s" text-anchor="middle">都是过渡岗位</text><rect x="40" y="216" width="400" height="52" rx="8" class="k-us"/><text x="240" y="239" class="t t-b" text-anchor="middle">Assistant Professor（tenure-track）</text><text x="240" y="255" class="t-s" text-anchor="middle">约 6 年考核期，第 3 年中期评估</text><rect x="640" y="216" width="400" height="52" rx="8" class="k-cn"/><text x="840" y="239" class="t t-b" text-anchor="middle">讲师 · 助理研究员 / 预聘助理教授</text><text x="840" y="255" class="t-s" text-anchor="middle">中级；预聘期常见 3+3 或 6 年</text><path d="M440,242 H640" class="l l-dash"/><rect x="463.69" y="232" width="152.62" height="20" rx="10" class="k-pill"/><text x="540" y="246" class="t-s" text-anchor="middle">tenure 评审 ≈ 预聘期考核</text><rect x="40" y="144" width="400" height="52" rx="8" class="k-us"/><text x="240" y="167" class="t t-b" text-anchor="middle">Associate Professor</text><text x="240" y="183" class="t-s" text-anchor="middle">通常同时获得 tenure（终身教职）</text><rect x="640" y="144" width="400" height="52" rx="8" class="k-cn"/><text x="840" y="167" class="t t-b" text-anchor="middle">副教授 · 副研究员</text><text x="840" y="183" class="t-s" text-anchor="middle">副高级；部分高校预聘直接给副高</text><path d="M440,170 H640" class="l l-dash"/><rect x="477.375" y="160" width="125.25" height="20" rx="10" class="k-pill"/><text x="540" y="174" class="t-s" text-anchor="middle">tenure ≈ 长聘 / 编制</text><rect x="40" y="72" width="400" height="52" rx="8" class="k-us"/><text x="240" y="95" class="t t-b" text-anchor="middle">Full Professor</text><text x="240" y="111" class="t-s" text-anchor="middle">Endowed Chair / Distinguished</text><rect x="640" y="72" width="400" height="52" rx="8" class="k-cn"/><text x="840" y="95" class="t t-b" text-anchor="middle">教授 · 研究员</text><text x="840" y="111" class="t-s" text-anchor="middle">正高级；博导资格另行评定</text><path d="M440,98 H640" class="l l-dash"/><rect x="509" y="88" width="62" height="20" rx="10" class="k-pill"/><text x="540" y="102" class="t-s" text-anchor="middle">大致对应</text><path d="M24,410 V74" class="l l-us" marker-end="url(#g07-u)"/><path d="M1056,410 V74" class="l l-cn" marker-end="url(#g07-c)"/><text x="540" y="446" class="t-s" text-anchor="middle">层级大致对应，并非一一等同；中国高校“预聘-长聘”和传统“编制 + 职称评审”两套体系并存。</text></svg>
