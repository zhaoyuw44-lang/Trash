<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600" role="img" aria-label="入职后头 8 年：美国 tenure-track 与中国预聘-长聘的考核、身份、经费和补贴时间线"><title>入职后头 8 年：美国 tenure-track 与中国预聘-长聘的考核、身份、经费和补贴时间线</title><style>:root{--paper:#F3F5F4;--paper-2:#E8ECEB;--card:#FFFFFF;--ink:#16202A;--ink-2:#4E5A66;--line:#CDD5D6;--us:#2B4C9B;--us-tint:#E4EBF8;--us-wash:#EEF2FA;--cn:#B03A2E;--cn-tint:#F8E4E0;--cn-wash:#FBF0EE;--mute:#9AA4AE;--ch-cn:#B03A2E;--ch-row:#6B5FB5;--x:#0E6B63;--x-tint:#DDF0EC;--x-wash:#ECF6F4;--ch-x:#008A7A;--ch-w:#B87A12;--sans:'Noto Sans SC','PingFang SC','Microsoft YaHei','Source Han Sans SC',sans-serif;--serif:'Noto Serif SC','Songti SC','STSong',serif;--mono:'IBM Plex Mono',Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){:root{--paper:#11161C;--paper-2:#1A2129;--card:#171E26;--ink:#E4E9EE;--ink-2:#A2ADB8;--line:#2F3A46;--us:#8EADF2;--us-tint:#1C2A47;--us-wash:#16203A;--cn:#F08C7A;--cn-tint:#3B211E;--cn-wash:#2A1A19;--mute:#5D6873;--ch-cn:#D9644F;--ch-row:#8A80D0;--x:#6CCFC4;--x-tint:#123230;--x-wash:#0F2422;--ch-x:#1FA39C;--ch-w:#BD822A}} .f-bg{fill:var(--paper)} .k-box{fill:var(--card);stroke:var(--line);stroke-width:1} .k-us{fill:var(--us-tint);stroke:var(--us);stroke-width:1.2} .k-cn{fill:var(--cn-tint);stroke:var(--cn);stroke-width:1.2} .k-mute{fill:var(--paper-2);stroke:var(--line);stroke-width:1} .k-solid-us{fill:var(--us);stroke:var(--us)} .k-solid-cn{fill:var(--cn);stroke:var(--cn)} .k-ink{fill:var(--ink)} .k-pill{fill:var(--card);stroke:var(--line)} .k-dash{stroke-dasharray:4 3} .k-band-us{fill:var(--us-wash)} .k-band-cn{fill:var(--cn-wash)} .k-band-mute{fill:var(--paper-2)} .k-cn-wash{fill:var(--cn-wash);stroke:var(--cn);stroke-width:1;stroke-dasharray:5 4} .m-us{fill:var(--us)} .m-cn{fill:var(--cn)} .m-ink{fill:var(--ink)} .m-ink2{fill:var(--ink-2)} .m-mute{fill:var(--mute)} .m-ch-cn{fill:var(--ch-cn)} .m-ch-row{fill:var(--ch-row)} .m-bg-us{fill:var(--card);stroke:var(--us);stroke-width:2} .ring-dot{stroke:var(--card);stroke-width:2} .l{fill:none;stroke:var(--ink-2);stroke-width:1.5} .l-us{stroke:var(--us)} .l-cn{stroke:var(--cn)} .l-dash{stroke-dasharray:5 4} .l-strong{stroke:var(--ink);stroke-width:1.5} .l-grid{fill:none;stroke:var(--line);stroke-width:1} .l-axis{fill:none;stroke:var(--ink-2);stroke-width:1} .l-tick{fill:none;stroke:var(--ink);stroke-width:2.5} .l-now{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round} text{font-family:var(--sans)} .t{fill:var(--ink);font-size:13px;font-weight:500} .t-s{fill:var(--ink-2);font-size:11.5px;font-weight:400} .t-xs{fill:var(--ink-2);font-size:10.5px;font-weight:400} .t-h{fill:var(--ink);font-family:var(--serif);font-size:15px;font-weight:700} .t-b{font-weight:700} .t-m{font-family:var(--mono)} .t-us{fill:var(--us)} .t-cn{fill:var(--cn)} .t-inv{fill:var(--paper)} .k-x{fill:var(--x-tint);stroke:var(--x);stroke-width:1.2} .k-band-x{fill:var(--x-wash)} .k-x-soft{fill:var(--x-tint);stroke:var(--ch-x);stroke-width:1.2} .k-x-dash{fill:var(--x-tint);stroke:var(--ch-x);stroke-width:1.6;stroke-dasharray:4 3} .k-reform{fill:var(--card);stroke:var(--ch-w);stroke-width:2} .k-zebra{fill:var(--paper-2);opacity:.45} .m-ch-x{fill:var(--ch-x)} .l-x{fill:none;stroke:var(--ch-x);stroke-width:2} .l-w{fill:none;stroke:var(--ch-w);stroke-width:1.5} .t-x{fill:var(--x)} .t-w{fill:var(--ch-w)} .m-ch-w{fill:var(--ch-w)} </style><rect class="f-bg" x="0" y="0" width="1080" height="600"/><defs><marker id="g17-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="m-ink2"/></marker><marker id="g17-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="m-us"/></marker><marker id="g17-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="m-cn"/></marker></defs><text x="16" y="28" class="t-s">横轴是入职后的年数。菱形 = 关键节点，色条 = 持续的窗口期，虚线 = 视情况而定。</text><rect x="8" y="56" width="1064" height="222" rx="12" class="k-band-us"/><rect x="8" y="290" width="1064" height="222" rx="12" class="k-band-cn"/><path d="M214,50 V514" class="l-grid"/><text x="214" y="530" class="t-xs t-m" text-anchor="middle">入职</text><path d="M316,50 V514" class="l-grid"/><text x="316" y="530" class="t-xs t-m" text-anchor="middle">第 1 年</text><path d="M418,50 V514" class="l-grid"/><text x="418" y="530" class="t-xs t-m" text-anchor="middle">第 2 年</text><path d="M520,50 V514" class="l-grid"/><text x="520" y="530" class="t-xs t-m" text-anchor="middle">第 3 年</text><path d="M622,50 V514" class="l-grid"/><text x="622" y="530" class="t-xs t-m" text-anchor="middle">第 4 年</text><path d="M724,50 V514" class="l-grid"/><text x="724" y="530" class="t-xs t-m" text-anchor="middle">第 5 年</text><path d="M826,50 V514" class="l-grid"/><text x="826" y="530" class="t-xs t-m" text-anchor="middle">第 6 年</text><path d="M928,50 V514" class="l-grid"/><text x="928" y="530" class="t-xs t-m" text-anchor="middle">第 7 年</text><path d="M1030,50 V514" class="l-grid"/><text x="1030" y="530" class="t-xs t-m" text-anchor="middle">第 8 年</text><text x="22" y="86" class="t t-b t-us">美国 · 考核</text><text x="22" y="158" class="t t-b t-us">美国 · 身份与绿卡</text><text x="22" y="230" class="t t-b t-us">美国 · 经费</text><text x="22" y="314" class="t t-b t-cn">中国 · 考核</text><text x="22" y="386" class="t t-b t-cn">中国 · 补贴与安家费</text><text x="22" y="458" class="t t-b t-cn">中国 · 基金与人才项目</text><rect x="214" y="88" width="612" height="12" rx="6" class="k-us"/><text x="218" y="83" class="t-xs">试用期（probationary）：AAUP 原则最长 7 年</text><path d="M520.0,87.0 L527.0,94.0 L520.0,101.0 L513.0,94.0 Z" class="m-us"/><text x="520" y="118" class="t-xs t-b" text-anchor="middle">第 3 年 中期评估</text><path d="M826.0,87.0 L833.0,94.0 L826.0,101.0 L819.0,94.0 Z" class="m-us"/><text x="826" y="118" class="t-xs t-b" text-anchor="middle">第 6 年 tenure 评审</text><rect x="826" y="88" width="102" height="12" rx="6" class="k-cn-wash k-dash"/><text x="830" y="83" class="t-xs"></text><text x="836" y="83" class="t-xs">未通过：一般还有 1 年终止聘期</text><text x="219.1" y="118" class="t-xs">生育、照护等可延长时钟</text><path d="M214.0,159.0 L221.0,166.0 L214.0,173.0 L207.0,166.0 Z" class="m-us"/><text x="224" y="155" class="t-xs">高校 H-1B 免抽签（cap-exempt），全年可递</text><rect x="214" y="182" width="153" height="12" rx="6" class="k-us"/><text x="218" y="177" class="t-xs"></text><text x="375" y="192" class="t-xs">PERM 特殊程序：须在“选定你”（通常早于入职数月）后 18 个月内递交，岗位须含教学；EB-1B / NIW 可并行</text><text x="724" y="155" class="t-xs t-us" text-anchor="middle">中国大陆出生排期（2026-11）：EB-1 约落后 3.3 年，EB-2 约 5.1 年</text><rect x="214" y="232" width="612" height="12" rx="6" class="k-us"/><text x="218" y="227" class="t-xs">NSF CAREER：未获 tenure 的助理教授可申请</text><rect x="214" y="254" width="816" height="12" rx="6" class="k-us k-dash"/><text x="218" y="249" class="t-xs"></text><text x="218" y="278" class="t-xs">NIH 早期研究者（ESI）：取得博士学位后 10 年内；读博后做博士后的年数要扣掉，虚线长度因人而异</text><rect x="214" y="316" width="306" height="12" rx="6" class="k-cn"/><text x="218" y="311" class="t-xs">首个聘期（常见 3 年）</text><rect x="520" y="316" width="306" height="12" rx="6" class="k-cn"/><text x="524" y="311" class="t-xs">第二个聘期</text><path d="M520.0,315.0 L527.0,322.0 L520.0,329.0 L513.0,322.0 Z" class="m-cn"/><text x="520" y="346" class="t-xs t-b" text-anchor="middle">中期考核</text><path d="M826.0,315.0 L833.0,322.0 L826.0,329.0 L819.0,322.0 Z" class="m-cn"/><text x="826" y="346" class="t-xs t-b" text-anchor="middle">长聘评审</text><rect x="826" y="316" width="102" height="12" rx="6" class="k-cn-wash k-dash"/><text x="830" y="311" class="t-xs"></text><text x="836" y="311" class="t-xs">未通过：多数不再续聘或转岗</text><text x="219.1" y="346" class="t-xs">编制岗不同：入编后长期聘用，按职称评审逐级晋升</text><path d="M239.5,387.0 L246.5,394.0 L239.5,401.0 L232.5,394.0 Z" class="m-cn"/><path d="M341.5,387.0 L348.5,394.0 L341.5,401.0 L334.5,394.0 Z" class="m-cn"/><text x="233.5" y="383" class="t-xs">深圳博士补贴 10 万：在深缴社保满 3 个月领 30%，再连续缴满 12 个月领 70%</text><rect x="214" y="410" width="510" height="12" rx="6" class="k-cn k-dash"/><text x="218" y="405" class="t-xs"></text><text x="732" y="420" class="t-xs">安家费 / 购房补贴常分年发放，服务期内离职按合同退还</text><path d="M234.4,459.0 L241.4,466.0 L234.4,473.0 L227.4,466.0 Z" class="m-cn"/><path d="M336.4,459.0 L343.4,466.0 L336.4,473.0 L329.4,466.0 Z" class="m-cn"/><path d="M438.4,459.0 L445.4,466.0 L438.4,473.0 L431.4,466.0 Z" class="m-cn"/><path d="M540.4,459.0 L547.4,466.0 L540.4,473.0 L533.4,466.0 Z" class="m-cn"/><path d="M642.4,459.0 L649.4,466.0 L642.4,473.0 L635.4,466.0 Z" class="m-cn"/><path d="M744.4,459.0 L751.4,466.0 L744.4,473.0 L737.4,466.0 Z" class="m-cn"/><path d="M846.4,459.0 L853.4,466.0 L846.4,473.0 L839.4,466.0 Z" class="m-cn"/><path d="M948.4,459.0 L955.4,466.0 L948.4,473.0 L941.4,466.0 Z" class="m-cn"/><text x="228.4" y="455" class="t-xs">国家自然科学基金每年春季集中接收申请（2026 年为 3 月）</text><text x="219.1" y="490" class="t-xs">海外优青：须在海外正式教研岗位连续工作满 36 个月才能申请（在美国期间申请涉及 MFTRP，见下文）</text><text x="16" y="552" class="t-s">时间线按常见做法和 2026-11 规则绘制，各校聘期、补贴和服务期以合同为准；排期按 2026 年 11 月签证公告的最终行动日估算。</text></svg>
