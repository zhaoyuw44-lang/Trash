s="t t-b">澳大利亚</text><rect x="176" y="139" width="210" height="32" rx="8" class="k-x"/><text x="281" y="159.5" class="t-s t-b" text-anchor="middle">Level A 博士后</text><path d="M387,155 H399" class="l" marker-end="url(#g15-a)"/><rect x="400" y="139" width="210" height="32" rx="8" class="k-x"/><text x="505" y="159.5" class="t-s t-b" text-anchor="middle">Level B Lecturer</text><path d="M611,155 H623" class="l" marker-end="url(#g15-a)"/><rect x="624" y="139" width="210" height="32" rx="8" class="k-x"/><text x="729" y="159.5" class="t-s t-b" text-anchor="middle">Level C Sr Lecturer · D Assoc</text><path d="M835,155 H847" class="l" marker-end="url(#g15-a)"/><rect x="848" y="139" width="210" height="32" rx="8" class="k-x"/><text x="953" y="159.5" class="t-s t-b" text-anchor="middle">Level E Professor</text><text x="16" y="203" class="t t-b">中国香港 · 新加坡</text><rect x="176" y="183" width="210" height="32" rx="8" class="k-x"/><text x="281" y="203.5" class="t-s t-b" text-anchor="middle">Postdoc · Research Fellow</text><path d="M387,199 H399" class="l" marker-end="url(#g15-a)"/><rect x="400" y="183" width="210" height="32" rx="8" class="k-x"/><text x="505" y="203.5" class="t-s t-b" text-anchor="middle">Assistant Prof（tenure track）</text><path d="M611,199 H623" class="l" marker-end="url(#g15-a)"/><rect x="624" y="183" width="210" height="32" rx="8" class="k-x"/><text x="729" y="203.5" class="t-s t-b" text-anchor="middle">Associate Prof</text><path d="M835,199 H847" class="l" marker-end="url(#g15-a)"/><rect x="848" y="183" width="210" height="32" rx="8" class="k-x"/><text x="953" y="203.5" class="t-s t-b" text-anchor="middle">Professor · Chair Prof</text><text x="16" y="247" class="t t-b">瑞士</text><rect x="176" y="227" width="210" height="32" rx="8" class="k-x"/><text x="281" y="247.5" class="t-s t-b" text-anchor="middle">Postdoc · Senior Scientist</text><path d="M387,243 H399" class="l" marker-end="url(#g15-a)"/><rect x="400" y="227" width="210" height="32" rx="8" class="k-x"/><text x="505" y="247.5" class="t-s t-b" text-anchor="middle">Assistant Prof（有或无 TT）</text><path d="M611,243 H623" class="l" marker-end="url(#g15-a)"/><rect x="624" y="227" width="210" height="32" rx="8" class="k-x"/><text x="729" y="247.5" class="t-s t-b" text-anchor="middle">Associate Prof</text><path d="M835,243 H847" class="l" marker-end="url(#g15-a)"/><rect x="848" y="227" width="210" height="32" rx="8" class="k-x"/><text x="953" y="247.5" class="t-s t-b" text-anchor="middle">Full Professor</text><text x="16" y="291" class="t t-b">德国</text><rect x="176" y="271" width="210" height="32" rx="8" class="k-x"/><text x="281" y="291.5" class="t-s t-b" text-anchor="middle">wiss. Mitarbeiter（E13 定期）</text><path d="M387,287 H399" class="l" marker-end="url(#g15-a)"/><rect x="400" y="271" width="210" height="32" rx="8" class="k-x"/><text x="505" y="291.5" class="t-s t-b" text-anchor="middle">Juniorprof. W1 · 研究组组长</text><path d="M611,287 H623" class="l" marker-end="url(#g15-a)"/><rect x="624" y="271" width="210" height="32" rx="8" class="k-x"/><text x="729" y="291.5" class="t-s t-b" text-anchor="middle">Habilitation · W2</text><path d="M835,287 H847" class="l" marker-end="url(#g15-a)"/><rect x="848" y="271" width="210" height="32" rx="8" class="k-x"/><text x="953" y="291.5" class="t-s t-b" text-anchor="middle">W3 Professor</text><text x="16" y="335" class="t t-b">荷兰</text><rect x="176" y="315" width="210" height="32" rx="8" class="k-x"/><text x="281" y="335.5" class="t-s t-b" text-anchor="middle">Postdoc（定期合同）</text><path d="M387,331 H399" class="l" marker-end="url(#g15-a)"/><rect x="400" y="315" width="210" height="32" rx="8" class="k-x"/><text x="505" y="335.5" class="t-s t-b" text-anchor="middle">Universitair docent（UD）</text><path d="M611,331 H623" class="l" marker-end="url(#g15-a)"/><rect x="624" y="315" width="210" height="32" rx="8" class="k-x"/><text x="729" y="335.5" class="t-s t-b" text-anchor="middle">Universitair hoofddocent</text><path d="M835,331 H847" class="l" marker-end="url(#g15-a)"/><rect x="848" y="315" width="210" height="32" rx="8" class="k-x"/><text x="953" y="335.5" class="t-s t-b" text-anchor="middle">Hoogleraar</text><text x="16" y="379" class="t t-b">法国</text><rect x="176" y="359" width="210" height="32" rx="8" class="k-x"/><text x="281" y="379.5" class="t-s t-b" text-anchor="middle">Postdoc · ATER</text><path d="M387,375 H399" class="l" marker-end="url(#g15-a)"/><rect x="400" y="359" width="210" height="32" rx="8" class="k-x"/><text x="505" y="379.5" class="t-s t-b" text-anchor="middle">Maître de conférences</text><path d="M611,375 H623" class="l" marker-end="url(#g15-a)"/><rect x="624" y="359" width="210" height="32" rx="8" class="k-x"/><text x="729" y="379.5" class="t-s t-b" text-anchor="middle">取得 HDR 指导研究资格</text><path d="M835,375 H847" class="l" marker-end="url(#g15-a)"/><rect x="848" y="359" width="210" height="32" rx="8" class="k-x"/><text x="953" y="379.5" class="t-s t-b" text-anchor="middle">Professeur des universités</text><text x="16" y="423" class="t t-b">日本</text><rect x="176" y="403" width="210" height="32" rx="8" class="k-x"/><text x="281" y="423.5" class="t-s t-b" text-anchor="middle">博士研究员 PD · 特任</text><path d="M387,419 H399" class="l" marker-end="url(#g15-a)"/><rect x="400" y="403" width="210" height="32" rx="8" class="k-x"/><text x="505" y="423.5" class="t-s t-b" text-anchor="middle">助教 · 講師</text><path d="M611,419 H623" class="l" marker-end="url(#g15-a)"/><rect x="624" y="403" width="210" height="32" rx="8" class="k-x"/><text x="729" y="423.5" class="t-s t-b" text-anchor="middle">准教授</text><path d="M835,419 H847" class="l" marker-end="url(#g15-a)"/><rect x="848" y="403" width="210" height="32" rx="8" class="k-x"/><text x="953" y="423.5" class="t-s t-b" text-anchor="middle">教授</text><text x="16" y="467" class="t t-b t-cn">中国（对照）</text><rect x="176" y="447" width="210" height="32" rx="8" class="k-cn"/><text x="281" y="467.5" class="t-s t-b" text-anchor="middle">博士后 / 师资博后</text><path d="M387,463 H399" class="l" marker-end="url(#g15-a)"/><rect x="400" y="447" width="210" height="32" rx="8" class="k-cn"/><text x="505" y="467.5" class="t-s t-b" text-anchor="middle">讲师 · 预聘助理教授</text><path d="M611,463 H623" class="l" marker-end="url(#g15-a)"/><rect x="624" y="447" width="210" height="32" rx="8" class="k-cn"/><text x="729" y="467.5" class="t-s t-b" text-anchor="middle">副教授 · 副研究员</text><path d="M835,463 H847" class="l" marker-end="url(#g15-a)"/><rect x="848" y="447" width="210" height="32" rx="8" class="k-cn"/><text x="953" y="467.5" class="t-s t-b" text-anchor="middle">教授 · 研究员</text><text x="16" y="504" class="t-s">层级只是大致对应。法国 MCF 和荷兰 UD 一入职就是长期岗位；德国 W1 一般最长 6 年，传统路线要先拿 Habilitation；</text><text x="16" y="524" class="t-s">日本“特任”多为定期合同；英联邦的 Lecturer 起薪和职责与美国 Assistant Professor 接近，但没有统一的 tenure 评审。</text></svg>
