,996 元/㎡</text><rect x="16" y="424" width="470" height="64" rx="10" class="k-cn-wash"/><text x="28" y="446" class="t t-b t-cn">深圳新引进博士补贴 10 万元 ≈ 1.5 ㎡</text><text x="28" y="466" class="t-xs">按 67,326 元/㎡ 折算。人才补贴的价值要按当地房价看，</text><text x="28" y="480" class="t-xs">且多数补贴需计个税、分期发放、与编制或其他补贴互斥。</text><text x="600" y="28" class="t t-b">走势：二手住宅价格同比（国家统计局，2026-09）</text><text x="600" y="46" class="t-xs">上年同月 = 100；指数只看涨跌，不能比较贵贱。</text><path d="M670.0,66 V544.5" class="l-grid"/><text x="670" y="558.5" class="t-xs t-m" text-anchor="middle">94</text><path d="M722.0,66 V544.5" class="l-grid"/><text x="722" y="558.5" class="t-xs t-m" text-anchor="middle">95</text><path d="M774.0,66 V544.5" class="l-grid"/><text x="774" y="558.5" class="t-xs t-m" text-anchor="middle">96</text><path d="M826.0,66 V544.5" class="l-grid"/><text x="826" y="558.5" class="t-xs t-m" text-anchor="middle">97</text><path d="M878.0,66 V544.5" class="l-grid"/><text x="878" y="558.5" class="t-xs t-m" text-anchor="middle">98</text><path d="M930.0,66 V544.5" class="l-grid"/><text x="930" y="558.5" class="t-xs t-m" text-anchor="middle">99</text><path d="M982.0,66 V544.5" class="l-axis"/><text x="982" y="558.5" class="t-xs t-m" text-anchor="middle">100</text><path d="M1034.0,66 V544.5" class="l-grid"/><text x="1034" y="558.5" class="t-xs t-m" text-anchor="middle">101</text><text x="600" y="87.25" class="t-s">上海</text><path d="M982.0,83.25 H1023.6" class="l-w"/><circle cx="1023.6" cy="83.25" r="5" class="m-ch-w"><title>上海：100.8</title></circle><text x="1032.6" y="87.25" class="t-xs t-m">+0.8%</text><text x="600" y="109.75" class="t-s">深圳</text><path d="M982.0,105.75 H904.0" class="l"/><circle cx="904.0" cy="105.75" r="5" class="m-ink2"><title>深圳：98.5</title></circle><text x="895" y="109.75" class="t-xs t-m" text-anchor="end">-1.5%</text><text x="600" y="132.25" class="t-s">宁波</text><path d="M982.0,128.25 H888.4" class="l"/><circle cx="888.4" cy="128.25" r="5" class="m-ink2"><title>宁波：98.2</title></circle><text x="87