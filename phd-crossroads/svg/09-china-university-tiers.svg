<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" width="1080" height="300" role="img" aria-label="中国高校标签的包含关系：双一流 147 所 ⊃ 211 约 112 所 ⊃ 985 共 39 所 ⊃ C9 共 9 所"><title>中国高校标签的包含关系：双一流 147 所 ⊃ 211 约 112 所 ⊃ 985 共 39 所 ⊃ C9 共 9 所</title><style>:root{--paper:#F3F5F4;--paper-2:#E8ECEB;--card:#FFFFFF;--ink:#16202A;--ink-2:#4E5A66;--line:#CDD5D6;--us:#2B4C9B;--us-tint:#E4EBF8;--us-wash:#EEF2FA;--cn:#B03A2E;--cn-tint:#F8E4E0;--cn-wash:#FBF0EE;--mute:#9AA4AE;--ch-cn:#B03A2E;--ch-row:#6B5FB5;--sans:'Noto Sans SC','PingFang SC','Microsoft YaHei','Source Han Sans SC',sans-serif;--serif:'Noto Serif SC','Songti SC','STSong',serif;--mono:'IBM Plex Mono',Menlo,Consolas,monospace}@media (prefers-color-scheme: dark){:root{--paper:#11161C;--paper-2:#1A2129;--card:#171E26;--ink:#E4E9EE;--ink-2:#A2ADB8;--line:#2F3A46;--us:#8EADF2;--us-tint:#1C2A47;--us-wash:#16203A;--cn:#F08C7A;--cn-tint:#3B211E;--cn-wash:#2A1A19;--mute:#5D6873;--ch-cn:#D9644F;--ch-row:#8A80D0}} .f-bg{fill:var(--paper)} .k-box{fill:var(--card);stroke:var(--line);stroke-width:1} .k-us{fill:var(--us-tint);stroke:var(--us);stroke-width:1.2} .k-cn{fill:var(--cn-tint);stroke:var(--cn);stroke-width:1.2} .k-mute{fill:var(--paper-2);stroke:var(--line);stroke-width:1} .k-solid-us{fill:var(--us);stroke:var(--us)} .k-solid-cn{fill:var(--cn);stroke:var(--cn)} .k-ink{fill:var(--ink)} .k-pill{fill:var(--card);stroke:var(--line)} .k-dash{stroke-dasharray:4 3} .k-band-us{fill:var(--us-wash)} .k-band-cn{fill:var(--cn-wash)} .k-band-mute{fill:var(--paper-2)} .k-cn-wash{fill:var(--cn-wash);stroke:var(--cn);stroke-width:1;stroke-dasharray:5 4} .m-us{fill:var(--us)} .m-cn{fill:var(--cn)} .m-ink{fill:var(--ink)} .m-ink2{fill:var(--ink-2)} .m-mute{fill:var(--mute)} .m-ch-cn{fill:var(--ch-cn)} .m-ch-row{fill:var(--ch-row)} .m-bg-us{fill:var(--card);stroke:var(--us);stroke-width:2} .ring-dot{stroke:var(--card);stroke-width:2} .l{fill:none;stroke:var(--ink-2);stroke-width:1.5} .l-us{stroke:var(--us)} .l-cn{stroke:var(--cn)} .l-dash{stroke-dasharray:5 4} .l-strong{stroke:var(--ink);stroke-width:1.5} .l-grid{fill:none;stroke:var(--line);stroke-width:1} .l-axis{fill:none;stroke:var(--ink-2);stroke-width:1} .l-tick{fill:none;stroke:var(--ink);stroke-width:2.5} .l-now{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round} text{font-family:var(--sans)} .t{fill:var(--ink);font-size:13px;font-weight:500} .t-s{fill:var(--ink-2);font-size:11.5px;font-weight:400} .t-xs{fill:var(--ink-2);font-size:10.5px;font-weight:400} .t-h{fill:var(--ink);font-family:var(--serif);font-size:15px;font-weight:700} .t-b{font-weight:700} .t-m{font-family:var(--mono)} .t-us{fill:var(--us)} .t-cn{fill:var(--cn)} .t-inv{fill:var(--paper)} </style><rect class="f-bg" x="0" y="0" width="1080" height="300"/><defs><marker id="g09-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="m-ink2"/></marker><marker id="g09-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="m-us"/></marker><marker id="g09-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="m-cn"/></marker></defs><rect x="20" y="16" width="560" height="270" rx="16" class="k-box"/><text x="40" y="44" class="t t-b">双一流建设高校 147 所（2022 年第二轮）</text><rect x="44" y="60" width="512" height="210" rx="14" class="k-cn-wash"/><text x="64" y="86" class="t t-b t-cn">“211 工程” 约 112 所（历史标签）</text><rect x="68" y="104" width="300" height="150" rx="12" class="k-cn"/><text x="88" y="130" class="t t-b t-cn">“985 工程” 39 所</text><rect x="92" y="150" width="150" height="84" rx="10" class="k-solid-cn"/><text x="167" y="186" class="t t-b t-inv" text-anchor="middle">C9 联盟</text><text x="167" y="206" class="t-s t-inv" text-anchor="middle">9 所</text><text x="256" y="186" class="t-xs">← 最顶尖</text><rect x="384" y="116" width="156" height="86" rx="8" class="k-box"/><text x="462" y="148.5" class="t-s t-b" text-anchor="middle">一流大学建设</text><text x="462" y="164.5" class="t-xs" text-anchor="middle">高校 42 所</text><text x="462" y="179.5" class="t-xs" text-anchor="middle">= 985 的 39 所 + 3</text><circle cx="624" cy="46" r="2.5" class="m-ink2"/><text x="636" y="50" class="t-s">985 / 211 已于 2016–2017 年并入“双一流”，</text><text x="636" y="72" class="t-s">但招聘、落户和人才项目中仍常被当作筛选条件。</text><circle cx="624" cy="104" r="2.5" class="m-ink2"/><text x="636" y="108" class="t-s">很多单位看“第一学历”（本科院校层次）。</text><circle cx="624" cy="140" r="2.5" class="m-ink2"/><text x="636" y="144" class="t-s">具体学科是否入选“双一流学科”，</text><text x="636" y="166" class="t-s">往往比学校标签更影响岗位层级和经费。</text><circle cx="624" cy="198" r="2.5" class="m-ink2"/><text x="636" y="202" class="t-s">上海留学回国落户按世界排名认定</text><text x="636" y="224" class="t-s">（QS、THE、U.S. News、软科）前 50 / 51–100。</text></svg>
