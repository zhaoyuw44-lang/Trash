</title></path><path d="M95.6,418.0 A236,236 0 0 1 237.1,72.5 L242.4,91.8 A216,216 0 0 0 112.9,408.0 Z" class="k-us"><title>教职申请</title></path><path d="M335.7,66.7 A236,236 0 0 1 504.4,418.0 L487.1,408.0 A216,216 0 0 0 332.7,86.5 Z" class="k-us"><title>教职面试 · offer</title></path><path d="M197.0,478.4 A206,206 0 0 1 197.0,121.6 L207.0,138.9 A186,186 0 0 0 207.0,461.1 Z" class="m-cn"><title>秋招</title></path><path d="M478.4,197.0 A206,206 0 0 1 402.9,478.4 L392.9,461.1 A186,186 0 0 0 461.1,207.0 Z" class="m-cn"><title>春招</title></path><path d="M428.7,171.3 A182,182 0 0 1 471.0,362.2 L452.2,355.4 A162,162 0 0 0 414.6,185.4 Z" class="k-cn"><title>海外优青申报</title></path><path d="M122.4,260.4 A182,182 0 0 1 132.8,228.2 L151.1,236.1 A162,162 0 0 0 141.9,264.7 Z" class="k-cn"><title>国考报名</title></path><circle cx="50.0" cy="300.0" r="7" class="m-us ring-dot"><title>H-1B 生效 10/1</title></circle><circle cx="208.9" cy="154.1" r="7" class="m-cn ring-dot"><title>国考笔试</title></circle><g class="wheel-now" transform="rotate(311.00 300 300)"><path d="M300,160 V30" class="l-now"/><circle cx="300" cy="28" r="5" class="m-ink"/></g><text x="300" y="294" class="t-h" text-anchor="middle">一年中的</text><text x="300" y="316" class="t-h" text-anchor="middle">关键窗口</text><text x="300" y="340" class="t-xs" text-anchor="middle">指针 = 今天</text><text x="640" y="70" class="t-h t-us">美国（外两圈）</text><rect x="640" y="88" width="14" height="12" rx="2" class="m-us"/><text x="664" y="98" class="t-s">H-1B 注册：3 月（雇主提交，约 2–3 周）</text><rect x="640" y="114" width="14" height="12" rx="2" class="m-us"/><text x="664" y="124" class="t-s">H-1B 递交 I-129：4/1–6/30；● 10/1 生效</text><rect x="640" y="140" width="14" height="12" rx="2" class="k-us"/><text x="664" y="150" class="t-s">教职申请：9–12 月</text><rect x="640" y="166" width="14" height="12" rx="2" class="k-us"/><text x="664" y="176" class="t-s">教职面试与 offer：1–4 月</text><text x="647" y="202" class="t t-b" text-anchor="middle">·</text><text x="664" y="202" class="t-s">报税截止 4/15；离境当年注意 dual-status</text><text x="640" y="252" class="t-h t-cn">中国（内两圈）</text><rect x="640" y="270" width="14" height="12" rx="2" class="m-cn"/><text x="664" y="280" class="t-s">秋招：8–11 月（提前批 7–8 月）</text><rect x="640" y="296" width="14" height="12" rx="2" class="m-cn"/><text x="664" y="306" class="t-s">春招：3–5 月</text><rect x="640" y="322" width="14" height="12" rx="2" class="k-cn"/><text x="664" y="332" class="t-s">海外优青：约 2–4 月申报（以基金委当年通知为准）</text><rect x="640" y="348" width="14" height="12" rx="2" class="k-cn"/><text x="664" y="358" class="t-s">国考：10 月中旬报名；● 11 月底至 12 月初笔试</text><text x="647" y="384" class="t t-b" text-anchor="middle">·</text><text x="664" y="384" class="t-s">高校人才招聘全年滚动，海外青年学者论坛多在秋冬</text><text x="640" y="436" class="t-xs">日期为典型窗口，每年以官方通知为准。</text></svg>
