            <text x="270" y="140" text-anchor="middle" fill="rgb(21, 32, 27)" font-family="Overpass, &quot;Noto Sans SC&quot;, system-ui, sans-serif" font-weight="700">Utah</text><text x="270" y="156" text-anchor="middle" fill="rgb(86, 99, 93)" font-family="Overpass, &quot;Noto Sans SC&quot;, system-ui, sans-serif" font-weight="600">唯一 0.05 州</text>
