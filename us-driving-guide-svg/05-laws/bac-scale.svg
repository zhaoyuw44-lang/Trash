          <text x="40" y="182" font-size="11" fill="rgb(86, 99, 93)" font-family="&quot;Noto Sans SC&quot;, Overpass, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif" font-weight="600">BAC = Blood Alcohol Concentration，以 g/100 mL 计。0.08 意味着每 100 毫升血液含 0.08 克酒精。</text>
