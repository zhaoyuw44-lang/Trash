          <g font-size="12">
            <text x="40" y="40" fill="rgb(21, 32, 27)" font-family="Overpass, &quot;Noto Sans SC&quot;, system-ui, sans-serif" font-weight="700">零容忍</text><text x="40" y="56" fill="rgb(86, 99, 93)" font-family="Overpass, &quot;Noto Sans SC&quot;, system-ui, sans-serif" font-weight="600">安全底线</text>
            <text x="125" y="140" text-anchor="middle" fill="rgb(21, 32, 27)" font-family="Overpass, &quot;Noto Sans SC&quot;, system-ui, sans-serif" font-weight="700">21岁以下</text><text x="125" y="156" text-anchor="middle" fill="rgb(86, 99, 93)" font-family="Overpass, &quot;Noto Sans SC&quot;, system-ui, sans-serif" font-weight="600">多数州上限</text>
