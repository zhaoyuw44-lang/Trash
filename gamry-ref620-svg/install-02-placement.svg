<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="摆放：仪器靠风扇强制风冷，进出风口都要留空；封闭空间内环境温度不超过 45 °C；只在室内使用，远离干扰源。" style="font-family:var(--f-body,'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif)"><title>摆放：仪器靠风扇强制风冷，进出风口都要留空；封闭空间内环境温度不超过 45 °C；只在室内使用，远离干扰源。</title><defs><marker id="install-02-placement-ah-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--accent,#1E5BA8)"/></marker><marker id="install-02-placement-ah-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--warn,#965800)"/></marker></defs><rect x="0" y="0" width="600" height="300" style="fill:var(--surface,#FFFFFF)"/><rect x="20" y="40" width="370" height="236" rx="8" style="fill:none;stroke:var(--muted,#56616E);stroke-width:1.5;stroke-dasharray:6 5"/><text x="34" y="62" style="fill:var(--muted,#56616E);font-size:12px;font-weight:400" text-anchor="start">机柜或封闭空间（仅限室内）</text><path d="M30 148 H74" style="fill:none;stroke:var(--accent,#1E5BA8);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-02-placement-ah-accent)"/><path d="M30 168 H74" style="fill:none;stroke:var(--accent,#1E5BA8);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-02-placement-ah-accent)"/><path d="M30 188 H74" style="fill:none;stroke:var(--accent,#1E5BA8);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-02-placement-ah-accent)"/><text x="52" y="226" style="fill:var(--accent,#1E5BA8);font-size:12px;font-weight:700" text-anchor="middle">进风</text><rect x="80" y="130" width="140" height="76" rx="6" style="fill:var(--panel,#2A3139);stroke:var(--panel-edge,#151A1F);stroke-width:1.5"/><text x="150" y="166" style="fill:var(--panel-ink,#E7ECF1);font-size:13px;font-weight:700" text-anchor="middle">Reference 620</text><text x="150" y="186" style="fill:var(--panel-ink,#E7ECF1);font-size:11px;font-weight:400" text-anchor="middle">风扇强制风冷</text><path d="M226 148 H270" style="fill:none;stroke:var(--warn,#965800);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-02-placement-ah-warn)"/><path d="M226 168 H270" style="fill:none;stroke:var(--warn,#965800);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-02-placement-ah-warn)"/><path d="M226 188 H270" style="fill:none;stroke:var(--warn,#965800);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-02-placement-ah-warn)"/><text x="248" y="226" style="fill:var(--warn,#965800);font-size:12px;font-weight:700" text-anchor="middle">出风</text><text x="150" y="254" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="middle">进出风口都要留出空间（位置以实物为准）</text><rect x="286" y="124" width="44" height="86" rx="4" style="fill:var(--sunk,#E2E7EC);stroke:var(--rule,#C9D1DA);stroke-width:1.5"/><text x="308" y="172" style="fill:var(--muted,#56616E);font-size:12px;font-weight:700" text-anchor="middle">PC</text><path d="M308 120 V94" style="fill:none;stroke:var(--warn,#965800);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-02-placement-ah-warn)"/><text x="308" y="86" style="fill:var(--warn,#965800);font-size:11.5px;font-weight:600" text-anchor="middle">也发热</text><rect x="352" y="70" width="14" height="124" rx="7" style="fill:var(--surface,#FFFFFF);stroke:var(--ink,#131C26);stroke-width:1.5"/><rect x="356" y="118" width="6" height="80" rx="3" style="fill:var(--danger,#B42318)"/><circle cx="359" cy="204" r="12" style="fill:var(--danger,#B42318);stroke:var(--ink,#131C26);stroke-width:1.5"/><text x="359" y="238" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="middle">≤ 45 °C</text><text x="359" y="256" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">环境温度</text><rect x="410" y="40" width="170" height="110" rx="10" style="fill:var(--danger-soft,#F8E1DE);stroke:var(--danger,#B42318);stroke-width:1.5"/><circle cx="428" cy="62" r="9" style="fill:var(--danger,#B42318)"/><path d="M424.5 58.5 L431.5 65.5 M431.5 58.5 L424.5 65.5" style="fill:none;stroke:var(--surface,#FFFFFF);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"/><text x="444" y="67" style="fill:var(--danger,#B42318);font-size:13px;font-weight:700" text-anchor="start">风口被挡住</text><text x="424" y="92" style="fill:var(--ink,#131C26);font-size:12px;font-weight:400" text-anchor="start">贴墙，或被纸箱、线缆</text><text x="424" y="110" style="fill:var(--ink,#131C26);font-size:12px;font-weight:400" text-anchor="start">和其他设备遮挡</text><text x="424" y="134" style="fill:var(--muted,#56616E);font-size:12px;font-weight:400" text-anchor="start">→ 元件过热</text><rect x="410" y="166" width="170" height="110" rx="10" style="fill:var(--danger-soft,#F8E1DE);stroke:var(--danger,#B42318);stroke-width:1.5"/><circle cx="428" cy="188" r="9" style="fill:var(--danger,#B42318)"/><path d="M424.5 184.5 L431.5 191.5 M431.5 184.5 L424.5 191.5" style="fill:none;stroke:var(--surface,#FFFFFF);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"/><text x="444" y="193" style="fill:var(--danger,#B42318);font-size:13px;font-weight:700" text-anchor="start">户外或干扰源旁</text><text x="424" y="218" style="fill:var(--ink,#131C26);font-size:12px;font-weight:400" text-anchor="start">不是户外设备；</text><text x="424" y="236" style="fill:var(--ink,#131C26);font-size:12px;font-weight:400" text-anchor="start">远离电机、变频器和</text><text x="424" y="254" style="fill:var(--ink,#131C26);font-size:12px;font-weight:400" text-anchor="start">大功率电源线</text></svg>
