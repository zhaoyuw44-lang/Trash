<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="摆放：空气从机箱两侧靠近前面板的槽口进入，从后部两只风扇排出；背面要留出接线和出风空间；工作环境 0–45 °C、相对湿度不超过 90 % 且不凝露，仅限室内。" style="font-family:var(--f-body,'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif)"><title>摆放：空气从机箱两侧靠近前面板的槽口进入，从后部两只风扇排出；背面要留出接线和出风空间；工作环境 0–45 °C、相对湿度不超过 90 % 且不凝露，仅限室内。</title><defs><marker id="install-02-placement-ah-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--accent,#1E5BA8)"/></marker><marker id="install-02-placement-ah-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--warn,#965800)"/></marker></defs><rect x="0" y="0" width="600" height="300" style="fill:var(--surface,#FFFFFF)"/><text x="20" y="30" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="start">俯视示意（仪器通常直立放置）</text><text x="140" y="76" style="fill:var(--accent,#1E5BA8);font-size:12px;font-weight:700" text-anchor="start">进风：两侧靠近前面板的槽口</text><path d="M92 62 V104" style="fill:none;stroke:var(--accent,#1E5BA8);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-02-placement-ah-accent)"/><path d="M92 238 V196" style="fill:none;stroke:var(--accent,#1E5BA8);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-02-placement-ah-accent)"/><path d="M118 62 V104" style="fill:none;stroke:var(--accent,#1E5BA8);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-02-placement-ah-accent)"/><path d="M118 238 V196" style="fill:none;stroke:var(--accent,#1E5BA8);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-02-placement-ah-accent)"/><rect x="70" y="110" width="180" height="80" rx="6" style="fill:var(--panel,#2A3139);stroke:var(--panel-edge,#151A1F);stroke-width:1.5"/><path d="M82 110 H128 M82 190 H128" style="fill:none;stroke:var(--accent,#1E5BA8);stroke-width:4;stroke-linecap:butt;stroke-linejoin:round"/><text x="150" y="154" style="fill:var(--panel-ink,#E7ECF1);font-size:13px;font-weight:700" text-anchor="middle">Reference 620</text><text x="64" y="154" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:600" text-anchor="end">前面板</text><circle cx="230" cy="132" r="12" style="fill:none;stroke:var(--panel-ink,#E7ECF1);stroke-width:1.5"/><circle cx="230" cy="132" r="4" style="fill:var(--panel-ink,#E7ECF1)"/><path d="M252 132 H304" style="fill:none;stroke:var(--warn,#965800);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-02-placement-ah-warn)"/><circle cx="230" cy="168" r="12" style="fill:none;stroke:var(--panel-ink,#E7ECF1);stroke-width:1.5"/><circle cx="230" cy="168" r="4" style="fill:var(--panel-ink,#E7ECF1)"/><path d="M252 168 H304" style="fill:none;stroke:var(--warn,#965800);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-02-placement-ah-warn)"/><text x="256" y="118" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:600" text-anchor="start">后面板</text><text x="256" y="214" style="fill:var(--warn,#965800);font-size:12px;font-weight:700" text-anchor="start">出风：后部两只风扇</text><text x="256" y="230" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="start">背面还要留出接线空间</text><rect x="20" y="252" width="118" height="30" rx="15" style="fill:var(--sunk,#E2E7EC)"/><text x="79.0" y="272" style="fill:var(--ink,#131C26);font-size:12px;font-weight:700" text-anchor="middle">0–45 °C</text><rect x="148" y="252" width="150" height="30" rx="15" style="fill:var(--sunk,#E2E7EC)"/><text x="223.0" y="272" style="fill:var(--ink,#131C26);font-size:12px;font-weight:700" text-anchor="middle">RH ≤ 90 % 不凝露</text><rect x="308" y="252" width="92" height="30" rx="15" style="fill:var(--sunk,#E2E7EC)"/><text x="354.0" y="272" style="fill:var(--ink,#131C26);font-size:12px;font-weight:700" text-anchor="middle">仅限室内</text><rect x="420" y="40" width="160" height="110" rx="10" style="fill:var(--danger-soft,#F8E1DE);stroke:var(--danger,#B42318);stroke-width:1.5"/><circle cx="438" cy="62" r="9" style="fill:var(--danger,#B42318)"/><path d="M434.5 58.5 L441.5 65.5 M441.5 58.5 L434.5 65.5" style="fill:none;stroke:var(--surface,#FFFFFF);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"/><text x="454" y="67" style="fill:var(--danger,#B42318);font-size:13px;font-weight:700" text-anchor="start">风口被挡住</text><text x="434" y="92" style="fill:var(--ink,#131C26);font-size:12px;font-weight:400" text-anchor="start">外壳可能烫手，</text><text x="434" y="110" style="fill:var(--ink,#131C26);font-size:12px;font-weight:400" text-anchor="start">缩短电路寿命</text><text x="434" y="134" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="start">过热时电路会关断</text><rect x="420" y="166" width="160" height="116" rx="10" style="fill:var(--warn-soft,#F6EAD3);stroke:var(--warn,#965800);stroke-width:1.5"/><circle cx="438" cy="188" r="9" style="fill:var(--warn,#965800)"/><path d="M438 183.5 V189" style="fill:none;stroke:var(--surface,#FFFFFF);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"/><circle cx="438" cy="192.2" r="1.3" style="fill:var(--surface,#FFFFFF)"/><text x="454" y="193" style="fill:var(--warn,#965800);font-size:13px;font-weight:700" text-anchor="start">放进机柜时</text><text x="434" y="218" style="fill:var(--ink,#131C26);font-size:12px;font-weight:400" text-anchor="start">柜内也不能超过 45 °C；</text><text x="434" y="236" style="fill:var(--ink,#131C26);font-size:12px;font-weight:400" text-anchor="start">和电脑同柜要特别注意，</text><text x="434" y="254" style="fill:var(--ink,#131C26);font-size:12px;font-weight:400" text-anchor="start">必要时加通风孔</text><text x="434" y="272" style="fill:var(--ink,#131C26);font-size:12px;font-weight:400" text-anchor="start">或强制风冷</text></svg>
