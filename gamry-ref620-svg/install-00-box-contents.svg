<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="600" height="430" role="img" aria-label="开箱物品去向：电源适配器、USB 线和电解池电缆一直接在主机上；200 Ω 校准池和校准屏蔽盒只在校准时使用，黑色接地线校准时把机壳接大地；校准完成后电缆另一端改接电解池，校准池收好。" style="font-family:var(--f-body,'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif)"><title>开箱物品去向：电源适配器、USB 线和电解池电缆一直接在主机上；200 Ω 校准池和校准屏蔽盒只在校准时使用，黑色接地线校准时把机壳接大地；校准完成后电缆另一端改接电解池，校准池收好。</title><defs><marker id="install-00-box-contents-ah-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--accent,#1E5BA8)"/></marker><marker id="install-00-box-contents-ah-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--warn,#965800)"/></marker><marker id="install-00-box-contents-ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--ok,#2B7346)"/></marker></defs><rect x="0" y="0" width="600" height="430" style="fill:var(--surface,#FFFFFF)"/><path d="M20 30 H44" style="fill:none;stroke:var(--accent,#1E5BA8);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/><text x="52" y="34" style="fill:var(--ink,#131C26);font-size:11px;font-weight:400" text-anchor="start">一直连接</text><path d="M150 30 H174" style="fill:none;stroke:var(--warn,#965800);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 4"/><text x="182" y="34" style="fill:var(--ink,#131C26);font-size:11px;font-weight:400" text-anchor="start">校准时</text><path d="M290 30 H314" style="fill:none;stroke:var(--ok,#2B7346);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/><text x="322" y="34" style="fill:var(--ink,#131C26);font-size:11px;font-weight:400" text-anchor="start">实验时</text><text x="225" y="102" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="start">后面板</text><text x="375" y="102" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="end">前面板</text><rect x="225" y="110" width="150" height="170" rx="8" style="fill:var(--panel,#2A3139);stroke:var(--panel-edge,#151A1F);stroke-width:1.5"/><text x="300" y="196" style="fill:var(--panel-ink,#E7ECF1);font-size:13px;font-weight:700" text-anchor="middle">Reference 620</text><text x="300" y="214" style="fill:var(--panel-ink,#E7ECF1);font-size:11px;font-weight:400" text-anchor="middle">主机</text><rect x="217" y="133" width="12" height="14" rx="2" style="fill:var(--sunk,#E2E7EC);stroke:var(--ink,#131C26);stroke-width:1"/><text x="235" y="144" style="fill:var(--panel-ink,#E7ECF1);font-size:9.5px;font-weight:400" text-anchor="start">Power In</text><rect x="217" y="174" width="12" height="12" rx="2" style="fill:var(--sunk,#E2E7EC);stroke:var(--ink,#131C26);stroke-width:1"/><text x="235" y="184" style="fill:var(--panel-ink,#E7ECF1);font-size:9.5px;font-weight:400" text-anchor="start">USB</text><circle cx="223" cy="222" r="5" style="fill:var(--sunk,#E2E7EC);stroke:var(--ink,#131C26);stroke-width:1.5"/><text x="235" y="226" style="fill:var(--panel-ink,#E7ECF1);font-size:9.5px;font-weight:400" text-anchor="start">Chassis Ground</text><rect x="217" y="249" width="12" height="16" rx="2" style="fill:var(--ok,#2B7346);stroke:var(--ink,#131C26);stroke-width:1"/><text x="235" y="261" style="fill:var(--panel-ink,#E7ECF1);font-size:9.5px;font-weight:400" text-anchor="start">Power 开关</text><rect x="372" y="176" width="12" height="60" rx="3" style="fill:var(--ink,#131C26)"/><text x="366" y="160" style="fill:var(--panel-ink,#E7ECF1);font-size:9.5px;font-weight:400" text-anchor="end">Cell Cable</text><rect x="20" y="118" width="150" height="46" rx="8" style="fill:var(--surface,#FFFFFF);stroke:var(--accent,#1E5BA8);stroke-width:1.5"/><text x="30" y="136" style="fill:var(