ight:400" text-anchor="middle">注册仪器后下载</text><text x="225" y="142" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400;font-family:var(--f-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)" text-anchor="middle">.exe 或 .iso</text><text x="375" y="84" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="middle">重启电脑</text><text x="375" y="106" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">桌面出现后</text><text x="375" y="124" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">驱动可能还要</text><text x="375" y="142" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">1 分钟以上</text><text x="525" y="84" style="fill:var(--ok,#2B7346);font-size:13px;font-weight:700" text-anchor="middle">再接仪器</text><text x="525" y="106" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">即插即用</text><text x="525" y="124" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400;font-family:var(--f-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)" text-anchor="middle">Framework</text><text x="525" y="142" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">7.9 或更高</text><circle cx="28" cy="200" r="9" style="fill:var(--danger,#B42318)"/><path d="M24.5 196.5 L31.5 203.5 M31.5 196.5 L24.5 203.5" style="fill:none;stroke:var(--surface,#FFFFFF);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"/><text x="44" y="205" style="fill:var(--danger,#B42318);font-size:13px;font-weight:700" text-anchor="start">顺序反了</text><rect x="20" y="220" width="170" height="50" rx="8" style="fill:var(--sunk,#E2E7EC);stroke:var(--rule,#C9D1DA);stroke-width:1.5"/><text x="105" y="250" style="fill:var(--ink,#131C26);font-size:12.5px;font-weight:600" text-anchor="middle">先接仪器、后装软件</text><path d="M190 245 H226" style="fill:none;stroke:var(--danger,#B42318);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-03-software-ah-danger)"/><rect x="230" y="220" width="350" height="50" rx="8" style="fill:var(--danger-soft,#F8E1DE);stroke:var(--danger,#B42318);stroke-width:1.5"/><text x="405" y="242" style="fill:var(--danger,#B42318);font-size:12.5px;font-weight:700" text-anchor="middle">Windows 可能无法正确识别仪器</text><text x="405" y="260" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="middle">手册：即插即用设备最好先装软件</text></svg>
