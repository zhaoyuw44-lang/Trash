<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-label="开箱检查：有运输损坏就不上电，通知 Gamry 和承运人并保留包装箱；没有损坏但从低温处运来的仪器，先在室温放置至少 1 小时。" style="font-family:var(--f-body,'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif)"><title>开箱检查：有运输损坏就不上电，通知 Gamry 和承运人并保留包装箱；没有损坏但从低温处运来的仪器，先在室温放置至少 1 小时。</title><defs><marker id="install-01-inspect-ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--ink,#131C26)"/></marker><marker id="install-01-inspect-ah-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--danger,#B42318)"/></marker></defs><rect x="0" y="0" width="600" height="330" style="fill:var(--surface,#FFFFFF)"/><rect x="20" y="40" width="140" height="110" rx="10" style="fill:var(--sunk,#E2E7EC);stroke:var(--rule,#C9D1DA);stroke-width:1.5"/><path d="M60 70 L90 58 L120 70 L120 108 L90 120 L60 108 Z" style="fill:var(--accent-soft,#DCE7F5);stroke:var(--ink,#131C26);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"/><path d="M60 70 L90 82 L120 70 M90 82 V120" style="fill:none;stroke:var(--ink,#131C26);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"/><text x="90" y="138" style="fill:var(--ink,#131C26);font-size:13px;font-weight:600" text-anchor="middle">开箱检查外观</text><text x="20" y="178" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="start">随机配件（以装箱单为准）</text><text x="28" y="198" style="fill:var(--ink,#131C26);font-size:12px;font-weight:400" text-anchor="start">· 主机、电源适配器 + 电源线</text><text x="28" y="218" style="fill:var(--ink,#131C26);font-size:12px;font-weight:400" text-anchor="start">· USB A/B 线</text><text x="28" y="238" style="fill:var(--ink,#131C26);font-size:12px;font-weight:400" text-anchor="start">· 60 cm 屏蔽电解池电缆</text><text x="28" y="258" style="fill:var(--ink,#131C26);font-size:12px;font-weight:400" text-anchor="start">· 200 Ω 与 20 kΩ 校准池</text><text x="28" y="278" style="fill:var(--ink,#131C26);font-size:12px;font-weight:400" text-anchor="start">· 1.2 m 黑色接地线</text><text x="28" y="298" style="fill:var(--ink,#131C26);font-size:12px;font-weight:400" text-anchor="start">· 配件包、标签纸</text><path d="M160 95 H218" style="fill:none;stroke:var(--ink,#131C26);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-01-inspect-ah-ink)"/><polygon points="222,95 300,45 378,95 300,145" style="fill:var(--accent-soft,#DCE7F5);stroke:var(--accent,#1E5BA8);stroke-width:1.5;stroke-linejoin:round"/><text x="300" y="91" style="fill:var(--ink,#131C26);font-size:13px;font-weight:600" text-anchor="middle">有运输损坏</text><text x="300" y="110" style="fill:var(--ink,#131C26);font-size:13px;font-weight:600" text-anchor="middle">或其他异常？</text><path d="M378 95 H436" style="fill:none;stroke:var(--ink,#131C26);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-01-inspect-ah-ink)"/><text x="407" y="86" style="fill:var(--ok,#2B7346);font-size:12.5px;font-weight:700" text-anchor="middle">否</text><rect x="440" y="45" width="140" height="100" rx="10" style="fill:var(--sunk,#E2E7EC);stroke:var(--rule,#C9D1DA);stroke-width:1.5"/><text x="510" y="74" style="fill:var(--ink,#131C26);font-size:12.5px;font-weight:600" text-anchor="middle">从低温处运来？</text><text x="510" y="103" style="fill:var(--accent,#1E5BA8);font-size:17px;font-weight:700" text-anchor="middle">回温 ≥ 1 小时</text><text x="510" y="128" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="middle">防止内部凝露</text><path d="M510 145 V192" style="fill:none;stroke:var(--ink,#131C26);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-01-inspect-ah-ink)"/><text x="518" y="173" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="start">回温后</text><rect x="440" y="196" width="140" height="64" rx="10" style="fill:var(--ok-soft,#DDEFE3);stroke:var(--ok,#2B7346);stroke-width:1.5"/><text x="510" y="222" style="fill:var(--ok,#2B7346);font-size:13px;font-weight:700" text-anchor="middle">可以开始安装</text><text x="510" y="243" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="middle">下一步：摆放</text><path d="M300 145 V192" style="fill:none;stroke:var(--danger,#B42318);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-01-inspect-ah-danger)"/><text x="308" y="174" style="fill:var(--danger,#B42318);font-size:12.5px;font-weight:700" text-anchor="start">是</text><rect x="210" y="196" width="190" height="122" rx="10" style="fill:var(--danger-soft,#F8E1DE);stroke:var(--danger,#B42318);stroke-width:1.5"/><text x="305" y="220" style="fill:var(--danger,#B42318);font-size:15px;font-weight:700" text-anchor="middle">不要上电</text><text x="305" y="242" style="fill:var(--ink,#131C26);font-size:12px;font-weight:400" text-anchor="middle">通知 Gamry 和承运人</text><text x="305" y="261" style="fill:var(--ink,#131C26);font-size:12px;font-weight:400" text-anchor="middle">保留包装箱供检查</text><text x="305" y="280" style="fill:var(--ink,#131C26);font-size:12px;font-weight:400" text-anchor="middle">贴上“安全隐患”标签</text><text x="305" y="304" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">须经合格技术人员确认安全</text></svg>
