<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" role="img" aria-label="开箱检查流程：外观有损坏就不上电并联系 Gamry；没有损坏的冷机先回温至少 1 小时再安装。" style="font-family:var(--f-body,'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif)"><title>开箱检查流程：外观有损坏就不上电并联系 Gamry；没有损坏的冷机先回温至少 1 小时再安装。</title><defs><marker id="install-01-inspect-ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--ink,#131C26)"/></marker><marker id="install-01-inspect-ah-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--danger,#B42318)"/></marker></defs><rect x="0" y="0" width="600" height="320" style="fill:var(--surface,#FFFFFF)"/><rect x="20" y="40" width="140" height="110" rx="10" style="fill:var(--sunk,#E2E7EC);stroke:var(--rule,#C9D1DA);stroke-width:1.5"/><path d="M60 70 L90 58 L120 70 L120 108 L90 120 L60 108 Z" style="fill:var(--accent-soft,#DCE7F5);stroke:var(--ink,#131C26);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"/><path d="M60 70 L90 82 L120 70 M90 82 V120" style="fill:none;stroke:var(--ink,#131C26);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"/><text x="90" y="138" style="fill:var(--ink,#131C26);font-size:13px;font-weight:600" text-anchor="middle">开箱核对配件</text><text x="20" y="178" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="start">装箱单（以实物为准）</text><text x="28" y="200" style="fill:var(--ink,#131C26);font-size:12.5px;font-weight:400" text-anchor="start">· Reference 620 主机</text><text x="28" y="220" style="fill:var(--ink,#131C26);font-size:12.5px;font-weight:400" text-anchor="start">· 电源适配器 + 电源线</text><text x="28" y="240" style="fill:var(--ink,#131C26);font-size:12.5px;font-weight:400" text-anchor="start">· USB 线</text><text x="28" y="260" style="fill:var(--ink,#131C26);font-size:12.5px;font-weight:400" text-anchor="start">· 电解池电缆</text><text x="28" y="280" style="fill:var(--ink,#131C26);font-size:12.5px;font-weight:400" text-anchor="start">· 校准池 + 校准屏蔽盒</text><path d="M160 95 H218" style="fill:none;stroke:var(--ink,#131C26);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-01-inspect-ah-ink)"/><polygon points="222,95 300,45 378,95 300,145" style="fill:var(--accent-soft,#DCE7F5);stroke:var(--accent,#1E5BA8);stroke-width:1.5"/><text x="300" y="91" style="fill:var(--ink,#131C26);font-size:13px;font-weight:600" text-anchor="middle">外观或接口</text><text x="300" y="110" style="fill:var(--ink,#131C26);font-size:13px;font-weight:600" text-anchor="middle">有损坏？</text><path d="M378 95 H436" style="fill:none;stroke:var(--ink,#131C26);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-01-inspect-ah-ink)"/><text x="407" y="86" style="fill:var(--ok,#2B7346);font-size:12.5px;font-weight:700" text-anchor="middle">否</text><rect x="440" y="45" width="140" height="100" rx="10" style="fill:var(--sunk,#E2E7EC);stroke:var(--rule,#C9D1DA);stroke-width:1.5"/><text x="510" y="74" style="fill:var(--ink,#131C26);font-size:13px;font-weight:600" text-anchor="middle">室温回温</text><text x="510" y="103" style="fill:var(--accent,#1E5BA8);font-size:20px;font-weight:700" text-anchor="middle">≥ 1 小时</text><text x="510" y="128" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="middle">防止内部凝露</text><path d="M510 145 V192" style="fill:none;stroke:var(--ink,#131C26);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-01-inspect-ah-ink)"/><text x="518" y="173" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="start">回温后</text><rect x="440" y="196" width="140" height="64" rx="10" style="fill:var(--ok-soft,#DDEFE3);stroke:var(--ok,#2B7346);stroke-width:1.5"/><text x="510" y="222" style="fill:var(--ok,#2B7346);font-size:13px;font-weight:700" text-anchor="middle">可以开始安装</text><text x="510" y="243" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="middle">下一步：摆放</text><path d="M300 145 V192" style="fill:none;stroke:var(--danger,#B42318);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-01-inspect-ah-danger)"/><text x="308" y="174" style="fill:var(--danger,#B42318);font-size:12.5px;font-weight:700" text-anchor="start">是</text><rect x="210" y="196" width="180" height="108" rx="10" style="fill:var(--danger-soft,#F8E1DE);stroke:var(--danger,#B42318);stroke-width:1.5"/><text x="300" y="222" style="fill:var(--danger,#B42318);font-size:15px;font-weight:700" text-anchor="middle">不要上电</text><text x="300" y="245" style="fill:var(--ink,#131C26);font-size:12.5px;font-weight:400" text-anchor="middle">贴上“安全隐患”标签</text><text x="300" y="265" style="fill:var(--ink,#131C26);font-size:12.5px;font-weight:400" text-anchor="middle">联系 Gamry</text><text x="300" y="289" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="middle">加强绝缘可能已失效</text></svg>
