<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="ZRA: the instrument holds 0 V between the blue and orange leads so both metals sit at the same potential, and measures the galvanic current Ig between them; the white lead goes to a reference electrode." style="font-family:var(--f-body,'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif)"><title>ZRA: the instrument holds 0 V between the blue and orange leads so both metals sit at the same potential, and measures the galvanic current Ig between them; the white lead goes to a reference electrode.</title><defs><marker id="use-03-zra-ah-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--warn,#965800)"/></marker></defs><rect x="0" y="0" width="600" height="340" style="fill:var(--surface,#FFFFFF)"/><rect x="20" y="40" width="200" height="206" rx="8" style="fill:none;stroke:var(--muted,#56616E);stroke-width:1.5;stroke-dasharray:6 5"/><text x="32" y="60" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="start">Reference 620 (ZRA mode)</text><rect x="36" y="74" width="168" height="110" rx="6" style="fill:var(--accent-soft,#DCE7F5);stroke:var(--accent,#1E5BA8);stroke-width:1.5"/><text x="120" y="100" style="fill:var(--ink,#131C26);font-size:12px;font-weight:700" text-anchor="middle">Zero resistance ammeter</text><text x="120" y="122" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:400" text-anchor="middle">Zsig = orange − blue</text><text x="120" y="144" style="fill:var(--accent,#1E5BA8);font-size:13px;font-weight:700" text-anchor="middle">held at 0 V</text><text x="120" y="168" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:400" text-anchor="middle">measures current I<tspan dy="3" style="font-size:9px">g</tspan></text><rect x="36" y="198" width="168" height="34" rx="6" style="fill:var(--sunk,#E2E7EC);stroke:var(--ink,#131C26);stroke-width:1.2"/><text x="120" y="220" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:400" text-anchor="middle">Electrometer: RE vs blue</text><rect x="332" y="150" width="246" height="128" rx="0" style="fill:var(--solution,#D4E6F2)"/><path d="M330 104 V268 Q330 280 342 280 H568 Q580 280 580 268 V104" style="fill:none;stroke:var(--muted,#56616E);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><rect x="372" y="84" width="16" height="150" rx="2" style="fill:var(--electrode,#8C96A1)"/><rect x="445" y="84" width="10" height="140" rx="2" style="fill:var(--electrode,#8C96A1)"/><rect x="512" y="84" width="16" height="150" rx="2" style="fill:var(--electrode,#8C96A1)"/><path d="M204 92 C 290 92, 376 44, 376 84" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round"/><path d="M204 92 C 290 92, 376 44, 376 84" style="fill:none;stroke:var(--lead-we,#2E9A55);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/><path d="M204 110 C 300 110, 384 50, 384 84" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round"/><path d="M204 110 C 300 110, 384 50, 384 84" style="fill:none;stroke:var(--lead-ws,#2F6FD6);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/><path d="M204 215 C 320 215, 450 36, 450 84" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round"/><path d="M204 215 C 320 215, 450 36, 450 84" style="fill:none;stroke:var(--lead-re,#F4F4F0);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/><path d="M204 140 C 320 140, 516 24, 516 84" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round"/><path d="M204 140 C 320 140, 516 24, 516 84" style="fill:none;stroke:var(--lead-ce,#D3342C);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/><path d="M204 160 C 330 160, 524 14, 524 84" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round"/><path d="M204 160 C 330 160, 524 14, 524 84" style="fill:none;stroke:var(--lead-cs,#EE7B1A);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/><path d="M392 200 H508" style="fill:none;stroke:var(--warn,#965800);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#use-03-zra-ah-warn)" marker-start="url(#use-03-zra-ah-warn)"/><text x="380" y="258" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:700" text-anchor="middle">Metal 1</text><text x="450" y="258" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:700" text-anchor="middle">Ref.</text><text x="520" y="258" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:700" text-anchor="middle">Metal 2</text><text x="455" y="302" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="middle">I<tspan dy="3" style="font-size:9px">g</tspan><tspan dy="-3">: measured in unit; ionic in solution</tspan></text><text x="32" y="270" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:400" text-anchor="start">Green + blue → metal 1</text><text x="32" y="288" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:400" text-anchor="start">Red + orange → metal 2 (orange required)</text><text x="32" y="306" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:400" text-anchor="start">White → reference electrode</text><text x="32" y="330" style="fill:var(--accent,#1E5BA8);font-size:11.5px;font-weight:600" text-anchor="start">No reference electrode: white to metal 1; reading ≈ 0.</text></svg>
