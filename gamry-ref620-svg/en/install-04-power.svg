FFFFFF);font-size:9.2px;font-weight:700" text-anchor="middle">11</text><text x="442" y="168" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:700" text-anchor="start">Power In (22–26 V DC)</text><circle cx="428" cy="188" r="8" style="fill:var(--ok,#2B7346)"/><text x="428" y="191.36" style="fill:var(--accent-ink,#FFFFFF);font-size:9.2px;font-weight:700" text-anchor="middle">12</text><text x="442" y="192" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:700" text-anchor="start">Power switch</text><text x="240" y="226" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="start">BNC shells 4–8 are at floating ground;</text><text x="240" y="242" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="start">earthed gear (e.g. a scope) defeats floating.</text><text x="435" y="284" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">Input 100–240 VAC · 47–63 Hz</text><rect x="380" y="296" width="110" height="60" rx="8" style="fill:var(--panel,#2A3139);stroke:var(--panel-edge,#151A1F);stroke-width:1.5"/><text x="435" y="321" style="fill:var(--panel-ink,#E7ECF1);font-size:12px;font-weight:700" text-anchor="middle">Power adapter</text><text x="435" y="340" style="fill:var(--panel-ink,#E7ECF1);font-size:11px;font-weight:400" text-anchor="middle">Output 24 V DC</text><rect x="536" y="298" width="44" height="52" rx="6" style="fill:var(--sunk,#E2E7EC);stroke:var(--rule,#C9D1DA);stroke-width:1.5"/><rect x="548" y="314" width="5" height="14" rx="1" style="fill:var(--ink,#131C26)"/><rect x="563" y="314" width="5" height="14" rx="1" style="fill:var(--ink,#131C26)"/><text x="558" y="368" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">Outlet</text><path d="M536 324 H490" style="fill:none;stroke:var(--ink,#131C26);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/><text x="513" y="316" style="fill:var(--muted,#56616E);font-size:10.5px;font-weight:400" text-anchor="middle">Cord</text><text x="513" y="342" style="fill:var(--muted,#56616E);font-size:10.5px;font-weight:400" text-anchor="middle">IEC C13</text><path d="M380 326 C 300 326, 250 252, 188 252" style="fill:none;stroke:var(--ink,#131C26);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/><text x="318" y="336" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">24 V DC</text><text x="20" y="390" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:400" text-anchor="start">Order: adapter → Power In, cord → outlet, then switch on. No USB or cell cable yet.</text><text x="20" y="410" style="fill:var(--danger,#B42318);font-size:11.5px;font-weight:700" text-anchor="start">Supplied adapter only; &lt; 20 V or &gt; 32 V input damages the supply.</text></svg>
