<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 404" width="600" height="404" role="img" aria-label="Grounding: with an earthed sample, a floating instrument has no loop; earthing the chassis too closes a loop through earth, so the cell discharges through the instrument and the cable fuse blows. Auxiliary equipment can also earth the instrument." style="font-family:var(--f-body,'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif)"><title>Grounding: with an earthed sample, a floating instrument has no loop; earthing the chassis too closes a loop through earth, so the cell discharges through the instrument and the cable fuse blows. Auxiliary equipment can also earth the instrument.</title><defs><marker id="hazard-grounding-ah-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--danger,#B42318)"/></marker></defs><rect x="0" y="0" width="600" height="404" style="fill:var(--surface,#FFFFFF)"/><rect x="10" y="18" width="285" height="302" rx="10" style="fill:none;stroke:var(--rule,#C9D1DA);stroke-width:1.2"/><circle cx="34" cy="44" r="9" style="fill:var(--ok,#2B7346)"/><path d="M30 44 L33 47.5 L38.5 40.5" style="fill:none;stroke:var(--surface,#FFFFFF);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"/><text x="50" y="49" style="fill:var(--ok,#2B7346);font-size:14px;font-weight:700" text-anchor="start">Instrument floating</text><rect x="30" y="96" width="90" height="64" rx="6" style="fill:var(--panel,#2A3139);stroke:var(--panel-edge,#151A1F);stroke-width:1.5"/><text x="75" y="133" style="fill:var(--panel-ink,#E7ECF1);font-size:13px;font-weight:700" text-anchor="middle">R620</text><rect x="170" y="80" width="104" height="112" rx="10" style="fill:var(--sunk,#E2E7EC);stroke:var(--ink,#131C26);stroke-width:1.5"/><text x="222" y="118" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="middle">Autoclave</text><text x="222" y="138" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">metal body</text><text x="222" y="156" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">sample on body</text><path d="M120 128 H170" style="fill:none;stroke:var(--ink,#131C26);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/><text x="145" y="120" style="fill:var(--muted,#56616E);font-size:10.5px;font-weight:400" text-anchor="middle">lead</text><path d="M222 192 V230" style="fill:none;stroke:var(--ink,#131C26);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><path d="M208 230 H236 M213 236 H231 M218 242 H226" style="fill:none;stroke:var(--ink,#131C26);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><text x="242" y="242" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="start">earth</text><path d="M75 160 V204" style="fill:none;stroke:var(--muted,#56616E);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 4"/><text x="75" y="222" style="fill:var(--ok,#2B7346);font-size:11.5px;font-weight:700" text-anchor="middle">Chassis not earthed</text><rect x="24" y="262" width="257" height="46" rx="8" style="fill:var(--ok-soft,#DDEFE3);stroke:var(--ok,#2B7346);stroke-width:1.5"/><text x="152" y="282" style="fill:var(--ok,#2B7346);font-size:12.5px;font-weight:700" text-anchor="middle">No closed loop</text><text x="152" y="300" style="fill:var(--ink,#131C26);font-size:11px;font-weight:400" text-anchor="middle">This is what floating operation is for</text><rect x="305" y="18" width="285" height="302" rx="10" style="fill:none;stroke:var(--rule,#C9D1DA);stroke-width:1.2"/><circle cx="329" cy="44" r="9" style="fill:var(--danger,#B42318)"/><path d="M325.5 40.5 L332.5 47.5 M332.5 40.5 L325.5 47.5" style="fill:none;stroke:var(--surface,#FFFFFF);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"/><text x="345" y="49" style="fill:var(--danger,#B42318);font-size:14px;font-weight:700" text-anchor="start">Chassis also earthed</text><rect x="325" y="96" width="90" height="64" rx="6" style="fill:var(--panel,#2A3139);stroke:var(--panel-edge,#151A1F);stroke-width:1.5"/><text x="370" y="133" style="fill:var(--panel-ink,#E7ECF1);font-size:13px;font-weight:700" text-anchor="middle">R620</text><rect x="465" y="80" width="104" height="112" rx="10" style="fill:var(--sunk,#E2E7EC);stroke:var(--ink,#131C26);stroke-width:1.5"/><text x="517" y="118" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="middle">Autoclave</text><text x="517" y="138" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">metal body</text><text x="517" y="156" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">sample on body</text><path d="M415 128 H463" style="fill:none;stroke:var(--danger,#B42318);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#hazard-grounding-ah-danger)"/><text x="440" y="120" style="fill:var(--muted,#56616E);font-size:10.5px;font-weight:400" text-anchor="middle">lead</text><path d="M517 192 V230" style="fill:none;stroke:var(--danger,#B42318);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><path d="M503 230 H531 M508 236 H526 M513 242 H521" style="fill:none;stroke:var(--danger,#B42318);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><text x="537" y="242" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="start">earth</text><path d="M370 160 V230" style="fill:none;stroke:var(--danger,#B42318);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><path d="M356 230 H384 M361 236 H379 M366 242 H374" style="fill:none;stroke:var(--danger,#B42318);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><text x="378" y="200" style="fill:var(--danger,#B42318);font-size:10px;font-weight:400" text-anchor="start">Chassis Ground</text><path d="M370 252 H517" style="fill:none;stroke:var(--danger,#B42318);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 4"/><text x="443" y="247" style="fill:var(--danger,#B42318);font-size:11px;font-weight:700" text-anchor="middle">via earth</text><rect x="319" y="262" width="257" height="46" rx="8" style="fill:var(--danger-soft,#F8E1DE);stroke:var(--danger,#B42318);stroke-width:1.5"/><text x="447" y="282" style="fill:var(--danger,#B42318);font-size:12.5px;font-weight:700" text-anchor="middle">Low-impedance loop</text><text x="447" y="300" style="fill:var(--ink,#131C26);font-size:11px;font-weight:400" text-anchor="middle">Cell discharges through it; fuse blows</text><text x="10" y="342" style="fill:var(--ink,#131C26);font-size:12px;font-weight:700" text-anchor="start">These connections can also earth the instrument:</text><rect x="10" y="354" width="186" height="34" rx="8" style="fill:var(--warn-soft,#F6EAD3);stroke:var(--warn,#965800);stroke-width:1"/><text x="103.0" y="376" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:600" text-anchor="middle">Monitor BNC to a scope</text><rect x="206" y="354" width="190" height="34" rx="8" style="fill:var(--warn-soft,#F6EAD3);stroke:var(--warn,#965800);stroke-width:1"/><text x="301.0" y="376" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:600" text-anchor="middle">Standard Misc I/O cable</text><rect x="406" y="354" width="184" height="34" rx="8" style="fill:var(--warn-soft,#F6EAD3);stroke:var(--warn,#965800);stroke-width:1"/><text x="498.0" y="376" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:600" text-anchor="middle">Bare thermocouple in cell</text></svg>
