<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 286" width="600" height="286" role="img" aria-label="Software: check the PC (64-bit Windows 10 or later), install Gamry software from the Client Portal and reboot, then connect the instrument." style="font-family:var(--f-body,'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif)"><title>Software: check the PC (64-bit Windows 10 or later), install Gamry software from the Client Portal and reboot, then connect the instrument.</title><defs><marker id="install-03-software-ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--ink,#131C26)"/></marker><marker id="install-03-software-ah-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--danger,#B42318)"/></marker></defs><rect x="0" y="0" width="600" height="286" style="fill:var(--surface,#FFFFFF)"/><circle cx="28" cy="30" r="9" style="fill:var(--ok,#2B7346)"/><path d="M24 30 L27 33.5 L32.5 26.5" style="fill:none;stroke:var(--surface,#FFFFFF);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"/><text x="44" y="35" style="fill:var(--ok,#2B7346);font-size:13px;font-weight:700" text-anchor="start">Correct order</text><rect x="20" y="52" width="110" height="108" rx="8" style="fill:var(--sunk,#E2E7EC);stroke:var(--rule,#C9D1DA);stroke-width:1.5"/><path d="M130 106 H166" style="fill:none;stroke:var(--ink,#131C26);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-03-software-ah-ink)"/><rect x="170" y="52" width="110" height="108" rx="8" style="fill:var(--sunk,#E2E7EC);stroke:var(--rule,#C9D1DA);stroke-width:1.5"/><path d="M280 106 H316" style="fill:none;stroke:var(--ink,#131C26);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-03-software-ah-ink)"/><rect x="320" y="52" width="110" height="108" rx="8" style="fill:var(--sunk,#E2E7EC);stroke:var(--rule,#C9D1DA);stroke-width:1.5"/><path d="M430 106 H466" style="fill:none;stroke:var(--ink,#131C26);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-03-software-ah-ink)"/><rect x="470" y="52" width="110" height="108" rx="8" style="fill:var(--ok-soft,#DDEFE3);stroke:var(--ok,#2B7346);stroke-width:1.5"/><circle cx="24" cy="56" r="10" style="fill:var(--accent,#1E5BA8)"/><text x="24" y="60.2" style="fill:var(--accent-ink,#FFFFFF);font-size:11.5px;font-weight:700" text-anchor="middle">1</text><circle cx="174" cy="56" r="10" style="fill:var(--accent,#1E5BA8)"/><text x="174" y="60.2" style="fill:var(--accent-ink,#FFFFFF);font-size:11.5px;font-weight:700" text-anchor="middle">2</text><circle cx="324" cy="56" r="10" style="fill:var(--accent,#1E5BA8)"/><text x="324" y="60.2" style="fill:var(--accent-ink,#FFFFFF);font-size:11.5px;font-weight:700" text-anchor="middle">3</text><circle cx="474" cy="56" r="10" style="fill:var(--accent,#1E5BA8)"/><text x="474" y="60.2" style="fill:var(--accent-ink,#FFFFFF);font-size:11.5px;font-weight:700" text-anchor="middle">4</text><text x="75" y="84" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="middle">Check PC</text><text x="75" y="106" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">Windows 10+</text><text x="75" y="124" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">64-bit only · x86</text><text x="75" y="142" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">USB 2.0 / 1.1</text><text x="225" y="84" style="fill:var(--ink,#131C26);font-size:12px;font-weight:700" text-anchor="middle">Install software</text><text x="225" y="106" style="fill:var(--accent,#1E5BA8);font-size:11px;font-weight:400;font-family:var(--f-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)" text-anchor="middle">Client Portal</text><text x="225" y="124" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">Register, download</text><text x="225" y="142" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400;font-family:var(--f-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)" text-anchor="middle">.exe or .iso</text><text x="375" y="84" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="middle">Reboot PC</text><text x="375" y="106" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">Drivers may load</text><text x="375" y="124" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">≥ 1 min after the</text><text x="375" y="142" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">desktop appears</text><text x="525" y="84" style="fill:var(--ok,#2B7346);font-size:13px;font-weight:700" text-anchor="middle">Connect unit</text><text x="525" y="106" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">Plug &amp; Play</text><text x="525" y="124" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400;font-family:var(--f-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)" text-anchor="middle">Framework</text><text x="525" y="142" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">7.9 or later</text><circle cx="28" cy="200" r="9" style="fill:var(--danger,#B42318)"/><path d="M24.5 196.5 L31.5 203.5 M31.5 196.5 L24.5 203.5" style="fill:none;stroke:var(--surface,#FFFFFF);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"/><text x="44" y="205" style="fill:var(--danger,#B42318);font-size:13px;font-weight:700" text-anchor="start">Wrong order</text><rect x="20" y="220" width="170" height="50" rx="8" style="fill:var(--sunk,#E2E7EC);stroke:var(--rule,#C9D1DA);stroke-width:1.5"/><text x="105" y="250" style="fill:var(--ink,#131C26);font-size:12.5px;font-weight:600" text-anchor="middle">Hardware before software</text><path d="M190 245 H226" style="fill:none;stroke:var(--danger,#B42318);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-03-software-ah-danger)"/><rect x="230" y="220" width="350" height="50" rx="8" style="fill:var(--danger-soft,#F8E1DE);stroke:var(--danger,#B42318);stroke-width:1.5"/><text x="405" y="242" style="fill:var(--danger,#B42318);font-size:12.5px;font-weight:700" text-anchor="middle">Windows may not recognize the instrument</text><text x="405" y="260" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="middle">Manual: install Plug &amp; Play software first</text></svg>
