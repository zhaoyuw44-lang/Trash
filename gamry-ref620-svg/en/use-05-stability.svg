<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-label="Oscillation fixes: slow the control amplifier and raise I/E stability first; then try a fast combination reference, a capacitor between the red and white leads, or a resistor in the counter lead." style="font-family:var(--f-body,'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif)"><title>Oscillation fixes: slow the control amplifier and raise I/E stability first; then try a fast combination reference, a capacitor between the red and white leads, or a resistor in the counter lead.</title><rect x="0" y="0" width="600" height="330" style="fill:var(--surface,#FFFFFF)"/><text x="20" y="24" style="fill:var(--muted,#56616E);font-size:10.5px;font-weight:400" text-anchor="start">First slow the control amp and raise I/E stability; still oscillating? Try these (manual Ch. 8).</text><rect x="10" y="38" width="186" height="252" rx="10" style="fill:none;stroke:var(--rule,#C9D1DA);stroke-width:1.2"/><text x="103" y="60" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="middle">Fast combo reference</text><rect x="32" y="160" width="142" height="50" rx="4" style="fill:var(--solution,#D4E6F2)"/><rect x="207" y="38" width="186" height="252" rx="10" style="fill:none;stroke:var(--rule,#C9D1DA);stroke-width:1.2"/><text x="300" y="60" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="middle">HF shunt capacitor</text><rect x="229" y="160" width="142" height="50" rx="4" style="fill:var(--solution,#D4E6F2)"/><rect x="404" y="38" width="186" height="252" rx="10" style="fill:none;stroke:var(--rule,#C9D1DA);stroke-width:1.2"/><text x="497" y="60" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="middle">Resistor in CE lead</text><rect x="426" y="160" width="142" height="50" rx="4" style="fill:var(--solution,#D4E6F2)"/><path d="M30 86 H102" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:5.1;stroke-linecap:round;stroke-linejoin:round"/><path d="M30 86 H102" style="fill:none;stroke:var(--lead-re,#F4F4F0);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"/><path d="M102 86 H80 V120" style="fill:none;stroke:var(--ink,#131C26);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><rect x="72" y="120" width="16" height="80" rx="4" style="fill:var(--sunk,#E2E7EC);stroke:var(--ink,#131C26);stroke-width:1.2"/><text x="80" y="222" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:700" text-anchor="middle">SCE</text><path d="M102 86 H121.0 M127.0 86 H146" style="fill:none;stroke:var(--ink,#131C26);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><path d="M121.0 77 V95 M127.0 77 V95" style="fill:none;stroke:var(--ink,#131C26);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"/><path d="M146 86 V120" style="fill:none;stroke:var(--ink,#131C26);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><path d="M146 120 V200" style="fill:none;stroke:var(--electrode,#8C96A1);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round"/><text x="146" y="222" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:700" text-anchor="middle">Pt wire</text><text x="124" y="72" style="fill:var(--accent,#1E5BA8);font-size:10px;font-weight:700" text-anchor="middle">100 pF–10 nF</text><text x="24" y="246" style="fill:var(--ink,#131C26);font-size:11px;font-weight:400" text-anchor="start">DC potential from SCE,</text><text x="24" y="262" style="fill:var(--ink,#131C26);font-size:11px;font-weight:400" text-anchor="start">AC feedback from Pt wire</text><path d="M257 74 V150" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:5.1;stroke-linecap:round;stroke-linejoin:round"/><path d="M257 74 V150" style="fill:none;stroke:var(--lead-we,#2E9A55);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"/><rect x="253" y="150" width="8" height="50" rx="2" style="fill:var(--electrode,#8C96A1)"/><text x="257" y="222" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:700" text-anchor="middle">WE</text><path d="M307 74 V150" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:5.1;stroke-linecap:round;stroke-linejoin:round"/><path d="M307 74 V150" style="fill:none;stroke:var(--lead-re,#F4F4F0);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"/><rect x="303" y="150" width="8" height="50" rx="2" style="fill:var(--electrode,#8C96A1)"/><text x="307" y="222" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:700" text-anchor="middle">RE</text><path d="M357 74 V150" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:5.1;stroke-linecap:round;stroke-linejoin:round"/><path d="M357 74 V150" style="fill:none;stroke:var(--lead-ce,#D3342C);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"/><rect x="353" y="150" width="8" height="50" rx="2" style="fill:var(--electrode,#8C96A1)"/><text x="357" y="222" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:700" text-anchor="middle">CE</text><path d="M307 104 H329.0 M335.0 104 H357" style="fill:none;stroke:var(--ink,#131C26);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><path d="M329.0 95 V113 M335.0 95 V113" style="fill:none;stroke:var(--ink,#131C26);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"/><text x="332" y="92" style="fill:var(--accent,#1E5BA8);font-size:9.5px;font-weight:700" text-anchor="middle">try 1 nF</text><text x="221" y="246" style="fill:var(--ink,#131C26);font-size:11px;font-weight:400" text-anchor="start">Capacitor red–white,</text><text x="221" y="262" style="fill:var(--ink,#131C26);font-size:11px;font-weight:400" text-anchor="start">100 pF–10 nF</text><path d="M454 74 V150" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:5.1;stroke-linecap:round;stroke-linejoin:round"/><path d="M454 74 V150" style="fill:none;stroke:var(--lead-we,#2E9A55);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"/><rect x="450" y="150" width="8" height="50" rx="2" style="fill:var(--electrode,#8C96A1)"/><text x="454" y="222" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:700" text-anchor="middle">WE</text><path d="M504 74 V150" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:5.1;stroke-linecap:round;stroke-linejoin:round"/><path d="M504 74 V150" style="fill:none;stroke:var(--lead-re,#F4F4F0);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"/><rect x="500" y="150" width="8" height="50" rx="2" style="fill:var(--electrode,#8C96A1)"/><text x="504" y="222" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:700" text-anchor="middle">RE</text><path d="M554 74 V90" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:5.1;stroke-linecap:round;stroke-linejoin:round"/><path d="M554 74 V90" style="fill:none;stroke:var(--lead-ce,#D3342C);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"/><rect x="547" y="90" width="14" height="36" rx="2" style="fill:var(--surface,#FFFFFF);stroke:var(--ink,#131C26);stroke-width:1.6"/><path d="M554 126 V150" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:5.1;stroke-linecap:round;stroke-linejoin:round"/><path d="M554 126 V150" style="fill:none;stroke:var(--lead-ce,#D3342C);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"/><rect x="550" y="150" width="8" height="50" rx="2" style="fill:var(--electrode,#8C96A1)"/><text x="554" y="222" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:700" text-anchor="middle">CE</text><text x="568" y="112" style="fill:var(--accent,#1E5BA8);font-size:12px;font-weight:700" text-anchor="start">R</text><text x="418" y="246" style="fill:var(--ink,#131C26);font-size:11px;font-weight:400" text-anchor="start">R ≈ 1 V ÷ max current</text><text x="418" y="262" style="fill:var(--ink,#131C26);font-size:11px;font-weight:400" text-anchor="start">e.g. 1 mA → 1 kΩ</text><text x="418" y="278" style="fill:var(--ink,#131C26);font-size:11px;font-weight:400" text-anchor="start">Slows fast CV and EIS</text><text x="20" y="314" style="fill:var(--muted,#56616E);font-size:10.5px;font-weight:400" text-anchor="start">Reference impedance &gt; 20 kΩ invites oscillation; avoid narrow/Vycor Luggins, double junctions.</text></svg>
