<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 364" width="600" height="364" role="img" aria-label="Low current: a continuous Faraday shield encloses the cell and connects to the black floating-ground lead; with an isolated cell the shield and floating ground may also be earthed; keep cables short and leads apart." style="font-family:var(--f-body,'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif)"><title>Low current: a continuous Faraday shield encloses the cell and connects to the black floating-ground lead; with an isolated cell the shield and floating ground may also be earthed; keep cables short and leads apart.</title><rect x="0" y="0" width="600" height="364" style="fill:var(--surface,#FFFFFF)"/><rect x="20" y="128" width="70" height="70" rx="6" style="fill:var(--panel,#2A3139);stroke:var(--panel-edge,#151A1F);stroke-width:1.5"/><text x="55" y="167" style="fill:var(--panel-ink,#E7ECF1);font-size:12.5px;font-weight:700" text-anchor="middle">R620</text><path d="M90 163 H150" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:7;stroke-linecap:round;stroke-linejoin:round"/><text x="120" y="150" style="fill:var(--muted,#56616E);font-size:10px;font-weight:400" text-anchor="middle">cable ≤ 1 m</text><rect x="150" y="40" width="250" height="250" rx="6" style="fill:none;stroke:var(--cage,#7F8B97);stroke-width:3"/><rect x="146" y="150" width="8" height="26" rx="0" style="fill:var(--surface,#FFFFFF)"/><text x="162" y="60" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="start">Faraday shield: continuous, all sides</text><rect x="222" y="150" width="126" height="116" rx="0" style="fill:var(--solution,#D4E6F2)"/><path d="M220 120 V258 Q220 270 232 270 H338 Q350 270 350 258 V120" style="fill:none;stroke:var(--muted,#56616E);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><rect x="246" y="96" width="8" height="144" rx="2" style="fill:var(--electrode,#8C96A1)"/><text x="250" y="258" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:700" text-anchor="middle">WE</text><rect x="286" y="96" width="8" height="144" rx="2" style="fill:var(--electrode,#8C96A1)"/><text x="290" y="258" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:700" text-anchor="middle">RE</text><rect x="326" y="96" width="8" height="144" rx="2" style="fill:var(--electrode,#8C96A1)"/><text x="330" y="258" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:700" text-anchor="middle">CE</text><path d="M152 158 C 196 158, 246 112, 246 96" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:5.1;stroke-linecap:round;stroke-linejoin:round"/><path d="M152 158 C 196 158, 246 112, 246 96" style="fill:none;stroke:var(--lead-we,#2E9A55);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"/><path d="M152 162 C 200 162, 254 116, 254 96" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:5.1;stroke-linecap:round;stroke-linejoin:round"/><path d="M152 162 C 200 162, 254 116, 254 96" style="fill:none;stroke:var(--lead-ws,#2F6FD6);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"/><path d="M152 166 C 210 166, 290 92, 290 96" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:5.1;stroke-linecap:round;stroke-linejoin:round"/><path d="M152 166 C 210 166, 290 92, 290 96" style="fill:none;stroke:var(--lead-re,#F4F4F0);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"/><path d="M152 170 C 230 170, 328 80, 328 96" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:5.1;stroke-linecap:round;stroke-linejoin:round"/><path d="M152 170 C 230 170, 328 80, 328 96" style="fill:none;stroke:var(--lead-ce,#D3342C);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"/><path d="M152 174 C 160 230, 166 280, 176 280" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:5.1;stroke-linecap:round;stroke-linejoin:round"/><path d="M152 174 C 160 230, 166 280, 176 280" style="fill:none;stroke:var(--lead-gnd,#1D1F22);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"/><circle cx="180" cy="280" r="5" style="fill:var(--sunk,#E2E7EC);stroke:var(--ink,#131C26);stroke-width:2"/><text x="190" y="284" style="fill:var(--ink,#131C26);font-size:11px;font-weight:600" text-anchor="start">Black lead to shield</text><path d="M400 290 V312" style="fill:none;stroke:var(--warn,#965800);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 4"/><path d="M386 314 H414 M391 320 H409 M396 326 H404" style="fill:none;stroke:var(--warn,#965800);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><text x="390" y="342" style="fill:var(--warn,#965800);font-size:11px;font-weight:700" text-anchor="end">Optional: shield + float. ground to earth</text><text x="390" y="358" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="end">only if the cell is isolated (e.g. glass)</text><text x="420" y="58" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="start">Low-current tips</text><text x="420" y="84" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:400" text-anchor="start">· Shield fully encloses cell</text><text x="420" y="106" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:400" text-anchor="start">· Separate WE/WS, CE/RE</text><text x="420" y="128" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:400" text-anchor="start">· Do not move leads</text><text x="420" y="150" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:400" text-anchor="start">· Away from lamps, motors,</text><text x="430" y="172" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:400" text-anchor="start">radios, monitors</text><text x="420" y="194" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:400" text-anchor="start">· Low-impedance reference</text><text x="420" y="216" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:400" text-anchor="start">· Low I DC calibration first</text><text x="420" y="238" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:400" text-anchor="start">· EIS: |Z|·f &lt; 10<tspan dy="-4" style="font-size:8px">9</tspan><tspan dy="4"> Ω·Hz</tspan></text></svg>
