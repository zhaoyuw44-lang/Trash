<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 322" width="600" height="322" role="img" aria-label="Self-test: the Power LED lights 1–2 s, flashes three times, then stays on. On-then-off or a two-part code means a fault; Blink in GIM makes it blink five times." style="font-family:var(--f-body,'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif)"><title>Self-test: the Power LED lights 1–2 s, flashes three times, then stays on. On-then-off or a two-part code means a fault; Blink in GIM makes it blink five times.</title><defs><marker id="install-05-selftest-ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--ink,#131C26)"/></marker></defs><rect x="0" y="0" width="600" height="322" style="fill:var(--surface,#FFFFFF)"/><path d="M150 30 V262" style="fill:none;stroke:var(--muted,#56616E);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 4"/><text x="20" y="60" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="start">Power LED</text><text x="20" y="77" style="fill:var(--ok,#2B7346);font-size:11.5px;font-weight:600" text-anchor="start">Normal</text><path d="M150 72 H570" style="fill:none;stroke:var(--rule,#C9D1DA);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"/><text x="20" y="120" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="start">Power LED</text><text x="20" y="137" style="fill:var(--danger,#B42318);font-size:11.5px;font-weight:600" text-anchor="start">Not working</text><path d="M150 132 H570" style="fill:none;stroke:var(--rule,#C9D1DA);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"/><text x="20" y="180" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="start">Power LED</text><text x="20" y="197" style="fill:var(--danger,#B42318);font-size:11.5px;font-weight:600" text-anchor="start">Fault code</text><path d="M150 192 H570" style="fill:none;stroke:var(--rule,#C9D1DA);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"/><text x="20" y="240" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="start">Power LED</text><text x="20" y="257" style="fill:var(--accent,#1E5BA8);font-size:11.5px;font-weight:600" text-anchor="start">Blink in GIM</text><path d="M150 252 H570" style="fill:none;stroke:var(--rule,#C9D1DA);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"/><rect x="150" y="48" width="80" height="24" rx="2" style="fill:#3C8CFF"/><rect x="250" y="48" width="20" height="24" rx="2" style="fill:#3C8CFF"/><rect x="290" y="48" width="20" height="24" rx="2" style="fill:#3C8CFF"/><rect x="330" y="48" width="20" height="24" rx="2" style="fill:#3C8CFF"/><rect x="370" y="48" width="200" height="24" rx="2" style="fill:#3C8CFF"/><text x="190" y="41" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">~1–2 s on</text><text x="300" y="41" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">3 flashes</text><text x="470" y="41" style="fill:var(--ok,#2B7346);font-size:11.5px;font-weight:700" text-anchor="middle">Steady = self-test passed</text><rect x="150" y="108" width="80" height="24" rx="2" style="fill:#3C8CFF"/><text x="400" y="125" style="fill:var(--danger,#B42318);font-size:12px;font-weight:700" text-anchor="middle">On, then off for good → contact Gamry</text><rect x="150" y="168" width="80" height="24" rx="2" style="fill:#3C8CFF"/><rect x="246" y="168" width="12" height="24" rx="2" style="fill:#3C8CFF"/><rect x="270" y="168" width="12" height="24" rx="2" style="fill:#3C8CFF"/><rect x="306" y="168" width="12" height="24" rx="2" style="fill:#3C8CFF"/><rect x="330" y="168" width="12" height="24" rx="2" style="fill:#3C8CFF"/><rect x="354" y="168" width="12" height="24" rx="2" style="fill:#3C8CFF"/><text x="264" y="162" style="fill:var(--muted,#56616E);font-size:10px;font-weight:400" text-anchor="middle">2×</text><text x="336" y="162" style="fill:var(--muted,#56616E);font-size:10px;font-weight:400" text-anchor="middle">3×</text><text x="478" y="185" style="fill:var(--danger,#B42318);font-size:11.5px;font-weight:700" text-anchor="middle">Two-part code: module fault</text><rect x="150" y="228" width="100" height="24" rx="2" style="fill:#3C8CFF"/><rect x="262" y="228" width="12" height="24" rx="2" style="fill:#3C8CFF"/><rect x="286" y="228" width="12" height="24" rx="2" style="fill:#3C8CFF"/><rect x="310" y="228" width="12" height="24" rx="2" style="fill:#3C8CFF"/><rect x="334" y="228" width="12" height="24" rx="2" style="fill:#3C8CFF"/><rect x="358" y="228" width="12" height="24" rx="2" style="fill:#3C8CFF"/><rect x="382" y="228" width="28" height="24" rx="2" style="fill:#3C8CFF"/><text x="316" y="222" style="fill:var(--muted,#56616E);font-size:10px;font-weight:400" text-anchor="middle">5 blinks</text><text x="495" y="245" style="fill:var(--accent,#1E5BA8);font-size:11.5px;font-weight:600" text-anchor="middle">Blink in GIM: 5 blinks</text><path d="M150 272 H574" style="fill:none;stroke:var(--ink,#131C26);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-05-selftest-ah-ink)"/><text x="156" y="290" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:600" text-anchor="start">Power switch on</text><text x="574" y="290" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="end">Time</text><text x="20" y="312" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="start">Row 4 occurs in normal operation. Not to scale; blink codes: manual Appendix E.</text></svg>
