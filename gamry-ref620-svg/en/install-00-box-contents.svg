<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="600" height="430" role="img" aria-label="What goes where: the power adapter, USB cable and cell cable stay connected to the instrument; the 200 Ω Calibration Cell and Calibration Shield are used only for calibration, with the black ground lead earthing the chassis; afterwards the cell cable goes to your electrochemical cell and the calibration kit is stored." style="font-family:var(--f-body,'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif)"><title>What goes where: the power adapter, USB cable and cell cable stay connected to the instrument; the 200 Ω Calibration Cell and Calibration Shield are used only for calibration, with the black ground lead earthing the chassis; afterwards the cell cable goes to your electrochemical cell and the calibration kit is stored.</title><defs><marker id="install-00-box-contents-ah-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--accent,#1E5BA8)"/></marker><marker id="install-00-box-contents-ah-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--warn,#965800)"/></marker><marker id="install-00-box-contents-ah-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--ok,#2B7346)"/></marker></defs><rect x="0" y="0" width="600" height="430" style="fill:var(--surface,#FFFFFF)"/><path d="M20 30 H44" style="fill:none;stroke:var(--accent,#1E5BA8);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/><text x="52" y="34" style="fill:var(--ink,#131C26);font-size:11px;font-weight:400" text-anchor="start">Always connected</text><path d="M150 30 H174" style="fill:none;stroke:var(--warn,#965800);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 4"/><text x="182" y="34" style="fill:var(--ink,#131C26);font-size:11px;font-weight:400" text-anchor="start">Calibration only</text><path d="M290 30 H314" style="fill:none;stroke:var(--ok,#2B7346);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/><text x="322" y="34" style="fill:var(--ink,#131C26);font-size:11px;font-weight:400" text-anchor="start">Experiments</text><text x="225" y="102" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="start">Rear</text><text x="375" y="102" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="end">Front</text><rect x="225" y="110" width="150" height="170" rx="8" style="fill:var(--panel,#2A3139);stroke:var(--panel-edge,#151A1F);stroke-width:1.5"/><text x="300" y="196" style="fill:var(--panel-ink,#E7ECF1);font-size:13px;font-weight:700" text-anchor="middle">Reference 620</text><text x="300" y="214" style="fill:var(--panel-ink,#E7ECF1);font-size:11px;font-weight:400" text-anchor="middle">instrument</text><rect x="217" y="133" width="12" height="14" rx="2" style="fill:var(--sunk,#E2E7EC);stroke:var(--ink,#131C26);stroke-width:1"/><text x="235" y="144" style="fill:var(--panel-ink,#E7ECF1);font-size:9.5px;font-weight:400" text-anchor="start">Power In</text><rect x="217" y="174" width="12" height="12" rx="2" style="fill:var(--sunk,#E2E7EC);stroke:var(--ink,#131C26);stroke-width:1"/><text x="235" y="184" style="fill:var(--panel-ink,#E7ECF1);font-size:9.5px;font-weight:400" text-anchor="start">USB</text><circle cx="223" cy="222" r="5" style="fill:var(--sunk,#E2E7EC);stroke:var(--ink,#131C26);stroke-width:1.5"/><text x="235" y="226" style="fill:var(--panel-ink,#E7ECF1);font-size:9.5px;font-weight:400" text-anchor="start">Chassis Ground</text><rect x="217" y="249" width="12" height="16" rx="2" style="fill:var(--ok,#2B7346);stroke:var(--ink,#131C26);stroke-width:1"/><text x="235" y="261" style="fill:var(--panel-ink,#E7ECF1);font-size:9.5px;font-weight:400" text-anchor="start">Power switch</text><rect x="372" y="176" width="12" height="60" rx="3" style="fill:var(--ink,#131C26)"/><text x="366" y="160" style="fill:var(--panel-ink,#E7ECF1);font-size:9.5px;font-weight:400" text-anchor="end">Cell Cable</text><rect x="20" y="118" width="150" height="46" rx="8" style="fill:var(--surface,#FFFFFF);stroke:var(--accent,#1E5BA8);stroke-width:1.5"/><text x="30" y="136" style="fill:var(--ink,#131C26);font-size:12px;font-weight:700" text-anchor="start">Power adapter + cord</text><text x="30" y="153" style="fill:var(--muted,#56616E);font-size:10px;font-weight:400" text-anchor="start">cord to the wall outlet</text><path d="M170 140 H215" style="fill:none;stroke:var(--accent,#1E5BA8);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-00-box-contents-ah-accent)"/><rect x="20" y="174" width="150" height="40" rx="8" style="fill:var(--surface,#FFFFFF);stroke:var(--accent,#1E5BA8);stroke-width:1.5"/><text x="30" y="192" style="fill:var(--ink,#131C26);font-size:12px;font-weight:700" text-anchor="start">USB A/B cable</text><text x="30" y="209" style="fill:var(--muted,#56616E);font-size:10px;font-weight:400" text-anchor="start">other end to the PC</text><path d="M170 180 H215" style="fill:none;stroke:var(--accent,#1E5BA8);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-00-box-contents-ah-accent)"/><rect x="20" y="224" width="150" height="44" rx="8" style="fill:var(--surface,#FFFFFF);stroke:var(--warn,#965800);stroke-width:1.5;stroke-dasharray:6 4"/><text x="30" y="242" style="fill:var(--ink,#131C26);font-size:11px;font-weight:700" text-anchor="start">1.2 m black ground lead</text><text x="30" y="259" style="fill:var(--muted,#56616E);font-size:10px;font-weight:400" text-anchor="start">other end to earth ground</text><path d="M170 222 H216" style="fill:none;stroke:var(--warn,#965800);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 4" marker-end="url(#install-00-box-contents-ah-warn)"/><rect x="430" y="180" width="150" height="50" rx="8" style="fill:var(--surface,#FFFFFF);stroke:var(--accent,#1E5BA8);stroke-width:1.5"/><text x="440" y="200" style="fill:var(--ink,#131C26);font-size:12px;font-weight:700" text-anchor="start">60 cm cell cable</text><text x="440" y="218" style="fill:var(--muted,#56616E);font-size:10px;font-weight:400" text-anchor="start">tighten both screws</text><path d="M428 205 H388" style="fill:none;stroke:var(--accent,#1E5BA8);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-00-box-contents-ah-accent)"/><path d="M480 230 C 480 280, 375 280, 375 326" style="fill:none;stroke:var(--warn,#965800);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 4" marker-end="url(#install-00-box-contents-ah-warn)"/><path d="M540 230 V326" style="fill:none;stroke:var(--ok,#2B7346);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-00-box-contents-ah-ok)"/><rect x="290" y="330" width="170" height="84" rx="8" style="fill:var(--warn-soft,#F6EAD3);stroke:var(--warn,#965800);stroke-width:1.2"/><text x="300" y="350" style="fill:var(--warn,#965800);font-size:11.5px;font-weight:700" text-anchor="start">Calibration only</text><text x="300" y="369" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:400" text-anchor="start">200 Ω cell inside the Shield</text><text x="300" y="386" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:400" text-anchor="start">Black lead to Shield post</text><text x="300" y="403" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:400" text-anchor="start">Chassis Ground to earth</text><rect x="470" y="330" width="110" height="84" rx="8" style="fill:var(--ok-soft,#DDEFE3);stroke:var(--ok,#2B7346);stroke-width:1.2"/><text x="480" y="350" style="fill:var(--ok,#2B7346);font-size:11.5px;font-weight:700" text-anchor="start">Experiments</text><text x="480" y="369" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:400" text-anchor="start">to your cell</text><text x="480" y="386" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:400" text-anchor="start">store the cal kit</text><rect x="20" y="330" width="258" height="84" rx="8" style="fill:var(--sunk,#E2E7EC)"/><text x="30" y="350" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:700" text-anchor="start">Other items</text><text x="30" y="369" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:400" text-anchor="start">20 kΩ cell: cable calibration only</text><text x="30" y="386" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:400" text-anchor="start">Accessory kit: reference-electrode adapter</text><text x="30" y="403" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:400" text-anchor="start">Labels: front-panel label slot (optional)</text></svg>
