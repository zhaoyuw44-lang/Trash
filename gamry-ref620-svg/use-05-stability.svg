<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-label="振荡对策：先在软件中降低控制放大器速度、提高 I/E 稳定性设置；仍振荡时，可加快速组合参比电极、在红白线之间加高频旁路电容，或在对电极线上串电阻。" style="font-family:var(--f-body,'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif)"><title>振荡对策：先在软件中降低控制放大器速度、提高 I/E 稳定性设置；仍振荡时，可加快速组合参比电极、在红白线之间加高频旁路电容，或在对电极线上串电阻。</title><rect x="0" y="0" width="600" height="330" style="fill:var(--surface,#FFFFFF)"/><text x="20" y="24" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="start">先在软件中降低控制放大器速度、提高 I/E 稳定性；仍振荡再试以下接法（手册第 8 章）</text><rect x="10" y="38" width="186" height="252" rx="10" style="fill:none;stroke:var(--rule,#C9D1DA);stroke-width:1.2"/><text x="103" y="60" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="middle">快速组合参比电极</text><rect x="32" y="160" width="142" height="50" rx="4" style="fill:var(--solution,#D4E6F2)"/><rect x="207" y="38" width="186" height="252" rx="10" style="fill:none;stroke:var(--rule,#C9D1DA);stroke-width:1.2"/><text x="300" y="60" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="middle">高频旁路电容</text><rect x="229" y="160" width="142" height="50" rx="4" style="fill:var(--solution,#D4E6F2)"/><rect x="404" y="38" width="186" height="252" rx="10" style="fill:none;stroke:var(--rule,#C9D1DA);stroke-width:1.2"/><text x="497" y="60" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="middle">对电极线串电阻</text><rect x="426" y="160" width="142" height="50" rx="4" style="fill:var(--solution,#D4E6F2)"/><path d="M30 86 H102" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:5.1;stroke-linecap:round;stroke-linejoin:round"/><path d="M30 86 H102" style="fill:none;stroke:var(--lead-re,#F4F4F0);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"/><path d="M102 86 H80 V120" style="fill:none;stroke:var(--ink,#131C26);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><rect x="72" y="120" width="16" height="80" rx="4" style="fill:var(--sunk,#E2E7EC);stroke:var(--ink,#131C26);stroke-width:1.2"/><text x="80" y="222" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:700" text-anchor="middle">SCE</text><path d="M102 86 H121.0 M127.0 86 H146" style="fill:none;stroke:var(--ink,#131C26);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><path d="M121.0 77 V95 M127.0 77 V95" style="fill:none;stroke:var(--ink,#131C26);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"/><path d="M146 86 V120" style="fill:none;stroke:var(--ink,#131C26);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><path d="M146 120 V200" style="fill:none;stroke:var(--electrode,#8C96A1);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round"/><text x="146" y="222" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:700" text-anchor="middle">Pt 丝</text><text x="124" y="72" style="fill:var(--accent,#1E5BA8);font-size:10px;font-weight:700" text-anchor="middle">100 pF–10 nF</text><text x="24" y="246" style="fill:var(--ink,#131C26);font-size:11px;font-weight:400" text-anchor="start">直流电位来自 SCE，</text><text x="24" y="262" style="fill:var(--ink,#131C26);font-size:11px;font-weight:400" text-anchor="start">交流反馈来自 Pt 丝</text><path d="M257 74 V150" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:5.1;stroke-linecap:round;stroke-linejoin:round"/><path d="M257 74 V150" style="fill:none;stroke:var(--lead-we,#2E9A55);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"/><rect x="253" y="150" width="8" height="50" rx="2" style="fill:var(--electrode,#8C96A1)"/><text x="257" y="222" style="fill:var(--ink,#131C26);font-size:10.5px;font-weight:700" text-anchor="middle">WE</text><path d="M307 74 V150" style="fill:none;stroke:var(--wire-outline,#3A4450);stroke-width:5.1;stroke-linecap:round;stroke-linejoin:round"/><path d="M307 74 V150" style="fill:none;stroke:var(--lead-re,#F4F4F0);stroke-width:2.6;stroke-linecap:round;