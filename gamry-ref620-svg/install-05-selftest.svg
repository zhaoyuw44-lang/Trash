<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 282" width="600" height="282" role="img" aria-label="开机自检时序：Power 灯亮约 1 秒、闪 3 次、然后常亮为正常；亮后熄灭不再亮为故障。USB 灯常绿表示连接有效，闪橙表示正在收发数据。" style="font-family:var(--f-body,'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif)"><title>开机自检时序：Power 灯亮约 1 秒、闪 3 次、然后常亮为正常；亮后熄灭不再亮为故障。USB 灯常绿表示连接有效，闪橙表示正在收发数据。</title><defs><marker id="install-05-selftest-ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--ink,#131C26)"/></marker></defs><rect x="0" y="0" width="600" height="282" style="fill:var(--surface,#FFFFFF)"/><path d="M150 30 V232" style="fill:none;stroke:var(--muted,#56616E);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 4"/><text x="20" y="62" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="start">Power 灯</text><text x="20" y="79" style="fill:var(--ok,#2B7346);font-size:11.5px;font-weight:600" text-anchor="start">正常</text><path d="M150 74 H570" style="fill:none;stroke:var(--rule,#C9D1DA);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"/><rect x="150" y="50" width="80" height="24" rx="2" style="fill:#3C8CFF"/><rect x="250" y="50" width="20" height="24" rx="2" style="fill:#3C8CFF"/><rect x="290" y="50" width="20" height="24" rx="2" style="fill:#3C8CFF"/><rect x="330" y="50" width="20" height="24" rx="2" style="fill:#3C8CFF"/><rect x="370" y="50" width="200" height="24" rx="2" style="fill:#3C8CFF"/><text x="190" y="42" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">约 1 秒</text><text x="300" y="42" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">闪 3 次</text><text x="470" y="42" style="fill:var(--ok,#2B7346);font-size:11.5px;font-weight:700" text-anchor="middle">常亮 = 自检通过</text><text x="20" y="122" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="start">Power 灯</text><text x="20" y="139" style="fill:var(--danger,#B42318);font-size:11.5px;font-weight:600" text-anchor="start">异常</text><path d="M150 134 H570" style="fill:none;stroke:var(--rule,#C9D1DA);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"/><rect x="150" y="110" width="80" height="24" rx="2" style="fill:#3C8CFF"/><text x="400" y="127" style="fill:var(--danger,#B42318);font-size:12px;font-weight:700" text-anchor="middle">熄灭后不再亮 = 故障，联系 Gamry</text><text x="20" y="186" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="start">USB 灯</text><text x="20" y="203" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="start">已接 USB</text><path d="M150 198 H570" style="fill:none;stroke:var(--rule,#C9D1DA);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"/><rect x="150" y="174" width="420" height="24" rx="2" style="fill:#37C66B"/><rect x="420" y="174" width="16" height="24" rx="0" style="fill:#F08A24"/><rect x="446" y="174" width="10" height="24" rx="0" style="fill:#F08A24"/><rect x="468" y="174" width="20" height="24" rx="0" style="fill:#F08A24"/><rect x="500" y="174" width="10" height="24" rx="0" style="fill:#F08A24"/><text x="260" y="166" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="middle">常绿 = USB 连接有效</text><text x="466" y="166" style="fill:var(--warn,#965800);font-size:11.5px;font-weight:600" text-anchor="middle">闪橙 = 正在收发数据</text><path d="M150 232 H574" style="fill:none;stroke:var(--ink,#131C26);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-05-selftest-ah-ink)"/><text x="156" y="250" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:600" text-anchor="start">打开电源开关</text><text x="574" y="250" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="end">时间</text><text x="20" y="272" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="start">时间比例为示意，非精确时长。</text></svg>
