<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 322" width="600" height="322" role="img" aria-label="上电自检：打开电源开关后 Power 灯亮一两秒、闪 3 次、然后常亮为正常；亮后熄灭不再亮或出现两段闪码表示故障；运行中在 GIM 点 Blink 会让它闪 5 次。" style="font-family:var(--f-body,'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif)"><title>上电自检：打开电源开关后 Power 灯亮一两秒、闪 3 次、然后常亮为正常；亮后熄灭不再亮或出现两段闪码表示故障；运行中在 GIM 点 Blink 会让它闪 5 次。</title><defs><marker id="install-05-selftest-ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--ink,#131C26)"/></marker></defs><rect x="0" y="0" width="600" height="322" style="fill:var(--surface,#FFFFFF)"/><path d="M150 30 V262" style="fill:none;stroke:var(--muted,#56616E);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 4"/><text x="20" y="60" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="start">Power 灯</text><text x="20" y="77" style="fill:var(--ok,#2B7346);font-size:11.5px;font-weight:600" text-anchor="start">正常</text><path d="M150 72 H570" style="fill:none;stroke:var(--rule,#C9D1DA);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"/><text x="20" y="120" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="start">Power 灯</text><text x="20" y="137" style="fill:var(--danger,#B42318);font-size:11.5px;font-weight:600" text-anchor="start">未正常工作</text><path d="M150 132 H570" style="fill:none;stroke:var(--rule,#C9D1DA);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"/><text x="20" y="180" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="start">Power 灯</text><text x="20" y="197" style="fill:var(--danger,#B42318);font-size:11.5px;font-weight:600" text-anchor="start">故障闪码</text><path d="M150 192 H570" style="fill:none;stroke:var(--rule,#C9D1DA);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"/><text x="20" y="240" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="start">Power 灯</text><text x="20" y="257" style="fill:var(--accent,#1E5BA8);font-size:11.5px;font-weight:600" text-anchor="start">运行中按 Blink</text><path d="M150 252 H570" style="fill:none;stroke:var(--rule,#C9D1DA);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"/><rect x="150" y="48" width="80" height="24" rx="2" style="fill:#3C8CFF"/><rect x="250" y="48" width="20" height="24" rx="2" style="fill:#3C8CFF"/><rect x="290" y="48" width="20" height="24" rx="2" style="fill:#3C8CFF"/><rect x="330" y="48" width="20" height="24" rx="2" style="fill:#3C8CFF"/><rect x="370" y="48" width="200" height="24" rx="2" style="fill:#3C8CFF"/><text x="190" y="41" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">亮一两秒</text><text x="300" y="41" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">闪 3 次</text><text x="470" y="41" style="fill:var(--ok,#2B7346);font-size:11.5px;font-weight:700" text-anchor="middle">常亮 = 自检通过</text><rect x="150" y="108" width="80" height="24" rx="2" style="fill:#3C8CFF"/><text x="400" y="125" style="fill:var(--danger,#B42318);font-size:12px;font-weight:700" text-anchor="middle">亮后熄灭、不再亮 → 联系 Gamry</text><rect x="150" y="168" width="80" height="24" rx="2" style="fill:#3C8CFF"/><rect x="246" y="168" width="12" height="24" rx="2" style="fill:#3C8CFF"/><rect x="270" y="168" width="12" height="24" rx="2" style="fill:#3C8CFF"/><rect x="306" y="168" width="12" height="24" rx="2" style="fill:#3C8CFF"/><rect x="330" y="168" width="12" height="24" rx="2" style="fill:#3C8CFF"/><rect x="354" y="168" width="12" height="24" rx="2" style="fill:#3C8CFF"/><text x="264" y="162" style="fill:var(--muted,#56616E);font-size:10px;font-weight:400" text-anchor="middle">2 次</text><text x="336" y="162" style="fill:var(--muted,#56616E);font-size:10px;font-weight:400" text-anchor="middle">3 次</text><text x="478" y="185" style="fill:var(--danger,#B42318);font-size:11.5px;font-weight:700" text-anchor="middle">两段闪码 = 模块故障，联系 Gamry</text><rect x="150" y="228" width="100" height="24" rx="2" style="fill:#3C8CFF"/><rect x="262" y="228" width="12" height="24" rx="2" style="fill:#3C8CFF"/><rect x="286" y="228" width="12" height="24" rx="2" style="fill:#3C8CFF"/><rect x="310" y="228" width="12" height="24" rx="2" style="fill:#3C8CFF"/><rect x="334" y="228" width="12" height="24" rx="2" style="fill:#3C8CFF"/><rect x="358" y="228" width="12" height="24" rx="2" style="fill:#3C8CFF"/><rect x="382" y="228" width="28" height="24" rx="2" style="fill:#3C8CFF"/><text x="316" y="222" style="fill:var(--muted,#56616E);font-size:10px;font-weight:400" text-anchor="middle">闪 5 次</text><text x="495" y="245" style="fill:var(--accent,#1E5BA8);font-size:11.5px;font-weight:600" text-anchor="middle">GIM 中点 Blink：闪 5 次</text><path d="M150 272 H574" style="fill:none;stroke:var(--ink,#131C26);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#install-05-selftest-ah-ink)"/><text x="156" y="290" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:600" text-anchor="start">打开电源开关</text><text x="574" y="290" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="end">时间</text><text x="20" y="312" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="start">第 4 行发生在正常运行期间。时间比例为示意；完整闪码表见手册附录 E。</text></svg>
