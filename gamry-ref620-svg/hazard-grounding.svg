<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" aria-label="接地对比：样品已接地时，仪器保持浮地没有回路；机壳也接大地时，大地把回路闭合，电解池经仪器放电，电缆保险丝熔断。" style="font-family:var(--f-body,'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif)"><title>接地对比：样品已接地时，仪器保持浮地没有回路；机壳也接大地时，大地把回路闭合，电解池经仪器放电，电缆保险丝熔断。</title><defs><marker id="hazard-grounding-ah-danger" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--danger,#B42318)"/></marker></defs><rect x="0" y="0" width="600" height="330" style="fill:var(--surface,#FFFFFF)"/><rect x="10" y="18" width="285" height="302" rx="10" style="fill:none;stroke:var(--rule,#C9D1DA);stroke-width:1.2"/><circle cx="34" cy="44" r="9" style="fill:var(--ok,#2B7346)"/><path d="M30 44 L33 47.5 L38.5 40.5" style="fill:none;stroke:var(--surface,#FFFFFF);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"/><text x="50" y="49" style="fill:var(--ok,#2B7346);font-size:14px;font-weight:700" text-anchor="start">仪器保持浮地</text><rect x="30" y="96" width="90" height="64" rx="6" style="fill:var(--panel,#2A3139);stroke:var(--panel-edge,#151A1F);stroke-width:1.5"/><text x="75" y="133" style="fill:var(--panel-ink,#E7ECF1);font-size:13px;font-weight:700" text-anchor="middle">R620</text><rect x="170" y="80" width="104" height="112" rx="10" style="fill:var(--sunk,#E2E7EC);stroke:var(--ink,#131C26);stroke-width:1.5"/><text x="222" y="118" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="middle">高压釜</text><text x="222" y="138" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">金属釜体</text><text x="222" y="156" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">样品与釜体相连</text><path d="M120 128 H170" style="fill:none;stroke:var(--ink,#131C26);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/><text x="145" y="120" style="fill:var(--muted,#56616E);font-size:10.5px;font-weight:400" text-anchor="middle">电极线</text><path d="M222 192 V230" style="fill:none;stroke:var(--ink,#131C26);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><path d="M208 230 H236 M213 236 H231 M218 242 H226" style="fill:none;stroke:var(--ink,#131C26);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><text x="242" y="242" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="start">大地</text><path d="M75 160 V204" style="fill:none;stroke:var(--muted,#56616E);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:4 4"/><text x="75" y="222" style="fill:var(--ok,#2B7346);font-size:11.5px;font-weight:700" text-anchor="middle">机壳不接大地</text><rect x="24" y="262" width="257" height="46" rx="8" style="fill:var(--ok-soft,#DDEFE3);stroke:var(--ok,#2B7346);stroke-width:1.5"/><text x="152" y="282" style="fill:var(--ok,#2B7346);font-size:12.5px;font-weight:700" text-anchor="middle">没有闭合回路</text><text x="152" y="300" style="fill:var(--ink,#131C26);font-size:11px;font-weight:400" text-anchor="middle">浮地设计就是为这类样品准备的</text><rect x="305" y="18" width="285" height="302" rx="10" style="fill:none;stroke:var(--rule,#C9D1DA);stroke-width:1.2"/><circle cx="329" cy="44" r="9" style="fill:var(--danger,#B42318)"/><path d="M325.5 40.5 L332.5 47.5 M332.5 40.5 L325.5 47.5" style="fill:none;stroke:var(--surface,#FFFFFF);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"/><text x="345" y="49" style="fill:var(--danger,#B42318);font-size:14px;font-weight:700" text-anchor="start">机壳也接了大地</text><rect x="325" y="96" width="90" height="64" rx="6" style="fill:var(--panel,#2A3139);stroke:var(--panel-edge,#151A1F);stroke-width:1.5"/><text x="370" y="133" style="fill:var(--panel-ink,#E7ECF1);font-size:13px;font-weight:700" text-anchor="middle">R620</text><rect x="465" y="80" width="104" height="112" rx="10" style="fill:var(--sunk,#E2E7EC);stroke:var(--ink,#13