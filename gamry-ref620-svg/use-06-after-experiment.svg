<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 392" width="600" height="392" role="img" aria-label="实验结束后的正常状态：Cell On 灯熄灭，Overload 灯熄灭，Power 常亮蓝色，USB 常绿；Framework 状态栏从橙色恢复绿色；.DTA 数据已保存；曲线平滑、没有突跳或断点；黄灯熄灭后再拆线。" style="font-family:var(--f-body,'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif)"><title>实验结束后的正常状态：Cell On 灯熄灭，Overload 灯熄灭，Power 常亮蓝色，USB 常绿；Framework 状态栏从橙色恢复绿色；.DTA 数据已保存；曲线平滑、没有突跳或断点；黄灯熄灭后再拆线。</title><rect x="0" y="0" width="600" height="392" style="fill:var(--surface,#FFFFFF)"/><rect x="20" y="30" width="150" height="300" rx="10" style="fill:var(--panel-edge,#151A1F)"/><rect x="28" y="38" width="134" height="284" rx="6" style="fill:var(--panel,#2A3139)"/><text x="95" y="66" style="fill:var(--panel-ink,#E7ECF1);font-size:12.5px;font-weight:700" text-anchor="middle">Reference 620</text><text x="95" y="80" style="fill:var(--panel-ink,#E7ECF1);font-size:7.5px;font-weight:400" text-anchor="middle">Potentiostat/Galvanostat/ZRA</text><text x="122" y="124" style="fill:var(--panel-ink,#E7ECF1);font-size:9.5px;font-weight:400" text-anchor="end">Cell On</text><circle cx="134" cy="121" r="4.5" style="fill:var(--led-off,#4A535D)"/><text x="122" y="142" style="fill:var(--panel-ink,#E7ECF1);font-size:9.5px;font-weight:400" text-anchor="end">Overload</text><circle cx="134" cy="139" r="4.5" style="fill:var(--led-off,#4A535D)"/><rect x="127" y="162" width="14" height="84" rx="4" style="fill:var(--panel-edge,#151A1F);stroke:var(--panel-ink,#E7ECF1);stroke-width:1.5"/><text x="120" y="208" style="fill:var(--panel-ink,#E7ECF1);font-size:9.5px;font-weight:400" text-anchor="end">Cell Cable</text><circle cx="44" cy="296" r="6" style="fill:#3C8CFF"/><circle cx="44" cy="296" r="9" style="fill:none;stroke:#3C8CFF;stroke-width:1.5"/><text x="56" y="299.5" style="fill:var(--panel-ink,#E7ECF1);font-size:9.5px;font-weight:400" text-anchor="start">Power</text><circle cx="44" cy="314" r="6" style="fill:#37C66B"/><circle cx="44" cy="314" r="9" style="fill:none;stroke:#37C66B;stroke-width:1.5"/><text x="56" y="317.5" style="fill:var(--panel-ink,#E7ECF1);font-size:9.5px;font-weight:400" text-anchor="start">USB</text><path d="M140 121 L186 104" style="fill:none;stroke:var(--muted,#56616E);stroke-width:1;stroke-linecap:round;stroke-linejoin:round"/><text x="190" y="104" style="fill:var(--ok,#2B7346);font-size:12px;font-weight:700" text-anchor="start">Cell On：熄灭</text><text x="190" y="120" style="fill:var(--muted,#56616E);font-size:10.5px;font-weight:400" text-anchor="start">实验已结束，可以拆线</text><path d="M140 139 L186 150" style="fill:none;stroke:var(--muted,#56616E);stroke-width:1;stroke-linecap:round;stroke-linejoin:round"/><text x="190" y="150" style="fill:var(--ok,#2B7346);font-size:12px;font-weight:700" text-anchor="start">Overload：熄灭</text><text x="190" y="166" style="fill:var(--muted,#56616E);font-size:10.5px;font-weight:400" text-anchor="start">实验中不应持续常亮</text><path d="M54 290 L186 262" style="fill:none;stroke:var(--muted,#56616E);stroke-width:1;stroke-linecap:round;stroke-linejoin:round"/><text x="190" y="262" style="fill:var(--ok,#2B7346);font-size:12px;font-weight:700" text-anchor="start">Power：常亮蓝色</text><path d="M54 318 L186 300" style="fill:none;stroke:var(--muted,#56616E);stroke-width:1;stroke-linecap:round;stroke-linejoin:round"/><text x="190" y="300" style="fill:var(--ok,#2B7346);font-size:12px;font-weight:700" text-anchor="start">USB：常绿</text><text x="190" y="316" style="fill:var(--muted,#56616E);font-size:10.5px;font-weight:400" text-anchor="start">收发数据时闪烁</text><rect x="390" y="30" width="200" height="70" rx="8" style="fill:var(--sunk,#E2E7EC)"/><text x="400" y="50" style="fill:var(--ink,#131C26);font-size:11px;font-weight:700" text-anchor="start">设备状态栏</text><circle cx="408" cy="68" r="5" style="fill:#F08A24;stroke:var(--wire-outline,#3A4450);stroke-width:1"/><text x="418" y="72" style="fill:var(--ink,#131C26);font-size:11px;font-weight:400" text-anchor="start">运行中：橙色</text><circle cx="408" cy="88" r=