<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="三电极原理：电流经绿线、溶液和红线流过工作电极与对电极；蓝线和白线只感应电压，静电计测得的 E 反馈给控制放大器。" style="font-family:var(--f-body,'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif)"><title>三电极原理：电流经绿线、溶液和红线流过工作电极与对电极；蓝线和白线只感应电压，静电计测得的 E 反馈给控制放大器。</title><defs><marker id="use-01-three-electrode-ah-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--accent,#1E5BA8)"/></marker><marker id="use-01-three-electrode-ah-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--warn,#965800)"/></marker></defs><rect x="0" y="0" width="600" height="340" style="fill:var(--surface,#FFFFFF)"/><rect x="20" y="36" width="200" height="262" rx="8" style="fill:none;stroke:var(--muted,#56616E);stroke-width:1.5;stroke-dasharray:6 5"/><text x="32" y="56" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="start">Reference 620 内部（示意）</text><rect x="36" y="72" width="160" height="56" rx="6" style="fill:var(--accent-soft,#DCE7F5);stroke:var(--accent,#1E5BA8);stroke-width:1.5"/><text x="116" y="95" style="fill:var(--ink,#131C26);font-size:12px;font-weight:700" text-anchor="middle">静电计 Electrometer</text><text x="116" y="115" style="fill:var(--accent,#1E5BA8);font-size:11.5px;font-weight:600" text-anchor="middle">测 E = 蓝 − 白</text><path d="M116 128 V146" style="fill:none;stroke:var(--accent,#1E5BA8);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round" marker-end="url(#use-01-three-electrode-ah-accent)"/><text x="124" y="142" style="fill:var(--accent,#1E5BA8);font-size:10.5px;font-weight:600" text-anchor="start">反馈</text><rect x="36" y="148" width="160" height="56" rx="6" style="fill:var(--sunk,#E2E7EC);stroke:var(--ink,#131C26);stroke-width:1.2"/><text x="116" y="171" style="fill:var(--ink,#131C26);font-size:12px;font-weight:700" text-anchor="middle">控制放大器</text><text x="116" y="191" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">调节输出使 E = 设定值</text><rect x="36" y="224" width="160" height="56" rx="6" style="fill:var(--sunk,#E2E7EC);stroke:var(--ink,#131C26);stroke-width:1.2"/><text x="116" y="247" style="fill:var(--ink,#131C26);font-size:12px;font-weight:700" text-anchor="middle">电流测量 I/E</text><text x="116" y="267" style="fill:var(--muted,#56616E);font-size:11px;font-weight:400" text-anchor="middle">测量流过 WE 的电流 i</text><rect x="332" y="150" width="246" height="144" rx="0" style="fill:var(--solution,#D4E6F2)"/><path d="M330 96 V284 Q330 296 342 296 H568 Q580 296 580 284 V96" style="fill:none;stroke:var(--muted,#56616E);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/><rect x="385" y="74" width="10" height="170" rx="2" style="fill:var(--electrode,#8C96A1)"/><text x="390" y="264" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:700" text-anchor="middle">工作电极</text><text x="390" y="280" style="fill:var(--muted,#56616E);font-size:10.5px;font-weight:400" text-anchor="middle">WE</text><rect x="457" y="74" width="10" height="170" rx="2" style="fill:var(--electrode,#8C96A1)"/><text x="462" y="264" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:700" text-anchor="middle">参比电极</text><text x="462" y="280" style="fill:var(--muted,#56616E);font-size:10.5px;font-weight:400" text-anchor="middle">RE</text><rect x="533" y="74" width="10" height="170" rx="2" style="fill:var(--electrode,#8C96A1)"/><text x="538" y="264" style="fill:var(--ink,#131C26);font-size:11.5px;font-weight:700" text-anchor="middle">对电极</text><text x="538" y="280" style="fill:var(--muted,#56616E);font-size:10.5px;font-weight:400" text-anchor="middle">CE</text><path d="M196 92 C 290 92, 386 40, 386 74" style="fill:none;stroke:var(--wire-outline,#3A44