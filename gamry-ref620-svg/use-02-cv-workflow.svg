<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 282" width="600" height="282" role="img" aria-label="CV 实验流程：准备、接线、选择实验、设参数时 Cell On 黄灯熄灭；运行时黄灯亮，不要触碰；结束灯灭后再拆线，然后用 Echem Analyst 分析。" style="font-family:var(--f-body,'IBM Plex Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif)"><title>CV 实验流程：准备、接线、选择实验、设参数时 Cell On 黄灯熄灭；运行时黄灯亮，不要触碰；结束灯灭后再拆线，然后用 Echem Analyst 分析。</title><defs><marker id="use-02-cv-workflow-ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" style="fill:var(--ink,#131C26)"/></marker></defs><rect x="0" y="0" width="600" height="282" style="fill:var(--surface,#FFFFFF)"/><circle cx="26" cy="20" r="5" style="fill:#F5C531;stroke:var(--wire-outline,#3A4450);stroke-width:1"/><text x="38" y="24" style="fill:var(--muted,#56616E);font-size:11.5px;font-weight:400" text-anchor="start">圆点 = 前面板 Cell On 黄灯状态</text><rect x="20" y="40" width="110" height="64" rx="8" style="fill:var(--sunk,#E2E7EC);stroke:var(--rule,#C9D1DA);stroke-width:1.5"/><text x="75" y="70" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="middle">准备电解池</text><text x="75" y="90" style="fill:var(--muted,#56616E);font-size:10.5px;font-weight:400" text-anchor="middle">低电流放法拉第笼</text><rect x="20" y="112" width="110" height="22" rx="11" style="fill:var(--sunk,#E2E7EC)"/><circle cx="33" cy="123" r="5" style="fill:var(--rule,#C9D1DA);stroke:var(--wire-outline,#3A4450);stroke-width:1"/><text x="82" y="127" style="fill:var(--muted,#56616E);font-size:11px;font-weight:500" text-anchor="middle">灭</text><rect x="170" y="40" width="110" height="64" rx="8" style="fill:var(--sunk,#E2E7EC);stroke:var(--rule,#C9D1DA);stroke-width:1.5"/><text x="225" y="70" style="fill:var(--ink,#131C26);font-size:13px;font-weight:700" text-anchor="middle">按配置接线</text><text x="225" y="90" style="fill:var(--muted,#56616E);font-size:10.5px;font-weight:400" text-anchor="midd