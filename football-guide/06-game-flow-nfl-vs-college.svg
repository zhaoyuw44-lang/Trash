<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1638" viewBox="0 0 1080 1638" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Zen Hei',sans-serif"><defs></defs><rect x="0" y="0" width="1080" height="1638" rx="0" fill="#f6f3ec" /><rect x="0" y="0" width="1080" height="170" rx="0" fill="#0b2545" /><rect x="0" y="166" width="1080" height="4" rx="0" fill="#f4a261" /><text x="60" y="82" font-size="46" fill="#ffffff" font-weight="700" text-anchor="start" ><tspan fill="#f4a261">6 </tspan><tspan>比赛流程 &amp; NFL vs 大学</tspan></text><text x="60" y="134" font-size="26" fill="#cfd8e3" font-weight="400" text-anchor="start" ><tspan>Game Flow — 你看的两场（NFL 与大学碗赛）有什么不同</tspan></text><text x="1020" y="82" font-size="22" fill="#8fa3bf" font-weight="400" text-anchor="end" ><tspan>6/8</tspan></text><text x="60" y="228" font-size="28" fill="#0b2545" font-weight="700" text-anchor="start" ><tspan>一场比赛怎么走</tspan></text><rect x="60" y="278" width="190" height="72" rx="0" fill="#0b2545" /><text x="155.0" y="310" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>Q1 第 1 节</tspan></text><text x="155.0" y="336" font-size="17" fill="#ffffff" font-weight="400" text-anchor="middle" ><tspan>15 分钟</tspan></text><rect x="250" y="278" width="190" height="72" rx="0" fill="#1d4e89" /><text x="345.0" y="310" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>Q2 第 2 节</tspan></text><text x="345.0" y="336" font-size="17" fill="#ffffff" font-weight="400" text-anchor="middle" ><tspan>15 分钟</tspan></text><rect x="440" y="278" width="100" height="72" rx="0" fill="#f4a261" /><text x="490.0" y="310" font-size="21" fill="#0b2545" font-weight="700" text-anchor="middle" ><tspan>中场</tspan></text><text x="490.0" y="336" font-size="17" fill="#0b2545" font-weight="400" text-anchor="middle" ><tspan>Halftime</tspan></text><rect x="540" y="278" width="190" height="72" rx="0" fill="#0b2545" /><text x="635.0" y="310" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>Q3 第 3 节</tspan></text><text x="635.0" y="336" font-size="17" fill="#ffffff" font-weight="400" text-anchor="middle" ><tspan>15 分钟</tspan></text><rect x="730" y="278" width="190" height="72" rx="0" fill="#1d4e89" /><text x="825.0" y="310" font-size="21" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>Q4 第 4 节</tspan></text><text x="825.0" y="336" font-size="17" fill="#ffffff" font-weight="400" text-anchor="middle" ><tspan>15 分钟</tspan></text><rect x="922" y="280" width="96" height="68" rx="6" fill="none" stroke="#4a5363" stroke-width="2" stroke-dasharray="6 5"/><text x="970" y="310" font-size="20" fill="#4a5363" font-weight="700" text-anchor="middle" ><tspan>加时</tspan></text><text x="970" y="336" font-size="17" fill="#4a5363" font-weight="400" text-anchor="middle" ><tspan>OT</tspan></text><line x1="250" y1="278" x2="250" y2="350" stroke="#ffffff" stroke-width="3" stroke-linecap="round" /><line x1="440" y1="278" x2="440" y2="350" stroke="#ffffff" stroke-width="3" stroke-linecap="round" /><line x1="540" y1="278" x2="540" y2="350" stroke="#ffffff" stroke-width="3" stroke-linecap="round" /><line x1="730" y1="278" x2="730" y2="350" stroke="#ffffff" stroke-width="3" stroke-linecap="round" /><line x1="920" y1="278" x2="920" y2="350" stroke="#ffffff" stroke-width="3" stroke-linecap="round" /><text x="415" y="266" font-size="17" fill="#d62839" font-weight="700" text-anchor="middle" ><tspan>▼ 2:00 两分钟警告</tspan></text><text x="895" y="266" font-size="17" fill="#d62839" font-weight="700" text-anchor="middle" ><tspan>▼ 2:00 两分钟警告</tspan></text><text x="60" y="380" font-size="18" fill="#e76f51" font-weight="700" text-anchor="start" ><tspan>▲ Kickoff 开球</tspan></text><text x="540" y="380" font-size="18" fill="#e76f51" font-weight="700" text-anchor="middle" ><tspan>▲ Kickoff 开球</tspan></text><text x="250" y="412" font-size="18" fill="#4a5363" font-weight="400" text-anchor="middle" ><tspan>上半场 1st Half</tspan></text><text x="730" y="412" font-size="18" fill="#4a5363" font-weight="400" text-anchor="middle" ><tspan>下半场 2nd Half</tspan></text><text x="60" y="462" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>• 开赛前掷硬币 </tspan><tspan fill="#1d4ed8">(Coin Toss)</tspan><tspan> 决定谁先开球；比赛时钟 </tspan><tspan fill="#1d4ed8">(Game Clock)</tspan><tspan> 共 60 分钟。</tspan></text><text x="60" y="496" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>• 每次进攻之间有 40 秒进攻计时 </tspan><tspan fill="#1d4ed8">(Play Clock)</tspan><tspan>，实际用时：NFL 约 3 小时，大学约 3.5 小时。</tspan></text><text x="60" y="530" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>• 每队每个半场 3 次暂停 </tspan><tspan fill="#1d4ed8">(Timeouts)</tspan><tspan>；第 2、4 节剩 2:00 时自动停表。</tspan></text><text x="60" y="590" font-size="28" fill="#0b2545" font-weight="700" text-anchor="start" ><tspan>NFL vs 大学 </tspan><tspan fill="#1d4ed8">College (NCAA)</tspan></text><rect x="60" y="610" width="960" height="62" rx="12" fill="#0b2545" /><text x="80" y="650" font-size="21" fill="#ffffff" font-weight="700" text-anchor="start" ><tspan>项目</tspan></text><text x="310" y="650" font-size="21" fill="#ffffff" font-weight="700" text-anchor="start" ><tspan>NFL · 12/27 Dolphins</tspan></text><text x="675" y="650" font-size="21" fill="#f4a261" font-weight="700" text-anchor="start" ><tspan>大学 · 12/30 Music City Bowl</tspan></text><rect x="60" y="672" width="960" height="70" rx="0" fill="#ffffff" /><line x1="60" y1="742" x2="1020" y2="742" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="80" y="703.0" font-size="21" fill="#0b2545" font-weight="700" text-anchor="start" ><tspan>接球有效</tspan></text><text x="80" y="729.0" font-size="17" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>Catch</tspan></text><text x="310" y="714.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>两只脚都要落在界内</tspan></text><text x="675" y="714.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>一只脚落在界内就算</tspan></text><rect x="60" y="742" width="960" height="118" rx="0" fill="#faf7f0" /><line x1="60" y1="860" x2="1020" y2="860" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="80" y="797.0" font-size="21" fill="#0b2545" font-weight="700" text-anchor="start" ><tspan>加时</tspan></text><text x="80" y="823.0" font-size="17" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>Overtime</tspan></text><text x="310" y="780.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>10 分钟，双方都至少拿一次球</tspan></text><text x="310" y="808.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>（2025 年起常规赛也如此）</tspan></text><text x="310" y="836.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>还平就算平局 (Tie)</tspan></text><text x="675" y="780.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>双方轮流从对方 25 码线进攻</tspan></text><text x="675" y="808.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>没有比赛时钟</tspan></text><text x="675" y="836.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>一定要分出胜负</tspan></text><rect x="60" y="860" width="960" height="88" rx="0" fill="#ffffff" /><line x1="60" y1="948" x2="1020" y2="948" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="80" y="900.0" font-size="21" fill="#0b2545" font-weight="700" text-anchor="start" ><tspan>防守干扰传球</tspan></text><text x="80" y="926.0" font-size="17" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>DPI</tspan></text><text x="310" y="897.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>在犯规地点给球</tspan></text><text x="310" y="925.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>（一次可能罚 40+ 码）</tspan></text><text x="675" y="911.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>最多罚 15 码</tspan></text><rect x="60" y="948" width="960" height="88" rx="0" fill="#faf7f0" /><line x1="60" y1="1036" x2="1020" y2="1036" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="80" y="988.0" font-size="21" fill="#0b2545" font-weight="700" text-anchor="start" ><tspan>首攻后停表</tspan></text><text x="80" y="1014.0" font-size="17" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>Clock</tspan></text><text x="310" y="999.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>不停表</tspan></text><text x="675" y="985.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>不停表，但每半场最后</tspan></text><text x="675" y="1013.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>2 分钟内会短暂停表</tspan></text><rect x="60" y="1036" width="960" height="70" rx="0" fill="#ffffff" /><line x1="60" y1="1106" x2="1020" y2="1106" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="80" y="1067.0" font-size="21" fill="#0b2545" font-weight="700" text-anchor="start" ><tspan>两分钟警告</tspan></text><text x="80" y="1093.0" font-size="17" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>2-Min Warning</tspan></text><text x="310" y="1078.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>有</tspan></text><text x="675" y="1078.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>有（2024 年起）</tspan></text><rect x="60" y="1106" width="960" height="88" rx="0" fill="#faf7f0" /><line x1="60" y1="1194" x2="1020" y2="1194" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="80" y="1146.0" font-size="21" fill="#0b2545" font-weight="700" text-anchor="start" ><tspan>中场休息</tspan></text><text x="80" y="1172.0" font-size="17" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>Halftime</tspan></text><text x="310" y="1157.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>约 13 分钟</tspan></text><text x="675" y="1143.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>约 20 分钟</tspan></text><text x="675" y="1171.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>★ 双方乐队 Marching Band 表演</tspan></text><rect x="60" y="1194" width="960" height="88" rx="0" fill="#ffffff" /><line x1="60" y1="1282" x2="1020" y2="1282" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="80" y="1234.0" font-size="21" fill="#0b2545" font-weight="700" text-anchor="start" ><tspan>现场气氛</tspan></text><text x="80" y="1260.0" font-size="17" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>Atmosphere</tspan></text><text x="310" y="1245.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>主场球迷为主</tspan></text><text x="675" y="1231.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>两校乐队、啦啦队、学生</tspan></text><text x="675" y="1259.0" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>得分就奏战歌 Fight Song</tspan></text><line x1="290" y1="672" x2="290" y2="1282" stroke="#e2ddd0" stroke-width="1.5" stroke-linecap="round" /><line x1="655" y1="672" x2="655" y2="1282" stroke="#e2ddd0" stroke-width="1.5" stroke-linecap="round" /><rect x="60" y="610" width="960" height="672" rx="12" fill="none" stroke="#e2ddd0" stroke-width="1.5" /><rect x="60" y="1316" width="960" height="262" rx="18" fill="#fff4d6" stroke="#f0d58a" stroke-width="1" /><text x="88" y="1358" font-size="25" fill="#0b2545" font-weight="700" text-anchor="start" ><tspan>看台礼仪 </tspan><tspan fill="#1d4ed8">Fan Etiquette</tspan></text><text x="88" y="1398" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>• 开赛前唱国歌 </tspan><tspan fill="#1d4ed8">(National Anthem)</tspan><tspan>：起立、脱帽、面向国旗</tspan></text><text x="88" y="1436" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan font-weight="700">• 主队防守 → 大声喊</tspan><tspan>，干扰对方听口令；</tspan><tspan font-weight="700">主队进攻 → 保持安静</tspan></text><text x="88" y="1474" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>• 第 3 攻 </tspan><tspan fill="#1d4ed8">(3rd Down)</tspan><tspan> 主队防守时：全场起立，最吵的时刻</tspan></text><text x="88" y="1512" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>• 人浪 </tspan><tspan fill="#1d4ed8">(The Wave)</tspan><tspan>：轮到你所在的区域时，站起来举手</tspan></text><text x="88" y="1550" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>• 碗赛两队球迷通常各坐一边：穿你支持那队的颜色</tspan></text><text x="540" y="1616" font-size="16" fill="#9aa1ab" font-weight="400" text-anchor="middle" ><tspan>冬季观赛速查 · Football &amp; Game-Day Cheat Sheets</tspan></text></svg>