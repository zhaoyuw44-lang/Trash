><ellipse cx="540" cy="520" rx="14" ry="8" fill="#8b4513" stroke="#ffffff" stroke-width="2"/><line x1="533.7" y1="520" x2="546.3" y2="520" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" /><circle cx="420" cy="285" r="27" fill="#d62839" stroke="#ffffff" stroke-width="3"/><text x="420" y="291" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>S</tspan></text><circle cx="660" cy="285" r="27" fill="#d62839" stroke="#ffffff" stroke-width="3"/><text x="660" y="291" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>S</tspan></text><circle cx="470" cy="400" r="27" fill="#d62839" stroke="#ffffff" stroke-width="3"/><text x="470" y="406" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>LB</tspan></text><circle cx="610" cy="400" r="27" fill="#d62839" stroke="#ffffff" stroke-width="3"/><text x="610" y="406" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>LB</tspan></text><circle cx="140" cy="470" r="27" fill="#d62839" stroke="#ffffff" stroke-width="3"/><text x="140" y="476" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>CB</tspan></text><circle cx="940" cy="470" r="27" fill="#d62839" stroke="#ffffff" stroke-width="3"/><text x="940" y="476" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>CB</tspan></text><circle cx="805" cy="440" r="27" fill="#d62839" stroke="#ffffff" stroke-width="3"/><text x="805" y="446" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>CB</tspan></text><circle cx="385" cy="485" r="27" fill="#d62839" stroke="#ffffff" stroke-width="3"/><text x="385" y="491" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>DE</tspan></text><circle cx="492" cy="485" r="27" fill="#d62839" stroke="#ffffff" stroke-width="3"/><text x="492" y="491" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>DT</tspan></text><circle cx="588" cy="485" r="27" fill="#d62839" stroke="#ffffff" stroke-width="3"/><text x="588" y="491" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>DT</tspan></text><circle cx="695" cy="485" r="27" fill="#d62839" stroke="#ffffff" stroke-width="3"/><text x="695" y="491" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>DE</tspan></text><circle cx="420" cy="556" r="27" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/><text x="420" y="562" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>LT</tspan></text><circle cx="480" cy="556" r="27" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/><text x="480" y="562" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>LG</tspan></text><circle cx="540" cy="556" r="27" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/><text x="540" y="562" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>C</tspan></text><circle cx="600" cy="556" r="27" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/><text x="600" y="562" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>RG</tspan></text><circle cx="660" cy="556" r="27" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/><text x="660" y="562" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>RT</tspan></text><circle cx="724" cy="562" r="27" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/><text x="724" y="568" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>TE</tspan></text><circle cx="540" cy="655" r="27" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/><text x="540" y="661" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>QB</tspan></text><circle cx="612" cy="660" r="27" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/><text x="612" y="666" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>RB</tspan></text><circle cx="140" cy="556" r="27" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/><text x="140" y="562" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>WR</tspan></text><circle cx="940" cy="556" r="27" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/><text x="940" y="562" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>WR</tspan></text><circle cx="812" cy="590" r="27" fill="#1d4ed8" stroke="#ffffff" stroke-width="3"/><text x="812" y="596" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>WR</tspan></text><text x="60" y="858" font-size="28" fill="#1d4ed8" font-weight="700" text-anchor="start" ><tspan>进攻组 Offense</tspan></text><text x="560" y="858" font-size="28" fill="#d62839" font-weight="700" text-anchor="start" ><tspan>防守组 Defense</tspan></text><rect x="60" y="884" width="460" height="78" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="78" y="916" font-size="22" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#1d4ed8" font-size="25">QB  </tspan><tspan fill="#1b2333">Quarterback</tspan><tspan fill="#0b2545">  四分卫</tspan></text><text x="78" y="946" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>进攻指挥官：接球后传球，或交给跑卫</tspan></text><rect x="60" y="972" width="460" height="78" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="78" y="1004" font-size="22" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#1d4ed8" font-size="25">RB  </tspan><tspan fill="#1b2333">Running Back</tspan><tspan fill="#0b2545">  跑卫</tspan></text><text x="78" y="1034" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>持球往前冲，有时也接短传</tspan></text><rect x="60" y="1060" width="460" height="78" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="78" y="1092" font-size="22" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#1d4ed8" font-size="25">WR  </tspan><tspan fill="#1b2333">Wide Receiver</tspan><tspan fill="#0b2545">  外接手</tspan></text><text x="78" y="1122" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>跑出路线去接 QB 的传球，速度最快</tspan></text><rect x="60" y="1148" width="460" height="78" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="78" y="1180" font-size="22" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#1d4ed8" font-size="25">TE  </tspan><tspan fill="#1b2333">Tight End</tspan><tspan fill="#0b2545">  近端锋</tspan></text><text x="78" y="1210" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>站在锋线边上，能阻挡也能接球</tspan></text><rect x="60" y="1236" width="460" height="78" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="78" y="1268" font-size="22" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#1d4ed8" font-size="25">OL  </tspan><tspan fill="#1b2333">Offensive Line</tspan><tspan fill="#0b2545">  进攻锋线</tspan></text><text x="78" y="1298" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>C 中锋 · G 护锋 · T 截锋：保护 QB、开路</tspan></text><rect x="560" y="884" width="460" height="78" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="578" y="916" font-size="22" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#d62839" font-size="25">DL  </tspan><tspan fill="#1b2333">Defensive Line</tspan><tspan fill="#0b2545">  防守锋线</tspan></text><text x="578" y="946" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>DE 端锋 · DT 截锋：冲击 QB、堵住跑球</tspan></text><rect x="560" y="972" width="460" height="78" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="578" y="1004" font-size="22" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#d62839" font-size="25">LB  </tspan><tspan fill="#1b2333">Linebacker</tspan><tspan fill="#0b2545">  线卫</tspan></text><text x="578" y="1034" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>防守中坚：既防跑，也防传</tspan></text><rect x="560" y="1060" width="460" height="78" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="578" y="1092" font-size="22" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#d62839" font-size="25">CB  </tspan><tspan fill="#1b2333">Cornerback</tspan><tspan fill="#0b2545">  角卫</tspan></text><text x="578" y="1122" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>贴身盯防外接手</tspan></text><rect x="560" y="1148" width="460" height="78" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="578" y="1180" font-size="22" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#d62839" font-size="25">S  </tspan><tspan fill="#1b2333">Safety</tspan><tspan fill="#0b2545">  安全卫</tspan></text><text x="578" y="1210" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>站在最后面，最后一道防线</tspan></text><rect x="560" y="1236" width="460" height="78" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="578" y="1268" font-size="22" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#d62839" font-size="25">目标  </tspan><tspan fill="#1b2333">Goal</tspan><tspan fill="#0b2545">  </tspan></text><text x="578" y="1298" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>擒杀 QB (Sack)、抄截 (INT)、逼对方掉球 (Fumble)</tspan></text><text x="60" y="1372" font-size="28" fill="#e76f51" font-weight="700" text-anchor="start" ><tspan>特勤组 Special Teams</tspan><tspan fill="#0b2545">：踢球时才上场</tspan></text><rect x="60" y="1394" width="225" height="128" rx="16" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="78" y="1434" font-size="28" fill="#e76f51" font-weight="700" text-anchor="start" ><tspan>K</tspan></text><text x="78" y="1468" font-size="20" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan>Kicker</tspan></text><text x="78" y="1500" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>踢球手：射门、开球</tspan></text><rect x="305" y="1394" width="225" height="128" rx="16" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="323" y="1434" font-size="28" fill="#e76f51" font-weight="700" text-anchor="start" ><tspan>P</tspan></text><text x="323" y="1468" font-size="20" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan>Punter</tspan></text><text x="323" y="1500" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>弃踢手：第 4 攻踢远</tspan></text><rect x="550" y="1394" width="225" height="128" rx="16" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="568" y="1434" font-size="28" fill="#e76f51" font-weight="700" text-anchor="start" ><tspan>LS</tspan></text><text x="568" y="1468" font-size="20" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan>Long Snapper</tspan></text><text x="568" y="1500" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>长开球员：踢球时发球</tspan></text><rect x="795" y="1394" width="225" height="128" rx="16" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="813" y="1434" font-size="28" fill="#e76f51" font-weight="700" text-anchor="start" ><tspan>KR / PR</tspan></text><text x="813" y="1468" font-size="20" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan>Returner</tspan></text><text x="813" y="1500" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>回攻手：接球往回跑</tspan></text><rect x="60" y="1550" width="960" height="100" rx="18" fill="#fff4d6" stroke="#f0d58a" stroke-width="1" /><text x="88" y="1590" font-size="22" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan font-weight="700">看球小技巧：</tspan><tspan>先盯住 QB。开球后看他把球传给谁 (WR / TE)，</tspan></text><text x="88" y="1626" font-size="22" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>或者交给谁 (RB)，就能跟上每一次进攻。</tspan></text><text x="540" y="1670" font-size="16" fill="#9aa1ab" font-weight="400" text-anchor="middle" ><tspan>冬季观赛速查 · Football &amp; Game-Day Cheat Sheets</tspan></text></svg>