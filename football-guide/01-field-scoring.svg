<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1662" viewBox="0 0 1080 1662" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Zen Hei',sans-serif"><defs></defs><rect x="0" y="0" width="1080" height="1662" rx="0" fill="#f6f3ec" /><rect x="0" y="0" width="1080" height="170" rx="0" fill="#0b2545" /><rect x="0" y="166" width="1080" height="4" rx="0" fill="#f4a261" /><text x="60" y="82" font-size="46" fill="#ffffff" font-weight="700" text-anchor="start" ><tspan fill="#f4a261">1 </tspan><tspan>球场与得分</tspan></text><text x="60" y="134" font-size="26" fill="#cfd8e3" font-weight="400" text-anchor="start" ><tspan>Field &amp; Scoring — 先看懂场地，再看懂比分</tspan></text><text x="1020" y="82" font-size="22" fill="#8fa3bf" font-weight="400" text-anchor="end" ><tspan>1/8</tspan></text><rect x="60" y="240" width="960" height="400" rx="0" fill="#2d6a4f" /><rect x="140" y="240" width="80" height="400" rx="0" fill="#2d6a4f" /><rect x="220" y="240" width="80" height="400" rx="0" fill="#368059" /><rect x="300" y="240" width="80" height="400" rx="0" fill="#2d6a4f" /><rect x="380" y="240" width="80" height="400" rx="0" fill="#368059" /><rect x="460" y="240" width="80" height="400" rx="0" fill="#2d6a4f" /><rect x="540" y="240" width="80" height="400" rx="0" fill="#368059" /><rect x="620" y="240" width="80" height="400" rx="0" fill="#2d6a4f" /><rect x="700" y="240" width="80" height="400" rx="0" fill="#368059" /><rect x="780" y="240" width="80" height="400" rx="0" fill="#2d6a4f" /><rect x="860" y="240" width="80" height="400" rx="0" fill="#368059" /><rect x="60" y="240" width="80" height="400" rx="0" fill="#14365f" /><rect x="940" y="240" width="80" height="400" rx="0" fill="#14365f" /><text x="100" y="448.0" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle" transform="rotate(-90 100 440.0)" letter-spacing="2"><tspan>END ZONE · 端区</tspan></text><text x="980" y="448.0" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle" transform="rotate(90 980 440.0)" letter-spacing="2"><tspan>END ZONE · 端区</tspan></text><line x1="140" y1="240" x2="140" y2="640" stroke="#ffffff" stroke-width="6" stroke-linecap="round" /><line x1="180" y1="240" x2="180" y2="640" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.85"/><line x1="220" y1="240" x2="220" y2="640" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.85"/><line x1="260" y1="240" x2="260" y2="640" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.85"/><line x1="300" y1="240" x2="300" y2="640" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.85"/><line x1="340" y1="240" x2="340" y2="640" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.85"/><line x1="380" y1="240" x2="380" y2="640" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.85"/><line x1="420" y1="240" x2="420" y2="640" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.85"/><line x1="460" y1="240" x2="460" y2="640" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.85"/><line x1="500" y1="240" x2="500" y2="640" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.85"/><line x1="540" y1="240" x2="540" y2="640" stroke="#f4a261" stroke-width="4" stroke-linecap="round" /><line x1="580" y1="240" x2="580" y2="640" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.85"/><line x1="620" y1="240" x2="620" y2="640" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.85"/><line x1="660" y1="240" x2="660" y2="640" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.85"/><line x1="700" y1="240" x2="700" y2="640" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.85"/><line x1="740" y1="240" x2="740" y2="640" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.85"/><line x1="780" y1="240" x2="780" y2="640" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.85"/><line x1="820" y1="240" x2="820" y2="640" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.85"/><line x1="860" y1="240" x2="860" y2="640" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.85"/><line x1="900" y1="240" x2="900" y2="640" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.85"/><line x1="940" y1="240" x2="940" y2="640" stroke="#ffffff" stroke-width="6" stroke-linecap="round" /><text x="220" y="310" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>10</tspan></text><text x="220" y="598" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>10</tspan></text><text x="300" y="310" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>20</tspan></text><text x="300" y="598" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>20</tspan></text><text x="380" y="310" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>30</tspan></text><text x="380" y="598" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>30</tspan></text><text x="460" y="310" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>40</tspan></text><text x="460" y="598" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>40</tspan></text><text x="540" y="310" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>50</tspan></text><text x="540" y="598" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>50</tspan></text><text x="620" y="310" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>40</tspan></text><text x="620" y="598" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>40</tspan></text><text x="700" y="310" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>30</tspan></text><text x="700" y="598" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>30</tspan></text><text x="780" y="310" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>20</tspan></text><text x="780" y="598" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>20</tspan></text><text x="860" y="310" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>10</tspan></text><text x="860" y="598" font-size="30" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>10</tspan></text><rect x="44" y="410.0" width="10" height="60" rx="3" fill="#ffd60a" /><rect x="1026" y="410.0" width="10" height="60" rx="3" fill="#ffd60a" /><ellipse cx="540" cy="440.0" rx="20" ry="12" fill="#8b4513" stroke="#ffffff" stroke-width="2"/><line x1="531.0" y1="440.0" x2="549.0" y2="440.0" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" /><text x="140" y="226" font-size="20" fill="#0b2545" font-weight="700" text-anchor="middle" ><tspan>球门线 Goal Line</tspan></text><text x="540" y="226" font-size="20" fill="#b5651d" font-weight="700" text-anchor="middle" ><tspan>中线 50-yard line</tspan></text><text x="940" y="226" font-size="20" fill="#0b2545" font-weight="700" text-anchor="middle" ><tspan>球门线 Goal Line</tspan></text><path d="M62,654 v10 H138 v-10" fill="none" stroke="#4a5363" stroke-width="2"/><path d="M142,654 v10 H938 v-10" fill="none" stroke="#4a5363" stroke-width="2"/><path d="M942,654 v10 H1018 v-10" fill="none" stroke="#4a5363" stroke-width="2"/><text x="100" y="694" font-size="20" fill="#4a5363" font-weight="400" text-anchor="middle" ><tspan>10 码</tspan></text><text x="540" y="694" font-size="20" fill="#4a5363" font-weight="400" text-anchor="middle" ><tspan>100 码 Yards（约 91 米），每 10 码一条数字线</tspan></text><text x="980" y="694" font-size="20" fill="#4a5363" font-weight="400" text-anchor="middle" ><tspan>10 码</tspan></text><rect x="60" y="714" width="22" height="22" rx="4" fill="#ffd60a" /><text x="96" y="732" font-size="21" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan font-weight="700">黄色 = 球门柱 Goal Post</tspan><tspan>：射门要从两根立柱中间、横梁上方穿过</tspan></text><rect x="60" y="752" width="22" height="22" rx="4" fill="#14365f" /><text x="96" y="770" font-size="21" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan font-weight="700">深蓝 = 端区 End Zone</tspan><tspan>：带球进入，或在这里接住传球 = 达阵</tspan></text><text x="60" y="808" font-size="21" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan fill="#d62839" font-weight="700">→ </tspan><tspan>两队各守一边，都想把球推进</tspan><tspan font-weight="700">对方的端区</tspan></text><text x="60" y="870" font-size="34" fill="#0b2545" font-weight="700" text-anchor="start" ><tspan>怎么得分 </tspan><tspan fill="#1d4ed8">Scoring</tspan></text><rect x="60" y="895" width="960" height="104" rx="18" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><circle cx="124" cy="947" r="38" fill="#d62839"/><text x="124" y="961" font-size="40" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>6</tspan></text><text x="186" y="939" font-size="29" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#1d4ed8">Touchdown (TD)</tspan><tspan fill="#0b2545">  达阵</tspan></text><text x="186" y="979" font-size="22" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>带球冲进对方端区，或在端区里接住传球。最主要的得分方式。</tspan></text><rect x="60" y="1015" width="960" height="104" rx="18" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><circle cx="124" cy="1067" r="38" fill="#457b9d"/><text x="124" y="1081" font-size="40" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>1</tspan></text><text x="186" y="1059" font-size="29" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#1d4ed8">Extra Point (PAT)</tspan><tspan fill="#0b2545">  附加分</tspan></text><text x="186" y="1099" font-size="22" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>达阵后可以加踢一个近距离射门，踢进 +1 分（几乎都能进）。</tspan></text><rect x="60" y="1135" width="960" height="104" rx="18" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><circle cx="124" cy="1187" r="38" fill="#2a9d8f"/><text x="124" y="1201" font-size="40" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>2</tspan></text><text x="186" y="1179" font-size="29" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#1d4ed8">Two-Point Conversion</tspan><tspan fill="#0b2545">  两分转换</tspan></text><text x="186" y="1219" font-size="22" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>达阵后不踢，改为在球门线前再攻一次，冲进端区 +2 分。</tspan></text><rect x="60" y="1255" width="960" height="104" rx="18" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><circle cx="124" cy="1307" r="38" fill="#f4a261"/><text x="124" y="1321" font-size="40" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>3</tspan></text><text x="186" y="1299" font-size="29" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#1d4ed8">Field Goal (FG)</tspan><tspan fill="#0b2545">  射门</tspan></text><text x="186" y="1339" font-size="22" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>离端区不够近、但在射程内时，把球踢过横梁、从两根立柱之间穿过。</tspan></text><rect x="60" y="1375" width="960" height="104" rx="18" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><circle cx="124" cy="1427" r="38" fill="#6c757d"/><text x="124" y="1441" font-size="40" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>2</tspan></text><text x="186" y="1419" font-size="29" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#1d4ed8">Safety</tspan><tspan fill="#0b2545">  安防</tspan></text><text x="186" y="1459" font-size="22" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>进攻方在自己的端区里被放倒，防守方得 2 分（很少见）。</tspan></text><rect x="60" y="1505" width="960" height="100" rx="18" fill="#fff4d6" stroke="#f0d58a" stroke-width="1" /><text x="88" y="1545" font-size="22" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan font-weight="700">小技巧：</tspan><tspan>比分常是 7（6+1）和 3 的组合，例如 10、14、17、24。</tspan></text><text x="88" y="1583" font-size="22" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>差距在 8 分以内叫 </tspan><tspan fill="#1d4ed8" font-weight="700">one-score game</tspan><tspan>：一次达阵 + 两分转换就能追平。</tspan></text><text x="540" y="1640" font-size="16" fill="#9aa1ab" font-weight="400" text-anchor="middle" ><tspan>冬季观赛速查 · Football &amp; Game-Day Cheat Sheets</tspan></text></svg>