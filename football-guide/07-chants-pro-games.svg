<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1979" viewBox="0 0 1080 1979" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Zen Hei',sans-serif"><defs></defs><rect x="0" y="0" width="1080" height="1979" rx="0" fill="#f6f3ec" /><rect x="0" y="0" width="1080" height="170" rx="0" fill="#0b2545" /><rect x="0" y="166" width="1080" height="4" rx="0" fill="#f4a261" /><text x="60" y="82" font-size="46" fill="#ffffff" font-weight="700" text-anchor="start" ><tspan fill="#f4a261">7 </tspan><tspan>现场口号 &amp; 传统：职业比赛</tspan></text><text x="60" y="134" font-size="26" fill="#cfd8e3" font-weight="400" text-anchor="start" ><tspan>Chants &amp; Traditions — Celtics · Dolphins · Panthers</tspan></text><text x="1020" y="82" font-size="22" fill="#8fa3bf" font-weight="400" text-anchor="end" ><tspan>7/8</tspan></text><rect x="60" y="205" width="960" height="552" rx="20" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="60" y="205" width="960" height="84" rx="20" fill="#007a33" /><rect x="60" y="265" width="960" height="24" rx="0" fill="#007a33" /><text x="88" y="245" font-size="30" fill="#ffffff" font-weight="700" text-anchor="start" ><tspan>Boston Celtics 凯尔特人 · NBA</tspan></text><text x="88" y="277" font-size="19" fill="#ffffff" font-weight="400" text-anchor="start" fill-opacity="0.92"><tspan>TD Garden · 12/23 vs Trail Blazers · 12/25 圣诞大战 vs Heat</tspan></text><text x="88" y="333" font-size="25" fill="#007a33" font-weight="700" text-anchor="start" ><tspan>Let's go Cel-tics!（啪啪 · 啪啪啪）</tspan></text><text x="88" y="363" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>最常用的助威：喊完跟着节奏拍 5 下手</tspan></text><line x1="88" y1="373" x2="992" y2="373" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="88" y="407" font-size="25" fill="#007a33" font-weight="700" text-anchor="start" ><tspan>DE-FENSE!  DE-FENSE!</tspan></text><text x="88" y="437" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>对方进攻时全场齐喊；有人会举起 “D” 和小栅栏 (fence) 的牌子</tspan></text><line x1="88" y1="447" x2="992" y2="447" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="88" y="481" font-size="25" fill="#007a33" font-weight="700" text-anchor="start" ><tspan>M-V-P!  M-V-P!</tspan></text><text x="88" y="511" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>主队头号球星站上罚球线时，全场一起喊</tspan></text><line x1="88" y1="521" x2="992" y2="521" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="88" y="555" font-size="25" fill="#007a33" font-weight="700" text-anchor="start" ><tspan>Gino Time</tspan></text><text x="88" y="585" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>大比分领先、胜负已定时，大屏幕放 1970 年代舞者 Gino 跳舞的录像 = “赢定了”</tspan></text><line x1="88" y1="595" x2="992" y2="595" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="88" y="629" font-size="25" fill="#007a33" font-weight="700" text-anchor="start" ><tspan>Banner 18</tspan></text><text x="88" y="659" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>凯尔特人有 18 个总冠军，NBA 最多；吉祥物是小矮妖 Lucky the Leprechaun</tspan></text><line x1="88" y1="669" x2="992" y2="669" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="88" y="703" font-size="25" fill="#007a33" font-weight="700" text-anchor="start" ><tspan>圣诞大战 vs Heat</tspan></text><text x="88" y="733" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>两队是东部宿敌 (Rivalry)；对方罚球时，篮筐后的球迷会挥手干扰</tspan></text><rect x="60" y="783" width="960" height="552" rx="20" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="60" y="783" width="960" height="84" rx="20" fill="#008e97" /><rect x="60" y="843" width="960" height="24" rx="0" fill="#008e97" /><text x="88" y="823" font-size="30" fill="#ffffff" font-weight="700" text-anchor="start" ><tspan>Miami Dolphins 海豚 · NFL</tspan></text><text x="88" y="855" font-size="19" fill="#ffffff" font-weight="400" text-anchor="start" fill-opacity="0.92"><tspan>Hard Rock Stadium · 12/27 13:00 vs Los Angeles Chargers</tspan></text><text x="88" y="911" font-size="25" fill="#008e97" font-weight="700" text-anchor="start" ><tspan>Fins Up!</tspan></text><text x="88" y="941" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>双手放在头顶比成鱼的背鳍；达阵或庆祝时大家一起做</tspan></text><line x1="88" y1="951" x2="992" y2="951" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="88" y="985" font-size="25" fill="#008e97" font-weight="700" text-anchor="start" ><tspan>“Miami Dolphins Number One!”</tspan></text><text x="88" y="1015" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>达阵后全场播放队歌《Miami Dolphins No. 1》，跟着合唱这一句</tspan></text><line x1="88" y1="1025" x2="992" y2="1025" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="88" y="1059" font-size="25" fill="#008e97" font-weight="700" text-anchor="start" ><tspan>DE-FENSE! + 起立制造噪音</tspan></text><text x="88" y="1089" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>Chargers 进攻、尤其是第 3 攻时，站起来尽量吵，让对方听不清口令</tspan></text><line x1="88" y1="1099" x2="992" y2="1099" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="88" y="1133" font-size="25" fill="#008e97" font-weight="700" text-anchor="start" ><tspan>First Down! + 手指前方</tspan></text><text x="88" y="1163" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>主队拿到首攻时，很多球迷会一起朝进攻方向一指</tspan></text><line x1="88" y1="1173" x2="992" y2="1173" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="88" y="1207" font-size="25" fill="#008e97" font-weight="700" text-anchor="start" ><tspan>1972 Perfect Season</tspan></text><text x="88" y="1237" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>Dolphins 是 NFL 史上唯一一支全胜夺冠的球队 (17–0)</tspan></text><line x1="88" y1="1247" x2="992" y2="1247" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="88" y="1281" font-size="25" fill="#008e97" font-weight="700" text-anchor="start" ><tspan>对手口号：Bolt Up!</tspan></text><text x="88" y="1311" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>这是 Chargers（闪电队）球迷的口号，听到知道是谁就行</tspan></text><rect x="60" y="1361" width="960" height="552" rx="20" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="60" y="1361" width="960" height="84" rx="20" fill="#c8102e" /><rect x="60" y="1421" width="960" height="24" rx="0" fill="#c8102e" /><text x="88" y="1401" font-size="30" fill="#ffffff" font-weight="700" text-anchor="start" ><tspan>Florida Panthers 美洲豹 · NHL</tspan></text><text x="88" y="1433" font-size="19" fill="#ffffff" font-weight="400" text-anchor="start" fill-opacity="0.92"><tspan>Amerant Bank Arena · 12/28 19:00 vs Nashville Predators</tspan></text><text x="88" y="1489" font-size="25" fill="#c8102e" font-weight="700" text-anchor="start" ><tspan>Let's go Pan-thers!</tspan></text><text x="88" y="1519" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>最常用的助威口号</tspan></text><line x1="88" y1="1529" x2="992" y2="1529" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="88" y="1563" font-size="25" fill="#c8102e" font-weight="700" text-anchor="start" ><tspan>Goal! 进球</tspan></text><text x="88" y="1593" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>号角 (Goal Horn) 一响，全场起立欢呼</tspan></text><line x1="88" y1="1603" x2="992" y2="1603" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="88" y="1637" font-size="25" fill="#c8102e" font-weight="700" text-anchor="start" ><tspan>Rat Toss 扔塑料老鼠</tspan></text><text x="88" y="1667" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>只在主队赢球、终场后往冰上扔；比赛中别扔，会害主队被罚</tspan></text><line x1="88" y1="1677" x2="992" y2="1677" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="88" y="1711" font-size="25" fill="#c8102e" font-weight="700" text-anchor="start" ><tspan>老鼠的由来</tspan></text><text x="88" y="1741" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>1995 年球员 Scott Mellanby 在更衣室用球杆打死一只老鼠，当晚进了 2 球</tspan></text><line x1="88" y1="1751" x2="992" y2="1751" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="88" y="1785" font-size="25" fill="#c8102e" font-weight="700" text-anchor="start" ><tspan>Hat Trick 帽子戏法</tspan></text><text x="88" y="1815" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>一名球员单场进 3 球，球迷会往冰上扔帽子庆祝</tspan></text><line x1="88" y1="1825" x2="992" y2="1825" stroke="#e2ddd0" stroke-width="1" stroke-linecap="round" /><text x="88" y="1859" font-size="25" fill="#c8102e" font-weight="700" text-anchor="start" ><tspan>两连冠 &amp; 对手</tspan></text><text x="88" y="1889" font-size="19" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>Panthers 是 2024、2025 两届 Stanley Cup 冠军；对手 Predators 来自 “Smashville”</tspan></text><text x="540" y="1957" font-size="16" fill="#9aa1ab" font-weight="400" text-anchor="middle" ><tspan>冬季观赛速查 · Football &amp; Game-Day Cheat Sheets</tspan></text></svg>