<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1594" viewBox="0 0 1080 1594" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Zen Hei',sans-serif"><defs><pattern id="stripes" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#ffffff"/><rect width="5" height="10" fill="#1b2333"/></pattern></defs><rect x="0" y="0" width="1080" height="1594" rx="0" fill="#f6f3ec" /><rect x="0" y="0" width="1080" height="170" rx="0" fill="#0b2545" /><rect x="0" y="166" width="1080" height="4" rx="0" fill="#f4a261" /><text x="60" y="82" font-size="46" fill="#ffffff" font-weight="700" text-anchor="start" ><tspan fill="#f4a261">5 </tspan><tspan>黄旗与裁判手势</tspan></text><text x="60" y="134" font-size="26" fill="#cfd8e3" font-weight="400" text-anchor="start" ><tspan>Penalties &amp; Signals — 看懂犯规和裁判在比划什么</tspan></text><text x="1020" y="82" font-size="22" fill="#8fa3bf" font-weight="400" text-anchor="end" ><tspan>5/8</tspan></text><rect x="60" y="200" width="960" height="190" rx="18" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><line x1="104" y1="226" x2="104" y2="360" stroke="#1b2333" stroke-width="5" stroke-linecap="round" /><path d="M106,228 h58 l-10,18 l10,18 h-58 z" fill="#ffd60a" stroke="#c9a400" stroke-width="2"/><text x="190" y="242" font-size="23" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>裁判扔出黄色小旗 </tspan><tspan fill="#1d4ed8" font-weight="700">(Flag)</tspan><tspan font-weight="700"> = 有人犯规。</tspan></text><text x="190" y="280" font-size="22" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>罚则通常是退后 5 / 10 / 15 码 (Yards)；</tspan></text><text x="190" y="318" font-size="22" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>有些还会直接给对方首攻 </tspan><tspan fill="#1d4ed8">(Automatic First Down)</tspan><tspan>。</tspan></text><text x="190" y="356" font-size="22" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>主队被罚时，全场会嘘 (Boo)。</tspan></text><text x="60" y="432" font-size="26" fill="#1d4ed8" font-weight="700" text-anchor="start" ><tspan>进攻方常见 Offense</tspan></text><text x="550" y="432" font-size="26" fill="#d62839" font-weight="700" text-anchor="start" ><tspan>防守方常见 Defense</tspan></text><rect x="60" y="452" width="470" height="88" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="80" y="487" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="start" ><tspan>False Start</tspan></text><rect x="430" y="464" width="86" height="32" rx="16" fill="#1d4ed8" /><text x="473" y="486" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>−5</tspan></text><text x="80" y="522" font-size="18" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan fill="#0b2545" font-weight="700">抢跑：</tspan><tspan>开球前，进攻锋线先动了</tspan></text><rect x="60" y="550" width="470" height="88" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="80" y="585" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="start" ><tspan>Holding</tspan></text><rect x="430" y="562" width="86" height="32" rx="16" fill="#1d4ed8" /><text x="473" y="584" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>−10</tspan></text><text x="80" y="620" font-size="18" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan fill="#0b2545" font-weight="700">拉人：</tspan><tspan>抓住、拉住对方球员（防守方犯则 +5）</tspan></text><rect x="60" y="648" width="470" height="88" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="80" y="683" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="start" ><tspan>Delay of Game</tspan></text><rect x="430" y="660" width="86" height="32" rx="16" fill="#1d4ed8" /><text x="473" y="682" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>−5</tspan></text><text x="80" y="718" font-size="18" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan fill="#0b2545" font-weight="700">延误比赛：</tspan><tspan>进攻计时走完还没开球</tspan></text><rect x="60" y="746" width="470" height="88" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="80" y="781" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="start" ><tspan>Offensive Pass Interference</tspan></text><rect x="430" y="758" width="86" height="32" rx="16" fill="#1d4ed8" /><text x="473" y="780" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>−10</tspan></text><text x="80" y="816" font-size="18" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan fill="#0b2545" font-weight="700">进攻干扰：</tspan><tspan>接球手推开防守球员抢球</tspan></text><rect x="60" y="844" width="470" height="88" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="80" y="879" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="start" ><tspan>Illegal Block in the Back</tspan></text><rect x="430" y="856" width="86" height="32" rx="16" fill="#1d4ed8" /><text x="473" y="878" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>−10</tspan></text><text x="80" y="914" font-size="18" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan fill="#0b2545" font-weight="700">背后阻挡：</tspan><tspan>从背后推人，多见于回攻</tspan></text><rect x="550" y="452" width="470" height="88" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="570" y="487" font-size="21" fill="#d62839" font-weight="700" text-anchor="start" ><tspan>Offside</tspan></text><rect x="920" y="464" width="86" height="32" rx="16" fill="#d62839" /><text x="963" y="486" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>+5</tspan></text><text x="570" y="522" font-size="18" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan fill="#0b2545" font-weight="700">越位：</tspan><tspan>开球前，防守球员越过了争球线</tspan></text><rect x="550" y="550" width="470" height="88" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="570" y="585" font-size="21" fill="#d62839" font-weight="700" text-anchor="start" ><tspan>Pass Interference (DPI)</tspan></text><rect x="920" y="562" width="86" height="32" rx="16" fill="#d62839" /><text x="963" y="584" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>犯规点</tspan></text><text x="570" y="620" font-size="18" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan fill="#0b2545" font-weight="700">防守干扰：</tspan><tspan>球到前碰撞接球手（大学最多罚 15 码）</tspan></text><rect x="550" y="648" width="470" height="88" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="570" y="683" font-size="21" fill="#d62839" font-weight="700" text-anchor="start" ><tspan>Roughing the Passer</tspan></text><rect x="920" y="660" width="86" height="32" rx="16" fill="#d62839" /><text x="963" y="682" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>+15</tspan></text><text x="570" y="718" font-size="18" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan fill="#0b2545" font-weight="700">粗暴对待四分卫：</tspan><tspan>QB 传出球后还去撞他</tspan></text><rect x="550" y="746" width="470" height="88" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="570" y="781" font-size="21" fill="#d62839" font-weight="700" text-anchor="start" ><tspan>Personal Foul</tspan></text><rect x="920" y="758" width="86" height="32" rx="16" fill="#d62839" /><text x="963" y="780" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>+15</tspan></text><text x="570" y="816" font-size="18" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan fill="#0b2545" font-weight="700">个人犯规：</tspan><tspan>多余的粗暴动作，如抓面罩</tspan></text><rect x="550" y="844" width="470" height="88" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="570" y="879" font-size="21" fill="#d62839" font-weight="700" text-anchor="start" ><tspan>Targeting</tspan></text><rect x="920" y="856" width="86" height="32" rx="16" fill="#d62839" /><text x="963" y="878" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>+15</tspan></text><text x="570" y="914" font-size="18" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan fill="#0b2545" font-weight="700">头盔撞击（大学）：</tspan><tspan>用头盔顶人，直接罚出场</tspan></text><text x="60" y="985" font-size="28" fill="#0b2545" font-weight="700" text-anchor="start" ><tspan>看懂裁判手势 </tspan><tspan fill="#1d4ed8">Referee Signals</tspan></text><rect x="60" y="1002" width="960" height="369" rx="18" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><g transform="translate(0 24)"><circle cx="156" cy="1075" r="17" fill="#ffe8d1" stroke="#1b2333" stroke-width="3"/><rect x="141" y="1094" width="30" height="72" rx="6" fill="url(#stripes)" stroke="#1b2333" stroke-width="3"/><line x1="150" y1="1166" x2="134" y2="1230" stroke="#1b2333" stroke-width="6" stroke-linecap="round" /><line x1="162" y1="1166" x2="178" y2="1230" stroke="#1b2333" stroke-width="6" stroke-linecap="round" /><line x1="143" y1="1100" x2="130" y2="1020" stroke="#1b2333" stroke-width="6" stroke-linecap="round" /><line x1="169" y1="1100" x2="182" y2="1020" stroke="#1b2333" stroke-width="6" stroke-linecap="round" /></g><text x="156" y="1296" font-size="23" fill="#0b2545" font-weight="700" text-anchor="middle" ><tspan>Touchdown</tspan></text><text x="156" y="1326" font-size="21" fill="#1b2333" font-weight="700" text-anchor="middle" ><tspan>达阵 / 射门成功</tspan></text><text x="156" y="1354" font-size="17" fill="#4a5363" font-weight="400" text-anchor="middle" ><tspan>双手举过头顶</tspan></text><g transform="translate(0 24)"><circle cx="348" cy="1075" r="17" fill="#ffe8d1" stroke="#1b2333" stroke-width="3"/><rect x="333" y="1094" width="30" height="72" rx="6" fill="url(#stripes)" stroke="#1b2333" stroke-width="3"/><line x1="342" y1="1166" x2="326" y2="1230" stroke="#1b2333" stroke-width="6" stroke-linecap="round" /><line x1="354" y1="1166" x2="370" y2="1230" stroke="#1b2333" stroke-width="6" stroke-linecap="round" /><line x1="361" y1="1102" x2="428" y2="1102" stroke="#1b2333" stroke-width="6" stroke-linecap="round" /><path d="M432,1102 l-12,-8 v16 z" fill="#d62839"/><line x1="335" y1="1100" x2="324" y2="1160" stroke="#1b2333" stroke-width="6" stroke-linecap="round" /></g><text x="348" y="1296" font-size="23" fill="#0b2545" font-weight="700" text-anchor="middle" ><tspan>First Down</tspan></text><text x="348" y="1326" font-size="21" fill="#1b2333" font-weight="700" text-anchor="middle" ><tspan>首攻</tspan></text><text x="348" y="1354" font-size="17" fill="#4a5363" font-weight="400" text-anchor="middle" ><tspan>手臂指向进攻方向</tspan></text><g transform="translate(0 24)"><circle cx="540" cy="1075" r="17" fill="#ffe8d1" stroke="#1b2333" stroke-width="3"/><rect x="525" y="1094" width="30" height="72" rx="6" fill="url(#stripes)" stroke="#1b2333" stroke-width="3"/><line x1="534" y1="1166" x2="518" y2="1230" stroke="#1b2333" stroke-width="6" stroke-linecap="round" /><line x1="546" y1="1166" x2="562" y2="1230" stroke="#1b2333" stroke-width="6" stroke-linecap="round" /><line x1="527" y1="1104" x2="460" y2="1104" stroke="#1b2333" stroke-width="6" stroke-linecap="round" /><line x1="553" y1="1104" x2="620" y2="1104" stroke="#1b2333" stroke-width="6" stroke-linecap="round" /><path d="M474,1084 q-14,20 0,40" fill="none" stroke="#d62839" stroke-width="3"/><path d="M606,1084 q14,20 0,40" fill="none" stroke="#d62839" stroke-width="3"/></g><text x="540" y="1296" font-size="23" fill="#0b2545" font-weight="700" text-anchor="middle" ><tspan>Incomplete</tspan></text><text x="540" y="1326" font-size="21" fill="#1b2333" font-weight="700" text-anchor="middle" ><tspan>传球没接到</tspan></text><text x="540" y="1354" font-size="17" fill="#4a5363" font-weight="400" text-anchor="middle" ><tspan>双臂左右来回挥</tspan></text><g transform="translate(0 24)"><circle cx="732" cy="1075" r="17" fill="#ffe8d1" stroke="#1b2333" stroke-width="3"/><rect x="717" y="1094" width="30" height="72" rx="6" fill="url(#stripes)" stroke="#1b2333" stroke-width="3"/><line x1="726" y1="1166" x2="710" y2="1230" stroke="#1b2333" stroke-width="6" stroke-linecap="round" /><line x1="738" y1="1166" x2="754" y2="1230" stroke="#1b2333" stroke-width="6" stroke-linecap="round" /><line x1="719" y1="1100" x2="692" y2="1050" stroke="#1b2333" stroke-width="6" stroke-linecap="round" /><line x1="745" y1="1100" x2="772" y2="1050" stroke="#1b2333" stroke-width="6" stroke-linecap="round" /><line x1="692" y1="1050" x2="750" y2="1002" stroke="#1b2333" stroke-width="6" stroke-linecap="round" /><line x1="772" y1="1050" x2="714" y2="1002" stroke="#1b2333" stroke-width="6" stroke-linecap="round" /></g><text x="732" y="1296" font-size="23" fill="#0b2545" font-weight="700" text-anchor="middle" ><tspan>Timeout</tspan></text><text x="732" y="1326" font-size="21" fill="#1b2333" font-weight="700" text-anchor="middle" ><tspan>暂停</tspan></text><text x="732" y="1354" font-size="17" fill="#4a5363" font-weight="400" text-anchor="middle" ><tspan>双手在头顶交叉</tspan></text><g transform="translate(0 24)"><circle cx="924" cy="1075" r="17" fill="#ffe8d1" stroke="#1b2333" stroke-width="3"/><rect x="909" y="1094" width="30" height="72" rx="6" fill="url(#stripes)" stroke="#1b2333" stroke-width="3"/><line x1="918" y1="1166" x2="902" y2="1230" stroke="#1b2333" stroke-width="6" stroke-linecap="round" /><line x1="930" y1="1166" x2="946" y2="1230" stroke="#1b2333" stroke-width="6" stroke-linecap="round" /><path d="M911,1100 L888,1132 L920,1128" fill="none" stroke="#1b2333" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><path d="M937,1100 L960,1132 L928,1128" fill="none" stroke="#1b2333" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="924" cy="1128" r="8" fill="#d62839"/></g><text x="924" y="1296" font-size="23" fill="#0b2545" font-weight="700" text-anchor="middle" ><tspan>Holding</tspan></text><text x="924" y="1326" font-size="21" fill="#1b2333" font-weight="700" text-anchor="middle" ><tspan>拉人</tspan></text><text x="924" y="1354" font-size="17" fill="#4a5363" font-weight="400" text-anchor="middle" ><tspan>一手握住另一手腕</tspan></text><rect x="60" y="1399" width="960" height="152" rx="18" fill="#fff4d6" stroke="#f0d58a" stroke-width="1" /><text x="88" y="1436" font-size="23" fill="#0b2545" font-weight="700" text-anchor="start" ><tspan>听懂现场广播</tspan></text><text x="88" y="1470" font-size="20" fill="#1d4ed8" font-weight="700" text-anchor="start" ><tspan>“Holding, offense, number 72. Ten-yard penalty. Repeat third down.”</tspan></text><text x="88" y="1502" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>= 进攻方 72 号拉人，罚退 10 码，重打第 3 攻。</tspan></text><text x="88" y="1534" font-size="20" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>如果罚则对受害方反而不利，可以拒绝 </tspan><tspan fill="#1d4ed8" font-weight="700">(Declined)</tspan><tspan>。</tspan></text><text x="540" y="1572" font-size="16" fill="#9aa1ab" font-weight="400" text-anchor="middle" ><tspan>冬季观赛速查 · Football &amp; Game-Day Cheat Sheets</tspan></text></svg>