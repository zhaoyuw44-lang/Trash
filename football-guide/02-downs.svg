<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1540" viewBox="0 0 1080 1540" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Zen Hei',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker></defs><rect x="0" y="0" width="1080" height="1540" rx="0" fill="#f6f3ec" /><rect x="0" y="0" width="1080" height="170" rx="0" fill="#0b2545" /><rect x="0" y="166" width="1080" height="4" rx="0" fill="#f4a261" /><text x="60" y="82" font-size="46" fill="#ffffff" font-weight="700" text-anchor="start" ><tspan fill="#f4a261">2 </tspan><tspan>四次进攻：最核心的规则</tspan></text><text x="60" y="134" font-size="26" fill="#cfd8e3" font-weight="400" text-anchor="start" ><tspan>Downs &amp; Distance — 4 次机会，推进 10 码</tspan></text><text x="1020" y="82" font-size="22" fill="#8fa3bf" font-weight="400" text-anchor="end" ><tspan>2/8</tspan></text><text x="60" y="228" font-size="25" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>进攻方有 </tspan><tspan fill="#0b2545" font-weight="700">4 次机会 (4 Downs)</tspan><tspan>，要把球往前推进至少 </tspan><tspan fill="#0b2545" font-weight="700">10 码 (Yards)</tspan><tspan>。</tspan></text><text x="60" y="268" font-size="25" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>做到了 → 重新获得 4 次机会，叫 </tspan><tspan fill="#2a9d8f" font-weight="700">First Down（首攻）</tspan><tspan>；做不到 → 球权交给对方。</tspan></text><rect x="60" y="345" width="960" height="225" rx="0" fill="#2d6a4f" /><rect x="60.0" y="345" width="192" height="225" rx="0" fill="#2d6a4f" /><rect x="252.0" y="345" width="192" height="225" rx="0" fill="#368059" /><rect x="444.0" y="345" width="192" height="225" rx="0" fill="#2d6a4f" /><rect x="636.0" y="345" width="192" height="225" rx="0" fill="#368059" /><rect x="828.0" y="345" width="192" height="225" rx="0" fill="#2d6a4f" /><line x1="60.0" y1="345" x2="60.0" y2="570" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.85"/><line x1="252.0" y1="345" x2="252.0" y2="570" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.85"/><line x1="444.0" y1="345" x2="444.0" y2="570" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.85"/><line x1="636.0" y1="345" x2="636.0" y2="570" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.85"/><line x1="828.0" y1="345" x2="828.0" y2="570" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.85"/><line x1="1020.0" y1="345" x2="1020.0" y2="570" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.85"/><text x="72" y="554" font-size="28" fill="#ffffff" font-weight="700" text-anchor="start" fill-opacity="0.9"><tspan>20</tspan></text><text x="444.0" y="554" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle" fill-opacity="0.9"><tspan>30</tspan></text><text x="828.0" y="554" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle" fill-opacity="0.9"><tspan>40</tspan></text><line x1="252.0" y1="345" x2="252.0" y2="570" stroke="#3a86ff" stroke-width="7" stroke-linecap="round" /><line x1="636.0" y1="345" x2="636.0" y2="570" stroke="#ffd60a" stroke-width="7" stroke-linecap="round" /><text x="252.0" y="331" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="middle" ><tspan>争球线 Line of Scrimmage</tspan></text><text x="636.0" y="331" font-size="21" fill="#a07800" font-weight="700" text-anchor="middle" ><tspan>首攻线 First Down Line</tspan></text><line x1="256.0" y1="400" x2="381.59999999999997" y2="400" stroke="#ffffff" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="255.54999999999995" y="367" width="146.5" height="28" rx="8" fill="#173f2d" fill-opacity="0.92"/><text x="328.79999999999995" y="387" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>① 跑球 +4 码</tspan></text><ellipse cx="405.59999999999997" cy="400" rx="17" ry="10" fill="#8b4513" stroke="#ffffff" stroke-width="2"/><line x1="397.95" y1="400" x2="413.24999999999994" y2="400" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" /><line x1="409.59999999999997" y1="455" x2="496.79999999999995" y2="455" stroke="#ffffff" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="389.94999999999993" y="422" width="146.5" height="28" rx="8" fill="#173f2d" fill-opacity="0.92"/><text x="463.19999999999993" y="442" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>② 传球 +3 码</tspan></text><ellipse cx="520.8" cy="455" rx="17" ry="10" fill="#8b4513" stroke="#ffffff" stroke-width="2"/><line x1="513.15" y1="455" x2="528.4499999999999" y2="455" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" /><line x1="524.8" y1="510" x2="688.8" y2="510" stroke="#ffffff" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="486.54999999999995" y="477" width="260.5" height="28" rx="8" fill="#173f2d" fill-opacity="0.92"/><text x="616.8" y="497" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle" ><tspan>③ 传球 +5 码，越过黄线！</tspan></text><ellipse cx="712.8" cy="510" rx="17" ry="10" fill="#8b4513" stroke="#ffffff" stroke-width="2"/><line x1="705.15" y1="510" x2="720.4499999999999" y2="510" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" /><text x="60" y="606" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>电视上的黄线是电脑画的；现场要看边线上的链子 </tspan><tspan fill="#1d4ed8" font-weight="700">The Chains / Sticks</tspan><tspan> 和橙色标杆。</tspan></text><rect x="60" y="632" width="960" height="64" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="90" y="675" font-size="32" fill="#0b2545" font-weight="700" text-anchor="start" ><tspan>1st &amp; 10</tspan></text><text x="320" y="673" font-size="23" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>第 1 攻，还差 10 码</tspan></text><text x="996" y="673" font-size="23" fill="#2a9d8f" font-weight="700" text-anchor="end" ><tspan>+4 码</tspan></text><rect x="60" y="708" width="960" height="64" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="90" y="751" font-size="32" fill="#0b2545" font-weight="700" text-anchor="start" ><tspan>2nd &amp; 6</tspan></text><text x="320" y="749" font-size="23" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>第 2 攻，还差 6 码</tspan></text><text x="996" y="749" font-size="23" fill="#2a9d8f" font-weight="700" text-anchor="end" ><tspan>+3 码</tspan></text><rect x="60" y="784" width="960" height="64" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="90" y="827" font-size="32" fill="#d62839" font-weight="700" text-anchor="start" ><tspan>3rd &amp; 3</tspan></text><text x="320" y="825" font-size="23" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>第 3 攻，还差 3 码  ← 最关键！</tspan></text><text x="996" y="825" font-size="23" fill="#2a9d8f" font-weight="700" text-anchor="end" ><tspan>+5 码 ✓</tspan></text><rect x="60" y="860" width="960" height="64" rx="14" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><text x="90" y="903" font-size="32" fill="#2a9d8f" font-weight="700" text-anchor="start" ><tspan>1st &amp; 10</tspan></text><text x="320" y="901" font-size="23" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan>首攻成功 FIRST DOWN：重新拿到 4 次机会</tspan></text><text x="60" y="968" font-size="21" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan font-weight="700">怎么读：</tspan><tspan>记分牌上的 “3rd &amp; 3” 读作 </tspan><tspan fill="#1d4ed8" font-weight="700">“third and three”</tspan><tspan>（第 3 攻，还差 3 码）。</tspan></text><text x="60" y="1004" font-size="21" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan fill="#1d4ed8" font-weight="700">“1st &amp; Goal”</tspan><tspan> = 离端区已不到 10 码，这一轮的目标直接就是达阵。</tspan></text><text x="60" y="1068" font-size="32" fill="#0b2545" font-weight="700" text-anchor="start" ><tspan>第 4 攻 </tspan><tspan fill="#1d4ed8">4th Down</tspan><tspan>：三选一</tspan></text><rect x="60" y="1092" width="300" height="232" rx="18" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="60" y="1092" width="300" height="10" rx="4" fill="#457b9d" /><text x="82" y="1146" font-size="30" fill="#457b9d" font-weight="700" text-anchor="start" ><tspan>Punt</tspan></text><text x="82" y="1184" font-size="26" fill="#0b2545" font-weight="700" text-anchor="start" ><tspan>弃踢</tspan></text><text x="82" y="1228" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>把球远远踢给对方，</tspan></text><text x="82" y="1258" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>让对方从很远的位置</tspan></text><text x="82" y="1288" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>开始进攻。最常见。</tspan></text><rect x="390" y="1092" width="300" height="232" rx="18" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="390" y="1092" width="300" height="10" rx="4" fill="#f4a261" /><text x="412" y="1146" font-size="30" fill="#f4a261" font-weight="700" text-anchor="start" ><tspan>Field Goal</tspan></text><text x="412" y="1184" font-size="26" fill="#0b2545" font-weight="700" text-anchor="start" ><tspan>射门</tspan></text><text x="412" y="1228" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>离对方端区够近时，</tspan></text><text x="412" y="1258" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>踢射门拿 3 分。</tspan></text><text x="412" y="1288" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>离得越近越稳。</tspan></text><rect x="720" y="1092" width="300" height="232" rx="18" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="720" y="1092" width="300" height="10" rx="4" fill="#d62839" /><text x="742" y="1146" font-size="30" fill="#d62839" font-weight="700" text-anchor="start" ><tspan>Go for it</tspan></text><text x="742" y="1184" font-size="26" fill="#0b2545" font-weight="700" text-anchor="start" ><tspan>冒险进攻</tspan></text><text x="742" y="1228" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>再进攻一次，成功就继续；</tspan></text><text x="742" y="1258" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>失败 = Turnover on Downs，</tspan></text><text x="742" y="1288" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>对方在原地接管球权。</tspan></text><rect x="60" y="1352" width="960" height="140" rx="18" fill="#fff4d6" stroke="#f0d58a" stroke-width="1" /><text x="88" y="1392" font-size="23" fill="#0b2545" font-weight="700" text-anchor="start" ><tspan>现场看点</tspan></text><text x="88" y="1430" font-size="21" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan font-weight="700">• 第 3 攻 (3rd Down) 最关键：</tspan><tspan>主队防守时全场起立大喊，主队进攻时保持安静。</tspan></text><text x="88" y="1466" font-size="21" fill="#1b2333" font-weight="400" text-anchor="start" ><tspan fill="#1d4ed8" font-weight="700">• Drive（进攻回合）</tspan><tspan>= 从拿到球到失去球（得分、弃踢或失误）的整段进攻。</tspan></text><text x="540" y="1518" font-size="16" fill="#9aa1ab" font-weight="400" text-anchor="middle" ><tspan>冬季观赛速查 · Football &amp; Game-Day Cheat Sheets</tspan></text></svg>