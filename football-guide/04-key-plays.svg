<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Zen Hei',sans-serif"><defs></defs><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#f6f3ec" /><rect x="0" y="0" width="1080" height="170" rx="0" fill="#0b2545" /><rect x="0" y="166" width="1080" height="4" rx="0" fill="#f4a261" /><text x="60" y="82" font-size="46" fill="#ffffff" font-weight="700" text-anchor="start" ><tspan fill="#f4a261">4 </tspan><tspan>关键动作 &amp; 名场面</tspan></text><text x="60" y="134" font-size="26" fill="#cfd8e3" font-weight="400" text-anchor="start" ><tspan>Key Plays — 听懂解说，跟上全场欢呼的节奏</tspan></text><text x="1020" y="82" font-size="22" fill="#8fa3bf" font-weight="400" text-anchor="end" ><tspan>4/8</tspan></text><rect x="60" y="205" width="470" height="118" rx="16" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="60" y="205" width="10" height="118" rx="5" fill="#1d4ed8" /><text x="90" y="247" font-size="25" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#1d4ed8">Snap</tspan><tspan fill="#0b2545" font-size="23">  开球（发球）</tspan></text><text x="90" y="281" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>中锋把球从胯下递给四分卫，</tspan></text><text x="90" y="309" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>每一次进攻都从这一下开始。</tspan></text><rect x="550" y="205" width="470" height="118" rx="16" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="550" y="205" width="10" height="118" rx="5" fill="#1d4ed8" /><text x="580" y="247" font-size="25" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#1d4ed8">Pass · Completion</tspan><tspan fill="#0b2545" font-size="23">  传球 · 传成</tspan></text><text x="580" y="281" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>传球被接住 = Completion；</tspan></text><text x="580" y="309" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>没接住落地 = Incomplete，时钟暂停。</tspan></text><rect x="60" y="337" width="470" height="118" rx="16" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="60" y="337" width="10" height="118" rx="5" fill="#1d4ed8" /><text x="90" y="379" font-size="25" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#1d4ed8">Run / Rush</tspan><tspan fill="#0b2545" font-size="23">  跑球</tspan></text><text x="90" y="413" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>持球人直接往前冲。</tspan></text><text x="90" y="441" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>领先的一方爱跑球来消耗时间。</tspan></text><rect x="550" y="337" width="470" height="118" rx="16" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="550" y="337" width="10" height="118" rx="5" fill="#1d4ed8" /><text x="580" y="379" font-size="25" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#1d4ed8">Red Zone</tspan><tspan fill="#0b2545" font-size="23">  红区</tspan></text><text x="580" y="413" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>距离对方端区 20 码以内，</tspan></text><text x="580" y="441" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>最容易得分的区域。</tspan></text><rect x="60" y="469" width="470" height="118" rx="16" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="60" y="469" width="10" height="118" rx="5" fill="#d62839" /><text x="90" y="511" font-size="25" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#d62839">Tackle</tspan><tspan fill="#0b2545" font-size="23">  擒抱</tspan></text><text x="90" y="545" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>把持球人放倒，</tspan></text><text x="90" y="573" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>这一攻就结束了。</tspan></text><rect x="550" y="469" width="470" height="118" rx="16" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="550" y="469" width="10" height="118" rx="5" fill="#d62839" /><text x="580" y="511" font-size="25" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#d62839">Sack</tspan><tspan fill="#0b2545" font-size="23">  擒杀</tspan></text><text x="580" y="545" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>四分卫还没传出球就被放倒在</tspan></text><text x="580" y="573" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>争球线后 → 全场最爆的欢呼！</tspan></text><rect x="60" y="601" width="470" height="118" rx="16" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="60" y="601" width="10" height="118" rx="5" fill="#d62839" /><text x="90" y="643" font-size="25" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#d62839">Interception (INT)</tspan><tspan fill="#0b2545" font-size="23">  抄截</tspan></text><text x="90" y="677" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>防守方把传球接走，</tspan></text><text x="90" y="705" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>球权立刻交换。又叫 Pick。</tspan></text><rect x="550" y="601" width="470" height="118" rx="16" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="550" y="601" width="10" height="118" rx="5" fill="#d62839" /><text x="580" y="643" font-size="25" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#d62839">Fumble</tspan><tspan fill="#0b2545" font-size="23">  掉球</tspan></text><text x="580" y="677" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>持球人被打掉球，双方抢，</tspan></text><text x="580" y="705" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>抢到 = Recovered，球归那一方。</tspan></text><rect x="60" y="733" width="470" height="118" rx="16" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="60" y="733" width="10" height="118" rx="5" fill="#d62839" /><text x="90" y="775" font-size="25" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#d62839">Turnover</tspan><tspan fill="#0b2545" font-size="23">  失误 / 球权转换</tspan></text><text x="90" y="809" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>抄截和掉球被抢的统称，</tspan></text><text x="90" y="837" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>最能改变比赛走向的瞬间。</tspan></text><rect x="550" y="733" width="470" height="118" rx="16" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="550" y="733" width="10" height="118" rx="5" fill="#e76f51" /><text x="580" y="775" font-size="25" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#e76f51">Kickoff</tspan><tspan fill="#0b2545" font-size="23">  开球</tspan></text><text x="580" y="809" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>每个半场开始和每次得分后，</tspan></text><text x="580" y="837" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>把球踢给对方开始进攻。</tspan></text><rect x="60" y="865" width="470" height="118" rx="16" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="60" y="865" width="10" height="118" rx="5" fill="#e76f51" /><text x="90" y="907" font-size="25" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#e76f51">Punt</tspan><tspan fill="#0b2545" font-size="23">  弃踢</tspan></text><text x="90" y="941" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>第 4 攻打不下去时，</tspan></text><text x="90" y="969" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>把球远远踢给对方。</tspan></text><rect x="550" y="865" width="470" height="118" rx="16" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="550" y="865" width="10" height="118" rx="5" fill="#e76f51" /><text x="580" y="907" font-size="25" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#e76f51">Touchback</tspan><tspan fill="#0b2545" font-size="23">  回场</tspan></text><text x="580" y="941" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>球踢进端区、没有往回跑，</tspan></text><text x="580" y="969" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>直接从规定码线开始进攻。</tspan></text><rect x="60" y="997" width="470" height="118" rx="16" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="60" y="997" width="10" height="118" rx="5" fill="#6d28d9" /><text x="90" y="1039" font-size="25" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#6d28d9">Timeout</tspan><tspan fill="#0b2545" font-size="23">  暂停</tspan></text><text x="90" y="1073" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>每队每个半场 3 次，</tspan></text><text x="90" y="1101" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>用来停表或商量战术。</tspan></text><rect x="550" y="997" width="470" height="118" rx="16" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="550" y="997" width="10" height="118" rx="5" fill="#6d28d9" /><text x="580" y="1039" font-size="25" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#6d28d9">Two-Minute Warning</tspan><tspan fill="#0b2545" font-size="23">  两分钟警告</tspan></text><text x="580" y="1073" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>第 2、4 节剩 2 分钟时自动停表，</tspan></text><text x="580" y="1101" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>接着常有 Two-Minute Drill 抢时间进攻。</tspan></text><rect x="60" y="1129" width="470" height="118" rx="16" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="60" y="1129" width="10" height="118" rx="5" fill="#6d28d9" /><text x="90" y="1171" font-size="25" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#6d28d9">Challenge / Review</tspan><tspan fill="#0b2545" font-size="23">  挑战 / 回放</tspan></text><text x="90" y="1205" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>对判罚有疑问就看录像；</tspan></text><text x="90" y="1233" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>NFL 教练扔红旗发起挑战。</tspan></text><rect x="550" y="1129" width="470" height="118" rx="16" fill="#ffffff" stroke="#e2ddd0" stroke-width="1" /><rect x="550" y="1129" width="10" height="118" rx="5" fill="#6d28d9" /><text x="580" y="1171" font-size="25" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan fill="#6d28d9">Hail Mary</tspan><tspan fill="#0b2545" font-size="23">  绝望长传</tspan></text><text x="580" y="1205" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>比赛最后几秒的超远距离长传，</tspan></text><text x="580" y="1233" font-size="20" fill="#4a5363" font-weight="400" text-anchor="start" ><tspan>成功了就是名场面。</tspan></text><rect x="60" y="1272" width="22" height="22" rx="5" fill="#1d4ed8" /><text x="92" y="1290" font-size="20" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan>进攻 Offense</tspan></text><rect x="300" y="1272" width="22" height="22" rx="5" fill="#d62839" /><text x="332" y="1290" font-size="20" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan>防守 Defense</tspan></text><rect x="540" y="1272" width="22" height="22" rx="5" fill="#e76f51" /><text x="572" y="1290" font-size="20" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan>踢球 Kicking</tspan></text><rect x="780" y="1272" width="22" height="22" rx="5" fill="#6d28d9" /><text x="812" y="1290" font-size="20" fill="#1b2333" font-weight="700" text-anchor="start" ><tspan>比赛流程 Game Flow</tspan></text><text x="540" y="1328" font-size="16" fill="#9aa1ab" font-weight="400" text-anchor="middle" ><tspan>冬季观赛速查 · Football &amp; Game-Day Cheat Sheets</tspan></text></svg>